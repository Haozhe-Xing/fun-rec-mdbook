[book]
title = "深度推荐算法实践（小麦书）"
description = "从级联架构到生成式范式——一本系统讲解推荐系统的书"
authors = ["Datawhale", "WorkBuddy 重写版"]
language = "zh"
src = "."

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["styles/website.css"]
additional-js = ["scripts/viz-expand.js", "scripts/in-page-toc.js", "scripts/callouts.js"]
exclude = ["_svg-gallery.html"]

[output.html.search]
enable = true

[output.html.print]
enable = true

[preprocessor.katex]
after = ["links"]
