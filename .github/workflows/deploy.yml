name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          cargo install --locked mdbook@0.4.52 mdbook-katex@0.9.4
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build zh
        run: mdbook build

      - name: Build en
        run: |
          cp book.toml book.toml.zh_bak
          cp book-en.toml book.toml
          mdbook build
          mv book.toml.zh_bak book.toml

      - name: Assemble site root
        run: |
          cp root-index.html book/index.html
          cp llms.txt book/llms.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
