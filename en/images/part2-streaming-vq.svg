<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="340" fill="#f8f9fc" rx="12"/>

  <text x="400" y="34" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">Streaming VQ: Two-Tower + Quantized Index + Real-Time EMA Update</text>

  <!-- twin tower -->
  <rect x="40" y="70" width="200" height="90" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="95" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1e293b">Two-Tower (index step)</text>
  <text x="140" y="118" text-anchor="middle" font-family="Courier New" font-size="11" fill="#1e293b">u, v ← DNN</text>
  <text x="140" y="138" text-anchor="middle" font-family="Courier New" font-size="10" fill="#64748b">L_aux contrastive loss</text>

  <line x1="240" y1="115" x2="298" y2="115" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- quantize -->
  <rect x="310" y="70" width="170" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="95" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1e293b">Vector Quantization Q</text>
  <text x="395" y="118" text-anchor="middle" font-family="Courier New" font-size="10" fill="#1e293b">k* = argmin ‖eᵏ-v‖²</text>
  <text x="395" y="138" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">item → cluster</text>

  <line x1="480" y1="115" x2="538" y2="115" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- index -->
  <rect x="550" y="70" width="210" height="90" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="655" y="95" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#065f46">Streaming Index</text>
  <text x="655" y="116" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">cluster centroids eᵏ</text>
  <text x="655" y="136" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">written live to param server</text>

  <!-- EMA loop -->
  <path d="M655,160 C655,210 500,210 395,165" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <rect x="500" y="178" width="150" height="34" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="575" y="200" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">EMA centroid update</text>

  <!-- service -->
  <rect x="40" y="220" width="360" height="60" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="244" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e293b">Serving: merge sort</text>
  <text x="220" y="266" text-anchor="middle" font-family="Courier New" font-size="11" fill="#1e293b">score = uᵀQ(v) + v_bias</text>

  <!-- balance note -->
  <rect x="440" y="220" width="320" height="60" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="244" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e293b">Index Balance</text>
  <text x="600" y="266" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">L_ind + popularity control + noise</text>

  <rect x="0" y="305" width="800" height="35" fill="#1e293b" rx="0 0 12 12"/>
  <text x="400" y="328" text-anchor="middle" font-family="Courier New" font-size="13" fill="#94a3b8">L_aux replaces L_sim → item-first, index adapts in real time</text>
</svg>
