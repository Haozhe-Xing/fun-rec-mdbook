<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr8" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <filter id="sh8"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="800" height="380" fill="#f8f9fc"/>
  <text x="400" y="34" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">MTGR 数据组织：混合范式</text>

  <!-- History block -->
  <rect x="40" y="70" width="250" height="270" rx="12" fill="#ffffff" stroke="#e8ecff" filter="url(#sh8)"/>
  <text x="165" y="95" font-size="13" font-weight="700" fill="#4A6CF7" text-anchor="middle">历史部分（与 HSTU 一致）</text>
  <rect x="60" y="110" width="210" height="34" rx="8" fill="#f0f4ff" stroke="#4A6CF7"/>
  <text x="165" y="132" font-size="12" fill="#1e293b" text-anchor="middle">User tokens（年龄/性别/城市）</text>
  <rect x="60" y="155" width="210" height="34" rx="8" fill="#f0f4ff" stroke="#4A6CF7"/>
  <text x="165" y="177" font-size="12" fill="#1e293b" text-anchor="middle">Seq tokens（长期行为序列）</text>
  <rect x="60" y="200" width="210" height="34" rx="8" fill="#f0f4ff" stroke="#4A6CF7"/>
  <text x="165" y="222" font-size="12" fill="#1e293b" text-anchor="middle">RealTime tokens（近期交互）</text>
  <text x="165" y="262" font-size="11" fill="#64748b" text-anchor="middle">仅编码历史，不依赖候选</text>
  <text x="165" y="290" font-size="11" fill="#64748b" text-anchor="middle">只编码一次 → 共享计算</text>
  <text x="165" y="320" font-size="11" fill="#10b981" text-anchor="middle">user-level 聚合效率来源</text>

  <!-- Candidate block -->
  <rect x="510" y="70" width="250" height="270" rx="12" fill="#ffffff" stroke="#e8ecff" filter="url(#sh8)"/>
  <text x="635" y="95" font-size="13" font-weight="700" fill="#ef4444" text-anchor="middle">候选部分（判别式目标）</text>
  <rect x="530" y="110" width="210" height="40" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="635" y="128" font-size="12" fill="#1e293b" text-anchor="middle">Cand₁ = MLP(Item₁+Cross₁)</text>
  <rect x="530" y="160" width="210" height="40" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="635" y="178" font-size="12" fill="#1e293b" text-anchor="middle">Cand₂ = MLP(Item₂+Cross₂)</text>
  <rect x="530" y="210" width="210" height="40" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="635" y="228" font-size="12" fill="#1e293b" text-anchor="middle">Cand₃ = MLP(Item₃+Cross₃)</text>
  <text x="635" y="270" font-size="11" fill="#64748b" text-anchor="middle">Cross = 用户×候选 交叉特征</text>
  <text x="635" y="295" font-size="11" fill="#64748b" text-anchor="middle">（如 ctr、pv，依赖历史统计）</text>
  <text x="635" y="320" font-size="11" fill="#ef4444" text-anchor="middle">纯生成式禁用 → MTGR 恢复</text>

  <!-- arrow to Transformer -->
  <line x1="290" y1="205" x2="350" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arr8)"/>
  <line x1="510" y1="205" x2="450" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arr8)"/>
  <rect x="350" y="180" width="100" height="50" rx="8" fill="#f0fdf4" stroke="#10b981"/>
  <text x="400" y="210" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle">统一</text>
  <text x="400" y="326" font-size="11" fill="#64748b" text-anchor="middle">单 Transformer ｜ 复杂度 O((n+m)²)</text>
</svg>
