<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="400" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Wide 部分：交叉特征如何"记忆"共现模式</text>

  <!-- Raw features -->
  <rect x="40" y="80" width="180" height="60" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow2)"/>
  <text x="130" y="105" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">已装 App</text>
  <text x="130" y="126" text-anchor="middle" font-size="12" fill="#64748b">photo_editor</text>

  <rect x="40" y="170" width="180" height="60" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow2)"/>
  <text x="130" y="195" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">曝光 App</text>
  <text x="130" y="216" text-anchor="middle" font-size="12" fill="#64748b">filter_pack</text>

  <!-- Cross function -->
  <rect x="300" y="120" width="150" height="70" rx="8" fill="#4A6CF7" filter="url(#shadow2)"/>
  <text x="375" y="148" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">交叉函数</text>
  <text x="375" y="170" text-anchor="middle" font-size="11" fill="#ffffff">AND(·,·)</text>

  <line x1="220" y1="110" x2="298" y2="138" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="220" y1="200" x2="298" y2="162" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Crossed feature -->
  <rect x="510" y="95" width="240" height="50" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="630" y="116" text-anchor="middle" font-size="12.5" fill="#1e293b">新特征 φ(x)</text>
  <text x="630" y="138" text-anchor="middle" font-size="11" fill="#64748b">installed=editor ∩ impression=pack</text>

  <line x1="450" y1="155" x2="508" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Embedding lookup -->
  <rect x="510" y="175" width="240" height="60" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow2)"/>
  <text x="630" y="198" text-anchor="middle" font-size="12.5" fill="#1e293b">独立权重表</text>
  <text x="630" y="220" text-anchor="middle" font-size="11" fill="#64748b">cross_embedding[index]</text>

  <line x1="630" y1="145" x2="630" y2="173" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Output -->
  <rect x="510" y="270" width="240" height="56" rx="8" fill="#1e293b"/>
  <text x="630" y="293" text-anchor="middle" font-size="12.5" fill="#ffffff" font-weight="600">cross_logit</text>
  <text x="630" y="313" text-anchor="middle" font-size="11" fill="#cbd5e1">直接"记住"该组合强度</text>

  <line x1="630" y1="235" x2="630" y2="268" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>

  <text x="400" y="372" text-anchor="middle" font-size="12" fill="#64748b">每个特征组合一张查表权重 —— 记忆的本质是显式共现查表</text>
</svg>
