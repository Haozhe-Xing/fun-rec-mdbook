<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="480" rx="8" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">Compact Allocation Plan: Solve Duals Offline, Execute Statelessly Online</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#64748b">Plan storage compressed from O(|E|) (edges) to O(|A|) (contracts) · Zero state sync across serving machines</text>

  <!-- Offline lane -->
  <rect x="30" y="86" width="740" height="180" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="52" y="112" font-size="14" font-weight="bold" fill="#4A6CF7">Offline (hourly / daily refresh)</text>

  <g filter="url(#shadow)">
    <rect x="55" y="130" width="150" height="66" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
    <text x="130" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Historical Logs</text>
    <text x="130" y="176" text-anchor="middle" font-size="11" fill="#64748b">impressions + labels + eCPM</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="245" y="130" width="150" height="66" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
    <text x="320" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Traffic Forecasting</text>
    <text x="320" y="176" text-anchor="middle" font-size="11" fill="#64748b">inverted index → sᵢ</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="435" y="130" width="150" height="66" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="510" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">SHALE Primal-Dual Iteration</text>
    <text x="510" y="170" text-anchor="middle" font-size="11" fill="#64748b">alternate updates α ↔ β</text>
    <text x="510" y="187" text-anchor="middle" font-size="11" fill="#f59e0b" font-weight="bold">keep only α (|A|-level)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="625" y="130" width="130" height="66" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="690" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Allocation Ratio Table</text>
    <text x="690" y="176" text-anchor="middle" font-size="11" fill="#64748b">θₐ = dₐ / Σ sᵢ</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="205" y1="163" x2="237" y2="163" marker-end="url(#arrow)"/>
    <line x1="395" y1="163" x2="427" y2="163" marker-end="url(#arrow)"/>
    <line x1="585" y1="163" x2="617" y2="163" marker-end="url(#arrow)"/>
  </g>

  <!-- Downward arrow -->
  <line x1="690" y1="200" x2="690" y2="238" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="712" y="226" font-size="11" fill="#64748b">Push plan</text>

  <!-- Online lane -->
  <rect x="30" y="244" width="740" height="140" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="52" y="270" font-size="14" font-weight="bold" fill="#10b981">Online (per impression, milliseconds)</text>

  <g filter="url(#shadow)">
    <rect x="55" y="286" width="150" height="66" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="130" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Impression Arrives</text>
    <text x="130" y="332" text-anchor="middle" font-size="11" fill="#64748b">user + context labels</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="245" y="286" width="150" height="66" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="320" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Match Candidate Contracts</text>
    <text x="320" y="332" text-anchor="middle" font-size="11" fill="#64748b">labels → edges</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="435" y="286" width="150" height="66" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="510" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Randomized Decision by Ratio</text>
    <text x="510" y="332" text-anchor="middle" font-size="11" fill="#64748b">xᵢₐ = max(0, θₐ(1+αₐ−βᵢ))</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="625" y="286" width="130" height="66" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="690" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Return Remaining Traffic</text>
    <text x="690" y="332" text-anchor="middle" font-size="11" fill="#64748b">monetized via auction</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="205" y1="319" x2="237" y2="319" marker-end="url(#arrow)"/>
    <line x1="395" y1="319" x2="427" y2="319" marker-end="url(#arrow)"/>
    <line x1="585" y1="319" x2="617" y2="319" marker-end="url(#arrow)"/>
  </g>

  <!-- Feedback -->
  <path d="M 690 286 C 690 240, 400 210, 340 196" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="222" text-anchor="middle" font-size="11" fill="#64748b">Logs flow back → next re-solve (new contracts iterate incrementally, no full re-solve)</text>

  <!-- Bottom comparison -->
  <g font-size="12">
    <rect x="55" y="408" width="210" height="46" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="160" y="427" text-anchor="middle" font-weight="bold" fill="#1e293b">Direct LP: O(|E|) variables</text>
    <text x="160" y="445" text-anchor="middle" fill="#ef4444">millions of edges, infeasible</text>
    <rect x="295" y="408" width="210" height="46" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="400" y="427" text-anchor="middle" font-weight="bold" fill="#1e293b">Compact plan: O(|A|) params</text>
    <text x="400" y="445" text-anchor="middle" fill="#d97706">thousands of contracts, stateless</text>
    <rect x="535" y="408" width="210" height="46" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="640" y="427" text-anchor="middle" font-weight="bold" fill="#1e293b">HWM: ratio table + priority</text>
    <text x="640" y="445" text-anchor="middle" fill="#16a34a">no optimization, simplest</text>
  </g>
</svg>
