<svg width="800" height="360" viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrGD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <marker id="arrGG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
    <filter id="shGD" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="360" fill="#f8f9fc" rx="12"/>

  <text x="400" y="34" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#1e293b">Paradigm Shift: Discriminative Cascade → Generative End-to-End</text>

  <!-- Discriminative cascade -->
  <rect x="30" y="70" width="340" height="170" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#shGD)"/>
  <text x="200" y="96" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#4A6CF7">Discriminative Cascade</text>
  <rect x="55" y="115" width="90" height="36" rx="6" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>
  <text x="100" y="138" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">Retrieval</text>
  <rect x="165" y="115" width="90" height="36" rx="6" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>
  <text x="210" y="138" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">Ranking</text>
  <rect x="275" y="115" width="90" height="36" rx="6" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>
  <text x="320" y="138" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">Re-Ranking</text>
  <line x1="145" y1="133" x2="163" y2="133" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrGD)"/>
  <line x1="255" y1="133" x2="273" y2="133" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrGD)"/>
  <text x="200" y="180" text-anchor="middle" font-family="Arial" font-size="11" fill="#ef4444">Misaligned goals / info loss / fragmented compute</text>
  <text x="200" y="205" text-anchor="middle" font-family="Courier New" font-size="11" fill="#64748b">Score = f(U,I,C), per-candidate scoring</text>

  <!-- Generative e2e -->
  <rect x="430" y="70" width="340" height="170" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shGD)"/>
  <text x="600" y="96" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#10b981">Generative End-to-End</text>
  <rect x="500" y="115" width="200" height="44" rx="8" fill="#10b981" stroke="#065f46" stroke-width="1.5"/>
  <text x="600" y="138" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff">Single Generative Model</text>
  <text x="600" y="180" text-anchor="middle" font-family="Arial" font-size="11" fill="#10b981">Unified objective / no cascade info loss</text>
  <text x="600" y="205" text-anchor="middle" font-family="Courier New" font-size="12" fill="#64748b">[I_1..I_k] = g(U,C)</text>

  <line x1="370" y1="155" x2="428" y2="155" stroke="#1e293b" stroke-width="2" marker-end="url(#arrGG)"/>
  <text x="399" y="146" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">shift</text>

  <!-- ability evolution bar -->
  <text x="400" y="278" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e293b">Capability Evolution: Memorization · Generalization → Understanding · Reasoning</text>
  <rect x="60" y="295" width="160" height="34" rx="6" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>
  <text x="140" y="317" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">Pure ID Memory</text>
  <rect x="232" y="295" width="160" height="34" rx="6" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>
  <text x="312" y="317" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">Deep Generalization</text>
  <rect x="404" y="295" width="160" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="484" y="317" text-anchor="middle" font-family="Arial" font-size="10" fill="#065f46">Semantic ID Understanding</text>
  <rect x="576" y="295" width="160" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="656" y="317" text-anchor="middle" font-family="Arial" font-size="12" fill="#065f46">LLM Reasoning</text>

  <rect x="0" y="330" width="800" height="30" fill="#1e293b" rx="0 0 12 12"/>
</svg>
