<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">From business fields to model prediction: the feature processing flow</title>
  <desc id="desc">Raw business fields go through feature processing to become discrete, bucketized and continuous features; model serving then looks up Embeddings and produces the prediction.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4A6CF7"/>
    </marker>
  </defs>
  <rect width="800" height="420" rx="16" fill="#f8f9fc"/>
  <text x="400" y="36" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#1e293b">How Business Fields Become Model Input</text>

  <g filter="url(#shadow)">
    <rect x="30" y="75" width="170" height="230" rx="12" fill="#ffffff" stroke="#4A6CF7" stroke-width="2"/>
    <text x="115" y="106" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#4A6CF7">① Raw Business Fields</text>
    <text x="52" y="145" font-family="Arial, PingFang SC, sans-serif" font-size="14" fill="#1e293b">Gender = male</text>
    <text x="52" y="178" font-family="Arial, PingFang SC, sans-serif" font-size="14" fill="#1e293b">Ad ID = 10001</text>
    <text x="52" y="211" font-family="Arial, PingFang SC, sans-serif" font-size="14" fill="#1e293b">eCPM = 57</text>
    <text x="52" y="244" font-family="Arial, PingFang SC, sans-serif" font-size="14" fill="#1e293b">pCTR = 0.073</text>
    <text x="52" y="280" font-family="Arial, PingFang SC, sans-serif" font-size="11" fill="#64748b">Strings, enums, numbers</text>
  </g>

  <line x1="200" y1="190" x2="245" y2="190" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="250" y="75" width="220" height="230" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="360" y="106" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#b45309">② Feature Processing</text>
    <rect x="272" y="128" width="176" height="38" rx="8" fill="#e8ecff"/>
    <text x="360" y="153" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#1e293b">Discrete: hash / int ID</text>
    <rect x="272" y="180" width="176" height="38" rx="8" fill="#fef3c7"/>
    <text x="360" y="205" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#1e293b">Bucketize: clip / bins</text>
    <rect x="272" y="232" width="176" height="38" rx="8" fill="#dcfce7"/>
    <text x="360" y="257" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#1e293b">Dense: norm / fallback</text>
    <text x="360" y="292" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="11" fill="#64748b">Outputs slotId / featureSign / value</text>
  </g>

  <line x1="470" y1="190" x2="515" y2="190" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="520" y="75" width="250" height="230" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="645" y="106" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#047857">③ Model Serving</text>
    <rect x="545" y="128" width="200" height="38" rx="8" fill="#dcfce7"/>
    <text x="645" y="153" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#1e293b">Emb. lookup by featureSign</text>
    <rect x="545" y="180" width="200" height="38" rx="8" fill="#e8ecff"/>
    <text x="645" y="205" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#1e293b">Scale by value / concat</text>
    <rect x="545" y="232" width="200" height="38" rx="8" fill="#fef3c7"/>
    <text x="645" y="257" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#1e293b">DNN computes CTR / score</text>
    <text x="645" y="292" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#64748b">Embeddings are learned parameters</text>
  </g>

  <rect x="95" y="344" width="610" height="48" rx="10" fill="#1e293b"/>
  <text x="400" y="374" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#ffffff">featureSign is the lookup key; the Embedding is the vector the model uses</text>
</svg>
