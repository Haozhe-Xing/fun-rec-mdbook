<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="600" rx="8" fill="#f8f9fc"/>
  <text x="400" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">Boolean Expression Retrieval: The Two-Layer Inverted Index and the Full Course of One Query</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#64748b">Ad targeting = a union of Conjunctions (DNF) · first-layer index prunes by size tiers · second-layer index Conjunction → ads</text>

  <!-- Left: DNF decomposition -->
  <g filter="url(#shadow)">
    <rect x="28" y="76" width="252" height="216" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2"/>
  </g>
  <text x="154" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A6CF7">① Ad → DNF → Conjunction</text>
  <g font-family="Courier New, monospace" font-size="13" fill="#1e293b">
    <text x="44" y="126">a1 = j1 ∪ j4</text>
    <text x="44" y="146">a2 = j2 ∪ j6</text>
    <text x="44" y="166">a3 = j3 ∪ j7</text>
    <text x="44" y="186">a4 = j5 ∪ j4</text>
    <text x="44" y="206">a5 = j6 ∪ j5</text>
    <text x="44" y="226">a6 = j6 ∪ j1 ∪ j7</text>
    <text x="44" y="246">a7 = j1 ∪ j7</text>
  </g>
  <text x="44" y="272" font-size="11" fill="#64748b">j1=(age∈{3}∩geo∈{Beijing})</text>
  <text x="44" y="286" font-size="11" fill="#64748b">j5=(age∈{3,4}) j6=(geo∉{BJ,GD})</text>

  <!-- Middle: Conjunction inverted index -->
  <g filter="url(#shadow)">
    <rect x="296" y="76" width="248" height="216" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  </g>
  <text x="420" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A6CF7">② Conjunction inverted index (tiered by size)</text>
  <g font-family="Courier New, monospace" font-size="12" fill="#1e293b">
    <text x="308" y="126" font-weight="bold" fill="#ef4444">size=2:</text>
    <text x="308" y="144">(age,3)→{j1,j2,j3}</text>
    <text x="308" y="162">(geo,Beijing)→{j1} (gender,Male)→{j3,j4}</text>
    <text x="308" y="180" font-weight="bold" fill="#f59e0b">size=1:</text>
    <text x="308" y="198">(age,3)→{j5} (age,4)→{j5}</text>
    <text x="308" y="216" font-weight="bold" fill="#10b981">size=0:</text>
    <text x="308" y="234">Z→{j6} (pure ∉ fallback key)</text>
  </g>
  <text x="308" y="262" font-size="11" fill="#64748b">Pruning: tiers with size &gt; the request's label count are skipped outright</text>
  <text x="308" y="278" font-size="11" fill="#64748b">age∈{3,4} splits into the two keys (age,3) and (age,4)</text>

  <!-- Right: Conj -> AD index -->
  <g filter="url(#shadow)">
    <rect x="560" y="76" width="212" height="216" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="666" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#059669">③ Conjunction → ads index</text>
  <g font-family="Courier New, monospace" font-size="12" fill="#1e293b">
    <text x="574" y="130">j1→{a1,a6,a7}</text>
    <text x="574" y="150">j2→{a2}</text>
    <text x="574" y="170">j3→{a3}</text>
    <text x="574" y="190">j4→{a1,a4}</text>
    <text x="574" y="210">j5→{a4,a5}</text>
    <text x="574" y="230">j6→{a2,a5,a6}</text>
    <text x="574" y="250">j7→{a3,a6}</text>
  </g>

  <!-- Query flow -->
  <g filter="url(#shadow)">
    <rect x="40" y="330" width="230" height="110" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="155" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Ad request arrives</text>
  <text x="155" y="380" text-anchor="middle" font-size="12" fill="#64748b">Targeting labels (the query)</text>
  <text x="155" y="402" text-anchor="middle" font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="#d97706">{age=3, geo=Beijing,</text>
  <text x="155" y="422" text-anchor="middle" font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="#d97706">gender=Male}, sizeof=3</text>

  <line x1="272" y1="385" x2="302" y2="385" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="306" y="330" width="222" height="110" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  </g>
  <text x="417" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Layer 1: hit keys yield Conjunctions</text>
  <text x="417" y="380" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="#1e293b">(age,3)→{j1,j2,j3,j5}</text>
  <text x="417" y="400" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="#1e293b">(geo,Beijing)→{j1}</text>
  <text x="417" y="420" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="#1e293b">(gender,Male)→{j3,j4}</text>

  <line x1="530" y1="385" x2="560" y2="385" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="564" y="330" width="208" height="110" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="668" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Layer 2: union yields candidate ads</text>
  <text x="668" y="382" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="#1e293b">ads of ∪{j1..j5}</text>
  <text x="668" y="404" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="#059669" font-weight="bold">Candidates {a1..a7}</text>
  <text x="668" y="424" text-anchor="middle" font-size="11" fill="#64748b">(a superset; over-recall allowed)</text>

  <!-- Final verdict -->
  <g filter="url(#shadow)">
    <rect x="120" y="470" width="560" height="96" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="400" y="498" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">④ Exact boolean evaluation ad by ad → final hits</text>
  <text x="400" y="524" text-anchor="middle" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#059669">{a1, a3, a4, a5, a6, a7}</text>
  <text x="400" y="548" text-anchor="middle" font-size="12" fill="#64748b">a2 excluded: j2 needs gender=Female, j6 needs geo∉{Beijing,Guangdong} — neither holds. The candidate superset's value is exact evaluation on only a few ads</text>
</svg>
