<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="380" fill="#f8f9fc"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Memorization vs Generalization: The Two Abilities of Wide &amp; Deep</text>

  <!-- Memory path (left) -->
  <rect x="40" y="64" width="340" height="280" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="64" width="340" height="40" rx="8" fill="#4A6CF7"/>
  <text x="60" y="90" font-size="14" font-weight="700" fill="#ffffff">🧠 Wide = Memorization (veteran)</text>

  <circle cx="120" cy="160" r="26" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="120" y="165" text-anchor="middle" font-size="14" fill="#4A6CF7" font-weight="700">A</text>
  <text x="120" y="205" text-anchor="middle" font-size="12" fill="#64748b">Bought A</text>

  <circle cx="290" cy="160" r="26" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="290" y="165" text-anchor="middle" font-size="14" fill="#4A6CF7" font-weight="700">B</text>
  <text x="290" y="205" text-anchor="middle" font-size="12" fill="#64748b">Buys B too</text>

  <line x1="146" y1="160" x2="264" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="205" y="150" text-anchor="middle" font-size="11" fill="#64748b">Frequent co-occurrence</text>

  <rect x="70" y="245" width="280" height="72" rx="8" fill="#e8ecff"/>
  <text x="210" y="272" text-anchor="middle" font-size="12.5" fill="#1e293b">Lookup table "remembers" it:</text>
  <text x="210" y="294" text-anchor="middle" font-size="11.5" fill="#1e293b">user bought A → recommend B (strong rule)</text>

  <!-- Generalization path (right) -->
  <rect x="420" y="64" width="340" height="280" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="420" y="64" width="340" height="40" rx="8" fill="#10b981"/>
  <text x="440" y="90" font-size="14" font-weight="700" fill="#ffffff">🌱 Deep = Generalization (newcomer)</text>

  <circle cx="500" cy="160" r="26" fill="#e6f7f1" stroke="#10b981" stroke-width="2"/>
  <text x="500" y="165" text-anchor="middle" font-size="14" fill="#10b981" font-weight="700">A</text>
  <text x="500" y="205" text-anchor="middle" font-size="11" fill="#64748b">"Three-Body Problem"</text>

  <circle cx="670" cy="160" r="26" fill="#e6f7f1" stroke="#10b981" stroke-width="2"/>
  <text x="670" y="165" text-anchor="middle" font-size="12" fill="#10b981" font-weight="700">C</text>
  <text x="670" y="205" text-anchor="middle" font-size="11" fill="#64748b">New hard sci-fi book</text>

  <line x1="526" y1="160" x2="644" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="585" y="150" text-anchor="middle" font-size="11" fill="#64748b">Nearby in vector space</text>

  <rect x="450" y="245" width="280" height="72" rx="8" fill="#e6f7f1"/>
  <text x="590" y="272" text-anchor="middle" font-size="12.5" fill="#1e293b">Embeddings generalize:</text>
  <text x="590" y="294" text-anchor="middle" font-size="11.5" fill="#1e293b">likes A → recommend unseen C</text>

  <!-- bottom note -->
  <text x="400" y="372" text-anchor="middle" font-size="12" fill="#64748b">Complementary: Wide makes recommendations "accurate", Deep makes them "broad"</text>
</svg>
