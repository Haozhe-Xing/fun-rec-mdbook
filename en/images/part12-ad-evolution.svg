  </defs>

  <rect x="0" y="0" width="800" height="560" fill="#f8f9fc"/>
  <text x="400" y="32" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">广告形态演进阶梯</text>
