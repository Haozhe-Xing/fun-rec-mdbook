  <!-- 台阶：从左下到右上，共 8 级 -->
  <!-- 1 CPT -->
  <rect x="30" y="470" width="185" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shadow3)"/>
  <text x="122" y="493" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1e293b">CPT 广告</text>
  <text x="122" y="510" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">定向：时段 / 地理 · 计费：CPT</text>

