  <text x="665" y="76" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">定向：高级 · 计费：RTB 实时竞价</text>

  <!-- 台阶连线 -->
  <line x1="215" y1="470" x2="215" y2="466" stroke="#4A6CF7" stroke-width="2"/>
  <path d="M 215 470 L 160 470 L 160 466" stroke="#4A6CF7" stroke-width="2" fill="none"/>
  <line x1="305" y1="408" x2="305" y2="404" stroke="#4A6CF7" stroke-width="2"/>
  <line x1="395" y1="346" x2="395" y2="342" stroke="#4A6CF7" stroke-width="2"/>
  <line x1="485" y1="284" x2="485" y2="280" stroke="#4A6CF7" stroke-width="2"/>
  <line x1="575" y1="222" x2="575" y2="218" stroke="#4A6CF7" stroke-width="2"/>
  <line x1="665" y1="160" x2="665" y2="156" stroke="#4A6CF7" stroke-width="2"/>
  <line x1="690" y1="98" x2="690" y2="94" stroke="#4A6CF7" stroke-width="2"/>

  <!-- 演进方向箭头 -->
  <path d="M 90 440 Q 350 260 620 70" fill="none" stroke="#4A6CF7" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow3)"/>
  <text x="240" y="270" font-family="Arial" font-size="13" font-weight="bold" fill="#4A6CF7" transform="rotate(-33 240 270)">定向更精细 · 交易更自动 · 计费更贴近效果</text>

  <!-- 底部标注 -->
  <rect x="30" y="80" width="230" height="110" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="145" y="104" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#f59e0b">两股驱动力</text>
  <text x="145" y="126" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">形式演进：内容与广告融合</text>
  <text x="145" y="146" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">（ 信息流 / 原生降低体验伤害 ）</text>
  <text x="145" y="168" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">机制演进：从卖位置到卖人群</text>
  <text x="145" y="182" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">（ CPT/CPM → RTB 实时竞价 ）</text>
</svg>
