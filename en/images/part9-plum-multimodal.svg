<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow9d" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <filter id="shadow9d" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="340" fill="#f8f9fc" rx="12"/>
  <text x="400" y="34" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#1e293b">PLUM：多模态 + 协同信号融合为语义 ID</text>

  <g font-family="Arial" font-size="13" text-anchor="middle">
    <rect x="40" y="70" width="150" height="56" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5" filter="url(#shadow9d)"/>
    <text x="115" y="95" fill="#1e293b">文本塔</text><text x="115" y="114" font-family="Arial" font-size="11" fill="#64748b">标题/ASR</text>
    <rect x="40" y="140" width="150" height="56" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5" filter="url(#shadow9d)"/>
    <text x="115" y="165" fill="#1e293b">视觉塔</text><text x="115" y="184" font-family="Arial" font-size="11" fill="#64748b">关键帧</text>
    <rect x="40" y="210" width="150" height="56" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5" filter="url(#shadow9d)"/>
    <text x="115" y="235" fill="#1e293b">音频塔</text><text x="115" y="254" font-family="Arial" font-size="11" fill="#64748b">音轨特征</text>
    <rect x="40" y="280" width="150" height="44" rx="8" fill="#fef3cd" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow9d)"/>
    <text x="115" y="307" fill="#1e293b">协同塔 (CF)</text>
  </g>

  <!-- concat -->
  <rect x="300" y="150" width="150" height="70" rx="8" fill="#4A6CF7" filter="url(#shadow9d)"/>
  <text x="375" y="180" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">拼接 ⊕</text>
  <text x="375" y="200" text-anchor="middle" font-family="Courier New" font-size="11" fill="#e8ecff">e_final</text>

  <line x1="190" y1="98" x2="296" y2="170" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow9d)"/>
  <line x1="190" y1="168" x2="296" y2="180" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow9d)"/>
  <line x1="190" y1="238" x2="296" y2="195" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow9d)"/>
  <line x1="190" y1="302" x2="296" y2="200" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow9d)"/>

  <!-- RQ-VAE + multi-res -->
  <rect x="520" y="150" width="240" height="70" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow9d)"/>
  <text x="640" y="178" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#10b981">多分辨率 RQ-VAE</text>
  <text x="640" y="200" text-anchor="middle" font-family="Courier New" font-size="11" fill="#64748b">128·256·512·1024 码本</text>
  <line x1="450" y1="185" x2="516" y2="185" stroke="#10b981" stroke-width="2" marker-end="url(#arrow9d)"/>

  <!-- semantic ID -->
  <rect x="520" y="250" width="240" height="56" rx="8" fill="#e8f5ee" stroke="#10b981" stroke-width="1.5" filter="url(#shadow9d)"/>
  <text x="640" y="273" text-anchor="middle" font-family="Courier New" font-size="13" fill="#1e293b">&lt;A37&gt;&lt;B12&gt;&lt;C5&gt;&lt;D8&gt;</text>
  <text x="640" y="293" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">融合「内容 + 用户感知」</text>
  <line x1="640" y1="220" x2="640" y2="248" stroke="#10b981" stroke-width="2" marker-end="url(#arrow9d)"/>
</svg>
