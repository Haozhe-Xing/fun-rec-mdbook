<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="s10" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.15"/>
    </filter>
    <marker id="a10" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="400" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">DIN: Dynamically Activating Relevant History by Target Item</text>

  <!-- LEFT: baseline pooling -->
  <rect x="30" y="60" width="350" height="310" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#s10)"/>
  <rect x="30" y="60" width="350" height="34" rx="8" fill="#64748b"/>
  <text x="205" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Baseline: Fixed Pooling</text>

  <text x="55" y="120" font-size="12" fill="#1e293b" font-weight="600">Behavior Sequence:</text>
  <g font-size="11">
    <rect x="55" y="130" width="90" height="30" rx="6" fill="#e8ecff"/><text x="100" y="149" text-anchor="middle" fill="#4A6CF7">GPU</text>
    <rect x="155" y="130" width="90" height="30" rx="6" fill="#e8ecff"/><text x="200" y="149" text-anchor="middle" fill="#4A6CF7">Mouse</text>
    <rect x="255" y="130" width="90" height="30" rx="6" fill="#e8ecff"/><text x="300" y="149" text-anchor="middle" fill="#4A6CF7">Sneakers</text>
    <rect x="55" y="170" width="90" height="30" rx="6" fill="#e8ecff"/><text x="100" y="189" text-anchor="middle" fill="#4A6CF7">Novel</text>
  </g>
  <text x="55" y="232" font-size="12" fill="#64748b">↓ Average pooling (target-agnostic)</text>
  <rect x="120" y="245" width="190" height="44" rx="8" fill="#1e293b"/>
  <text x="215" y="272" text-anchor="middle" font-size="12" fill="#ffffff">Fixed user vector v_U</text>
  <text x="205" y="320" text-anchor="middle" font-size="11.5" fill="#64748b">Same v_U for "Keyboard" or "Sneakers"</text>
  <text x="205" y="340" text-anchor="middle" font-size="11.5" fill="#64748b">→ not focused enough</text>

  <!-- RIGHT: DIN activation -->
  <rect x="420" y="60" width="350" height="310" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#s10)"/>
  <rect x="420" y="60" width="350" height="34" rx="8" fill="#4A6CF7"/>
  <text x="595" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">DIN: Local Activation (Attention)</text>

  <text x="445" y="120" font-size="12" fill="#1e293b" font-weight="600">Target Item: Mechanical Keyboard</text>
  <g font-size="11">
    <rect x="445" y="130" width="90" height="30" rx="6" fill="#10b981"/><text x="490" y="149" text-anchor="middle" fill="#fff" font-weight="700">GPU ★</text>
    <rect x="545" y="130" width="90" height="30" rx="6" fill="#10b981"/><text x="590" y="149" text-anchor="middle" fill="#fff" font-weight="700">Mouse ★</text>
    <rect x="645" y="130" width="90" height="30" rx="6" fill="#cbd5e1"/><text x="690" y="149" text-anchor="middle" fill="#475569">Sneakers</text>
    <rect x="445" y="170" width="90" height="30" rx="6" fill="#cbd5e1"/><text x="490" y="189" text-anchor="middle" fill="#475569">Novel</text>
  </g>
  <text x="445" y="232" font-size="12" fill="#64748b">↓ Activation unit weighting (attention)</text>
  <rect x="490" y="245" width="210" height="44" rx="8" fill="#1e293b"/>
  <text x="595" y="272" text-anchor="middle" font-size="12" fill="#ffffff">Dynamic vector v_U(Keyboard)</text>
  <text x="595" y="320" text-anchor="middle" font-size="11.5" fill="#10b981">GPU / Mouse get high attention weight</text>
  <text x="595" y="340" text-anchor="middle" font-size="11.5" fill="#10b981">→ focus on relevant interests</text>
</svg>
