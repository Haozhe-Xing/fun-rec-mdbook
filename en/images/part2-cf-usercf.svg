<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="320" fill="#f8f9fc" rx="12"/>

  <text x="400" y="34" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">UserCF: Similar Users Contribute Candidates</text>

  <!-- target user -->
  <rect x="40" y="120" width="140" height="70" rx="8" fill="#4A6CF7" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="148" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">Target User U</text>
  <text x="110" y="170" text-anchor="middle" font-family="Arial" font-size="11" fill="#e8ecff">Likes Tee / Polo</text>

  <!-- neighbor users -->
  <rect x="250" y="60" width="140" height="60" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="86" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1e293b">Similar User V₁</text>
  <text x="320" y="106" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">wᵤᵥ₁=0.85</text>

  <rect x="250" y="150" width="140" height="60" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="176" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1e293b">Similar User V₂</text>
  <text x="320" y="196" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">wᵤᵥ₂=0.70</text>

  <!-- arrows U -> neighbors -->
  <line x1="180" y1="140" x2="248" y2="90" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="155" x2="248" y2="180" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- candidate items from neighbors -->
  <rect x="460" y="55" width="140" height="55" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="78" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1e293b">Jacket (Cand.)</text>
  <text x="530" y="98" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">liked by V₁</text>

  <rect x="460" y="155" width="140" height="55" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="178" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1e293b">Hoodie (Cand.)</text>
  <text x="530" y="198" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">liked by V₂</text>

  <line x1="390" y1="85" x2="458" y2="75" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="185" x2="458" y2="180" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- aggregate -->
  <rect x="640" y="105" width="140" height="60" rx="8" fill="#10b981" stroke="#065f46" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="710" y="132" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">Top-N Recs</text>
  <text x="710" y="152" text-anchor="middle" font-family="Arial" font-size="10" fill="#d1fae5">ranked by interest score</text>

  <line x1="40" y1="290" x2="760" y2="290" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="309" text-anchor="middle" font-family="Courier New" font-size="12" fill="#64748b">p(u,i) = Σ wᵤᵥ · rᵥᵢ   →   neighbor actions aggregate into candidates</text>
</svg>
