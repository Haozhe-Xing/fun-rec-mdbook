<svg width="800" height="360" viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="360" fill="#f8f9fc" rx="12"/>

  <text x="400" y="32" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">RQ-VAE: Layer-by-Layer Residual Quantization</text>

  <!-- encoder output z_e -->
  <rect x="40" y="95" width="96" height="56" rx="8" fill="#4A6CF7" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="88" y="118" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff">Encoder</text>
  <text x="88" y="137" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffffff">z_e</text>
  <text x="88" y="175" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Residual r₀ = z_e</text>

  <!-- Layer 1 -->
  <rect x="195" y="80" width="160" height="96" rx="10" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <text x="275" y="102" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#4A6CF7">Layer 1 (Coarse)</text>
  <text x="275" y="122" text-anchor="middle" font-family="Arial" font-size="10" fill="#1e293b">Nearest e¹_{k₁} in codebook E¹</text>
  <text x="275" y="142" text-anchor="middle" font-family="Arial" font-size="10" fill="#1e293b">Residual r₁ = r₀ − e¹_{k₁}</text>
  <text x="275" y="162" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">Captures "Sports" level semantics</text>

  <!-- Layer 2 -->
  <rect x="395" y="80" width="160" height="96" rx="10" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="102" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#4A6CF7">Layer 2 (Mid)</text>
  <text x="475" y="122" text-anchor="middle" font-family="Arial" font-size="10" fill="#1e293b">Nearest e²_{k₂} in codebook E²</text>
  <text x="475" y="142" text-anchor="middle" font-family="Arial" font-size="10" fill="#1e293b">Residual r₂ = r₁ − e²_{k₂}</text>
  <text x="475" y="162" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">Captures "Basketball" level semantics</text>

  <!-- Layer L -->
  <rect x="595" y="80" width="160" height="96" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="675" y="102" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#10b981">Layer L (Fine)</text>
  <text x="675" y="122" text-anchor="middle" font-family="Arial" font-size="10" fill="#1e293b">Nearest eᴸ_{kᴸ} in codebook Eᴸ</text>
  <text x="675" y="142" text-anchor="middle" font-family="Arial" font-size="10" fill="#1e293b">Residual r_L → close to 0</text>
  <text x="675" y="162" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">Captures "Dunk" level detail</text>

  <!-- arrows -->
  <line x1="136" y1="123" x2="193" y2="123" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="355" y1="123" x2="393" y2="123" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="555" y1="123" x2="593" y2="123" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SID band -->
  <rect x="120" y="220" width="560" height="52" rx="10" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="248" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1e293b">Semantic ID  =  [ k₁ ,  k₂ ,  …  ,  k_L ]</text>
  <text x="400" y="266" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Coarse to fine  ·  Reconstruct z_q = Σ ℓ e⁽ˡ⁾_{k_ℓ}  ·  Capacity K^L (codebook only K)</text>

  <text x="400" y="310" text-anchor="middle" font-family="Arial" font-size="11" fill="#f59e0b">⚠ Residuals shrink each layer; codebook stays size K, yet L layers give K^L-scale capacity</text>
  <text x="400" y="332" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Even the prefix [k₁,k₂] already says "basketball", enabling effective fuzzy matching</text>
</svg>
