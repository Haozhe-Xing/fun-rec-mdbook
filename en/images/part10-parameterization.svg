<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow10c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <filter id="shadow10c" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="300" fill="#f8f9fc" rx="12"/>
  <text x="400" y="34" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#1e293b">两种参数化：预测噪声 ε vs 预测原始数据 x₀</text>

  <g font-family="Arial" font-size="13" text-anchor="middle">
    <rect x="40" y="70" width="340" height="200" rx="12" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow10c)"/>
    <text x="210" y="100" font-weight="bold" fill="#4A6CF7">ε-prediction（DDPM 标准）</text>
    <text x="210" y="130" font-family="Arial" font-size="12" fill="#1e293b">网络 ε_θ(xₜ, t) 预测噪声</text>
    <rect x="70" y="150" width="280" height="40" rx="8" fill="#f0f4ff" stroke="#4A6CF7" stroke-width="1.2"/>
    <text x="210" y="175" font-family="Courier New" font-size="12" fill="#1e293b">L_ε = E‖ε − ε_θ(xₜ,t)‖²</text>
    <text x="210" y="218" font-family="Arial" font-size="12" fill="#64748b">噪声明亮方差大</text>
    <text x="210" y="240" font-family="Arial" font-size="12" fill="#64748b">网络估不稳定目标→更难</text>

    <rect x="420" y="70" width="340" height="200" rx="12" fill="#e8f5ee" stroke="#10b981" stroke-width="2" filter="url(#shadow10c)"/>
    <text x="590" y="100" text-anchor="middle" font-weight="bold" fill="#16a34a">x₀-prediction ★推荐更合适</text>
    <text x="590" y="130" font-family="Arial" font-size="12" fill="#1e293b">网络 x̂_θ(xₜ, t) 预测原始数据</text>
    <rect x="450" y="150" width="280" height="40" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.2"/>
    <text x="590" y="175" font-family="Courier New" font-size="12" fill="#1e293b">L_x₀ = E‖x₀ − x̂_θ(xₜ,t)‖²</text>
    <text x="590" y="218" font-family="Arial" font-size="12" fill="#1e293b">直接恢复交互→排序推荐</text>
    <text x="590" y="240" font-family="Arial" font-size="12" fill="#64748b">更贴合推荐任务目标</text>
  </g>
  <line x1="380" y1="170" x2="416" y2="170" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow10c)"/>
  <text x="398" y="158" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">推荐选</text>
</svg>
