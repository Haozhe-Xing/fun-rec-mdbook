<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- formula banner -->
  <rect x="40" y="30" width="720" height="56" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#sh)"/>
  <text x="400" y="58" text-anchor="middle" font-size="16" font-weight="700" fill="#ea580c">MR(i) = λ·Rel(i) − (1−λ)·maxⱼ∈S Sim(i, j)</text>
  <text x="400" y="78" text-anchor="middle" font-size="12" fill="#64748b">Each step greedily picks the max-MR item: relevant on its own, yet unlike the already-selected ones</text>

  <!-- Step 1 -->
  <text x="40" y="125" font-size="14" font-weight="700" fill="#1e293b">Step 1 · Pick the first item (highest Rel)</text>
  <rect x="40" y="138" width="720" height="48" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <g font-size="13" fill="#1e293b">
    <rect x="60" y="150" width="90" height="26" rx="6" fill="#e8ecff"/><text x="105" y="168" text-anchor="middle">A Rel=0.95</text>
    <rect x="170" y="150" width="90" height="26" rx="6" fill="#f8f9fc"/><text x="215" y="168" text-anchor="middle">B Rel=0.90</text>
    <rect x="280" y="150" width="90" height="26" rx="6" fill="#f8f9fc"/><text x="325" y="168" text-anchor="middle">C Rel=0.85</text>
    <rect x="390" y="150" width="90" height="26" rx="6" fill="#f8f9fc"/><text x="435" y="168" text-anchor="middle">D Rel=0.80</text>
    <rect x="500" y="150" width="90" height="26" rx="6" fill="#f8f9fc"/><text x="545" y="168" text-anchor="middle">E Rel=0.75</text>
    <text x="620" y="168" fill="#10b981" font-weight="700">→ Pick A</text>
  </g>

  <!-- Step 2 -->
  <text x="40" y="218" font-size="14" font-weight="700" fill="#1e293b">Step 2 · Compute MR (λ=0.7), S={A}</text>
  <rect x="40" y="231" width="720" height="64" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <g font-size="12.5" fill="#1e293b">
    <rect x="60" y="248" width="150" height="30" rx="6" fill="#f8f9fc"/><text x="135" y="268" text-anchor="middle">B: .90−.7·.2=0.76</text>
    <rect x="225" y="248" width="150" height="30" rx="6" fill="#f8f9fc"/><text x="300" y="268" text-anchor="middle">C: .85−.7·.8=0.29</text>
    <rect x="390" y="248" width="150" height="30" rx="6" fill="#f8f9fc"/><text x="465" y="268" text-anchor="middle">D: .80−.7·.1=0.73</text>
    <rect x="555" y="248" width="150" height="30" rx="6" fill="#f8f9fc"/><text x="630" y="268" text-anchor="middle">E: .75−.7·.3=0.54</text>
    <text x="135" y="298" font-size="11" fill="#64748b">max Sim is taken w.r.t. A</text>
    <text x="720" y="268" fill="#10b981" font-weight="700">→ B</text>
  </g>

  <!-- Step 3 -->
  <text x="40" y="325" font-size="14" font-weight="700" fill="#1e293b">Step 3 · Compute MR, S={A,B}</text>
  <rect x="40" y="338" width="720" height="48" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <g font-size="12.5" fill="#1e293b">
    <rect x="60" y="350" width="190" height="26" rx="6" fill="#f8f9fc"/><text x="155" y="368" text-anchor="middle">C: .85−.7·max(.8,.1)=0.29</text>
    <rect x="270" y="350" width="190" height="26" rx="6" fill="#f8f9fc"/><text x="365" y="368" text-anchor="middle">D: .80−.7·max(.1,.7)=0.31</text>
    <rect x="480" y="350" width="190" height="26" rx="6" fill="#f8f9fc"/><text x="575" y="368" text-anchor="middle">E: .75−.7·max(.3,.4)=0.47</text>
    <text x="700" y="368" fill="#10b981" font-weight="700">→ E</text>
  </g>

  <!-- result -->
  <rect x="40" y="402" width="720" height="28" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="400" y="421" text-anchor="middle" font-size="13" fill="#0c8f6a" font-weight="700">Final list [A, B, E] · vs. pure Ranking [A, B, C], diversity clearly improved</text>
</svg>
