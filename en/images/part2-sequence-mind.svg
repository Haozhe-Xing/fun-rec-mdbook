<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="340" fill="#f8f9fc" rx="12"/>

  <text x="400" y="34" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">MIND: Multi-Interest Capsules via Dynamic Routing over Behaviors</text>

  <!-- behaviors -->
  <text x="110" y="66" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#64748b">Behavior Capsules</text>
  <circle cx="60" cy="120" r="20" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="125" text-anchor="middle" font-family="Arial" font-size="9" fill="#1e293b">Book</text>
  <circle cx="110" cy="100" r="20" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="105" text-anchor="middle" font-family="Arial" font-size="9" fill="#1e293b">Shoes</text>
  <circle cx="160" cy="125" r="20" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="130" text-anchor="middle" font-family="Arial" font-size="9" fill="#1e293b">Coffee</text>
  <circle cx="90" cy="160" r="20" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="165" text-anchor="middle" font-family="Arial" font-size="9" fill="#1e293b">Keyb.</text>
  <circle cx="150" cy="165" r="20" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="170" text-anchor="middle" font-family="Arial" font-size="9" fill="#1e293b">Tread.</text>

  <!-- routing arrows to capsules -->
  <line x1="75" y1="135" x2="330" y2="95" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="95" y1="138" x2="335" y2="105" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="118" x2="340" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="130" y1="148" x2="345" y2="200" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="150" x2="350" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- interest capsules -->
  <rect x="360" y="75" width="160" height="50" rx="8" fill="#4A6CF7" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="440" y="98" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff">Interest ① Coding</text>
  <text x="440" y="116" text-anchor="middle" font-family="Arial" font-size="10" fill="#e8ecff">Book + Keyboard</text>

  <rect x="360" y="150" width="160" height="50" rx="8" fill="#10b981" stroke="#065f46" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="440" y="173" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff">Interest ② Fitness</text>
  <text x="440" y="191" text-anchor="middle" font-family="Arial" font-size="10" fill="#d1fae5">Shoes + Treadmill</text>

  <rect x="360" y="225" width="160" height="50" rx="8" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="440" y="248" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff">Interest ③ Food</text>
  <text x="440" y="266" text-anchor="middle" font-family="Arial" font-size="10" fill="#fef3c7">Coffee</text>

  <!-- retrieve arrows -->
  <line x1="520" y1="100" x2="580" y2="100" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="175" x2="580" y2="175" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="250" x2="580" y2="250" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- merged candidates -->
  <rect x="590" y="90" width="180" height="170" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="680" y="115" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e293b">Merged Candidates</text>
  <text x="680" y="140" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">①→ coding books / IDE</text>
  <text x="680" y="165" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">②→ running shoes / gear</text>
  <text x="680" y="190" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">③→ beans / brew kit</text>
  <text x="680" y="220" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">dedup + truncate</text>

  <rect x="0" y="305" width="800" height="35" fill="#1e293b" rx="0 0 12 12"/>
  <text x="400" y="328" text-anchor="middle" font-family="Courier New" font-size="13" fill="#94a3b8">Dynamic routing (B2I) → per-capsule retrieval → merge</text>
</svg>
