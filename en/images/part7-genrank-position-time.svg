<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="sh6"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="800" height="380" fill="#f8f9fc"/>
  <text x="400" y="34" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">三种轻量级 Position &amp; Time Embeddings</text>

  <!-- three cards -->
  <rect x="40" y="60" width="220" height="280" rx="12" fill="#ffffff" stroke="#e8ecff" filter="url(#sh6)"/>
  <rect x="60" y="80" width="180" height="34" rx="8" fill="#f0f4ff" stroke="#4A6CF7"/>
  <text x="150" y="102" font-size="13" font-weight="700" fill="#4A6CF7" text-anchor="middle">① Position Emb</text>
  <text x="150" y="140" font-size="12" fill="#1e293b" text-anchor="middle">E_pe,i = Ω_pe(i)</text>
  <text x="150" y="170" font-size="11" fill="#64748b" text-anchor="middle">记录序列索引</text>
  <text x="150" y="195" font-size="11" fill="#64748b" text-anchor="middle">同请求候选共享</text>
  <text x="150" y="225" font-size="11" fill="#64748b" text-anchor="middle">保证训练/推理一致</text>
  <text x="150" y="300" font-size="11" fill="#64748b" text-anchor="middle">复杂度 O(N)</text>

  <rect x="290" y="60" width="220" height="280" rx="12" fill="#ffffff" stroke="#e8ecff" filter="url(#sh6)"/>
  <rect x="310" y="80" width="180" height="34" rx="8" fill="#fef9ec" stroke="#f59e0b"/>
  <text x="400" y="102" font-size="13" font-weight="700" fill="#d97706" text-anchor="middle">② Request Index</text>
  <text x="400" y="140" font-size="12" fill="#1e293b" text-anchor="middle">E_ri = Ω_ri(|{t≤i}|)</text>
  <text x="400" y="170" font-size="11" fill="#64748b" text-anchor="middle">捕捉 burst 模式</text>
  <text x="400" y="195" font-size="11" fill="#64748b" text-anchor="middle">区分同/跨 session</text>
  <text x="400" y="225" font-size="11" fill="#64748b" text-anchor="middle">例：[0,0,0,0,0,1,1,1]</text>
  <text x="400" y="300" font-size="11" fill="#64748b" text-anchor="middle">复杂度 O(N)</text>

  <rect x="540" y="60" width="220" height="280" rx="12" fill="#ffffff" stroke="#e8ecff" filter="url(#sh6)"/>
  <rect x="560" y="80" width="180" height="34" rx="8" fill="#f0fdf4" stroke="#10b981"/>
  <text x="650" y="102" font-size="13" font-weight="700" fill="#10b981" text-anchor="middle">③ Pre-Req Time</text>
  <text x="650" y="140" font-size="12" fill="#1e293b" text-anchor="middle">E_rt = Ω_rt(bucket)</text>
  <text x="650" y="170" font-size="11" fill="#64748b" text-anchor="middle">距上次请求间隔</text>
  <text x="650" y="195" font-size="11" fill="#64748b" text-anchor="middle">自适应衰减</text>
  <text x="650" y="225" font-size="11" fill="#64748b" text-anchor="middle">高频/低频用户不同</text>
  <text x="650" y="300" font-size="11" fill="#64748b" text-anchor="middle">复杂度 O(N)</text>

  <text x="400" y="365" font-size="12" fill="#64748b" text-anchor="middle">绝对信息用 embedding，相对衰减用 ALiBi 无参数 bias：e⁽ᵖ,ᵗ⁾ = φ(x)+φ(a)+E_pe+E_ri+E_rt</text>
</svg>
