<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Deep Recommender Systems in Practice (fun-rec-mdbook): an open-source book on recommender systems — from cascading retrieval/ranking architectures to generative recommendation, semantic IDs, HSTU, end-to-end generative search & advertising, and diffusion models.">
  <meta name="keywords" content="recommender systems, generative recommendation, retrieval, ranking, rerank, semantic ID, HSTU, LLM recommendation, deep learning, 推荐系统, 生成式推荐, 深度推荐算法实践">
  <link rel="canonical" href="https://haozhe-xing.github.io/fun-rec-mdbook/">
  <title>深度推荐算法实践 | Deep Recommender Systems in Practice</title>
  <!-- JS 禁用时默认重定向到中文版 -->
  <noscript>
    <meta http-equiv="refresh" content="0; url=./zh/">
  </noscript>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f8f9fc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 520px;
    }
    .logo {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: #1e293b;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 2rem;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(74, 108, 247, 0.2);
      border-top-color: #4A6CF7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.2rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .redirect-msg {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 2rem;
    }
    .lang-links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .lang-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.4rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .lang-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(74, 108, 247, 0.25);
    }
    .lang-btn-zh {
      background: linear-gradient(135deg, #4A6CF7, #2563eb);
      color: #fff;
    }
    .lang-btn-en {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
    }
    .divider {
      margin: 2rem auto;
      width: 60px;
      height: 1px;
      background: rgba(30, 41, 59, 0.12);
    }
    .footer {
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
  <script>
    // 根据浏览器语言偏好自动重定向
    (function() {
      var lang = navigator.language || navigator.userLanguage || '';
      var target = lang.toLowerCase().startsWith('zh') ? './zh/' : './en/';
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <div class="container">
    <div class="logo">📚</div>
    <h1>深度推荐算法实践</h1>
    <p class="subtitle">Deep Recommender Systems in Practice · 从级联架构到生成式范式</p>
    <div class="spinner"></div>
    <p class="redirect-msg">正在根据浏览器语言自动跳转…<br>Redirecting based on your browser language…</p>
    <div class="lang-links">
      <a href="./zh/" class="lang-btn lang-btn-zh">🇨🇳 简体中文</a>
      <a href="./en/" class="lang-btn lang-btn-en">🇺🇸 English</a>
    </div>
    <div class="divider"></div>
    <p class="footer">
      如未自动跳转，请手动点击上方链接 ·
      If not redirected, click a link above
    </p>
  </div>
</body>
</html>
