<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="480" rx="8" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">广告检索漏斗：从亿级候选到一次展示</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#64748b">每一层都在「缩小候选 + 提高打分精度」之间做交换，全部环节须在毫秒级预算内完成</text>

  <!-- Funnel layers (left) -->
  <!-- L1 全量 -->
  <polygon points="50,90 510,90 480,142 80,142" fill="#64748b" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">全量广告候选 ~10⁸</text>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#e2e8f0">定向条件以 DNF 布尔表达式建索引</text>

  <!-- L2 召回 -->
  <polygon points="80,158 480,158 440,210 120,210" fill="#4A6CF7" stroke="#3b55c4" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">召回 Recall：10⁴ ~ 10⁵</text>
  <text x="280" y="200" text-anchor="middle" font-size="12" fill="#dbe4ff">布尔倒排 + 语义向量 ANN，多路融合</text>

  <!-- L3 粗排 -->
  <polygon points="120,226 440,226 400,278 160,278" fill="#10b981" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">粗排 Pre-rank：10² ~ 10³</text>
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#d1fae5">轻量模型快速打分，Top-K 剪枝思想延续</text>

  <!-- L4 精排 -->
  <polygon points="160,294 400,294 360,346 200,346" fill="#f59e0b" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">精排 Rank：10¹ ~ 10²</text>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#fef3c7">完整 CTR 模型逐候选打分（校准见 12.5）</text>

  <!-- L5 竞价 -->
  <polygon points="200,362 360,362 330,414 230,414" fill="#ef4444" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">竞价与计价</text>
  <text x="280" y="404" text-anchor="middle" font-size="12" fill="#fee2e2">eCPM 排序 → GSP 计价 → 1~3 条展示</text>

  <!-- Right annotations -->
  <g font-size="12" fill="#1e293b">
    <text x="540" y="112">亿级广告各自带一段布尔定向条件，</text>
    <text x="540" y="130" fill="#64748b">检索目标：找出「可参与本次竞价」的少数</text>

    <text x="540" y="180" font-weight="bold" fill="#4A6CF7">召回层（本章主角）</text>
    <text x="540" y="198">布尔倒排：Conjunction 索引 + size 分层剪枝</text>
    <text x="540" y="214">语义召回：双塔向量 + ANN（HNSW / IVF-PQ）</text>

    <text x="540" y="248" font-weight="bold" fill="#059669">粗排层</text>
    <text x="540" y="266">WAND 式「上界 + 堆阈值」思想在这里延续</text>

    <text x="540" y="316" font-weight="bold" fill="#d97706">精排层</text>
    <text x="540" y="334">pCTR 精度即收益（偏差与校准见 12.5）</text>

    <text x="540" y="384" font-weight="bold" fill="#dc2626">竞价层</text>
    <text x="540" y="402">eCPM 排序（12.2）· GSP（12.3）· 出价（12.4）</text>
  </g>

  <!-- Bottom note -->
  <rect x="50" y="432" width="700" height="34" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="400" y="454" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">检索质量决定变现天花板，检索速度决定系统可行性 —— 二者必须在同一毫秒预算下共存</text>
</svg>
