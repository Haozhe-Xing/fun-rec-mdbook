<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <filter id="s5" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="300" fill="#f8f9fc" rx="12"/>

  <text x="400" y="32" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#1e293b">推荐算法能力演进 × 本书章节地图</text>

  <!-- timeline -->
  <line x1="70" y1="135" x2="740" y2="135" stroke="#cbd5e1" stroke-width="3"/>
  <text x="400" y="175" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">时间 → 能力从「记忆」走向「推理」</text>

  <!-- 4 stages -->
  <g>
    <circle cx="160" cy="135" r="26" fill="#4A6CF7" filter="url(#s5)"/>
    <text x="160" y="131" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">记忆</text>
    <text x="160" y="147" text-anchor="middle" font-family="Arial" font-size="11" fill="#dbeafe">ID</text>
    <text x="160" y="208" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Ch2 召回</text>
  </g>
  <g>
    <circle cx="350" cy="135" r="26" fill="#10b981" filter="url(#s5)"/>
    <text x="350" y="131" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">泛化</text>
    <text x="350" y="147" text-anchor="middle" font-family="Arial" font-size="11" fill="#d1fae5">DNN</text>
    <text x="350" y="208" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Ch3 排序</text>
  </g>
  <g>
    <circle cx="540" cy="135" r="26" fill="#f59e0b" filter="url(#s5)"/>
    <text x="540" y="131" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">理解</text>
    <text x="540" y="147" text-anchor="middle" font-family="Arial" font-size="11" fill="#fef3c7">语义ID</text>
    <text x="540" y="208" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Ch5 生成式</text>
  </g>
  <g>
    <circle cx="700" cy="135" r="26" fill="#dc2626" filter="url(#s5)"/>
    <text x="700" y="131" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">推理</text>
    <text x="700" y="147" text-anchor="middle" font-family="Arial" font-size="11" fill="#fecaca">LLM</text>
    <text x="700" y="208" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Ch8 思考</text>
  </g>

  <!-- two paradigm bands -->
  <rect x="70" y="238" width="370" height="50" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>
  <text x="255" y="260" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#4A6CF7">判别式主线</text>
  <text x="255" y="280" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Ch2 召回 · Ch3 排序 · Ch4 重排 · Ch5.1–5.2 趋势</text>

  <rect x="455" y="238" width="285" height="50" rx="8" fill="#fef9ec" stroke="#d97706" stroke-width="1.5"/>
  <text x="597" y="260" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#d97706">生成式主线</text>
  <text x="597" y="280" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Ch5 基础 · Ch6 Scaling · Ch7 端到端 · Ch8 思考</text>
</svg>
