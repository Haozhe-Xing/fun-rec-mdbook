<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="sm" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="800" height="380" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">因果掩码：下三角可见、上三角屏蔽</text>

  <!-- mask matrix -->
  <g font-family="Courier New, monospace" font-size="13" text-anchor="middle">
    <!-- header -->
    <text x="150" y="90" fill="#64748b">M =</text>
    <!-- grid 4x4 -->
    <g transform="translate(190,70)">
      <!-- row 1 -->
      <rect x="0" y="0" width="44" height="44" rx="6" fill="#10b981"/><text x="22" y="27" fill="#fff">0</text>
      <rect x="50" y="0" width="44" height="44" rx="6" fill="#ef4444"/><text x="72" y="27" fill="#fff">-∞</text>
      <rect x="100" y="0" width="44" height="44" rx="6" fill="#ef4444"/><text x="122" y="27" fill="#fff">-∞</text>
      <rect x="150" y="0" width="44" height="44" rx="6" fill="#ef4444"/><text x="172" y="27" fill="#fff">-∞</text>
      <!-- row 2 -->
      <rect x="0" y="50" width="44" height="44" rx="6" fill="#10b981"/><text x="22" y="77" fill="#fff">0</text>
      <rect x="50" y="50" width="44" height="44" rx="6" fill="#10b981"/><text x="72" y="77" fill="#fff">0</text>
      <rect x="100" y="50" width="44" height="44" rx="6" fill="#ef4444"/><text x="122" y="77" fill="#fff">-∞</text>
      <rect x="150" y="50" width="44" height="44" rx="6" fill="#ef4444"/><text x="172" y="77" fill="#fff">-∞</text>
      <!-- row 3 -->
      <rect x="0" y="100" width="44" height="44" rx="6" fill="#10b981"/><text x="22" y="127" fill="#fff">0</text>
      <rect x="50" y="100" width="44" height="44" rx="6" fill="#10b981"/><text x="72" y="127" fill="#fff">0</text>
      <rect x="100" y="100" width="44" height="44" rx="6" fill="#10b981"/><text x="122" y="127" fill="#fff">0</text>
      <rect x="150" y="100" width="44" height="44" rx="6" fill="#ef4444"/><text x="172" y="127" fill="#fff">-∞</text>
      <!-- row 4 -->
      <rect x="0" y="150" width="44" height="44" rx="6" fill="#10b981"/><text x="22" y="177" fill="#fff">0</text>
      <rect x="50" y="150" width="44" height="44" rx="6" fill="#10b981"/><text x="72" y="177" fill="#fff">0</text>
      <rect x="100" y="150" width="44" height="44" rx="6" fill="#10b981"/><text x="122" y="177" fill="#fff">0</text>
      <rect x="150" y="150" width="44" height="44" rx="6" fill="#10b981"/><text x="172" y="177" fill="#fff">0</text>
    </g>
  </g>
  <text x="262" y="300" text-anchor="middle" font-size="11" fill="#64748b">位置 i 只能看 j ≤ i</text>

  <!-- right: sequence generation with mask intuition -->
  <g font-size="13" text-anchor="middle">
    <text x="600" y="80" font-weight="700" fill="#1e293b">自回归生成</text>
    <rect x="500" y="110" width="60" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/><text x="530" y="137" fill="#1e293b">i₁</text>
    <rect x="570" y="110" width="60" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/><text x="600" y="137" fill="#1e293b">i₂</text>
    <rect x="640" y="110" width="60" height="44" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3"/><text x="670" y="137" fill="#64748b">i₃?</text>
    <text x="600" y="185" font-size="11" fill="#64748b">生成 i₂ 时只看 i₁</text>
    <text x="600" y="207" font-size="11" fill="#64748b">生成 i₃ 时看 i₁,i₂</text>
  </g>
  <path d="M530,154 C530,200 600,185 600,158" fill="none" stroke="#10b981" stroke-width="2"/>
  <path d="M600,154 C600,200 670,185 670,158" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="600" y="340" text-anchor="middle" font-size="12" fill="#64748b">训练时一次前向并行学全部位置，但各自只用「合法」历史</text>
</svg>
