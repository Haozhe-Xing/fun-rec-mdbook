<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <marker id="ae" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="300" fill="#f8f9fc" rx="12"/>
  <text x="400" y="32" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">YoutubeDNN 训练：双塔 + Sampled Softmax + 物品向量预计算</text>
  <rect x="60" y="70" width="200" height="90" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#sh)"/>
  <text x="160" y="111" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#4A6CF7">用户塔 (在线)</text>
  <text x="160" y="129" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">行为序列 → u</text>
  <rect x="540" y="70" width="200" height="90" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#sh)"/>
  <text x="640" y="111" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#10b981">物品塔 (离线)</text>
  <text x="640" y="129" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">电影 → v</text>
  <rect x="300" y="70" width="200" height="90" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#sh)"/>
  <text x="400" y="111" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1e293b">内积 &lt;u,v&gt;</text>
  <text x="400" y="129" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Sampled Softmax</text>
  <line x1="260" y1="115" x2="300" y2="115" stroke="#4A6CF7" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="540" y1="115" x2="500" y2="115" stroke="#10b981" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="60" y="190" width="680" height="50" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#sh)"/>
  <text x="400" y="215" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#f59e0b">离线：item_model.predict 全量 → 归一化 → item_embeddings.npy</text>
  <rect x="0" y="270" width="800" height="30" fill="#1e293b" opacity="0.06" rx="0 0 12 12"/>
</svg>
