<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <marker id="ae" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="300" fill="#f8f9fc" rx="12"/>
  <text x="400" y="32" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">排序 + 多样性重排：DeepFM 精排后连续打散保序</text>
  <rect x="60" y="70" width="280" height="60" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#sh)"/>
  <text x="200" y="96" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#4A6CF7">DeepFM 批量 CTR 预估</text>
  <text x="200" y="114" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">按分排序 Top-20</text>
  <line x1="340" y1="100" x2="380" y2="100" stroke="#4A6CF7" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="380" y="70" width="360" height="60" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#sh)"/>
  <text x="560" y="96" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#10b981">连续打散 (Consecutive Dispersion)</text>
  <text x="560" y="114" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">类型 + 年代，各 ≤2 连续</text>
  <rect x="60" y="180" width="680" height="60" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#sh)"/>
  <text x="400" y="210" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e293b">保序性：满足连续约束下尽量保持原序，高分仍靠前、仅微调位置</text>
  <rect x="60" y="260" width="680" height="30" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#sh)"/>
  <text x="400" y="275" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#f59e0b">输出：相关性与多样性平衡的推荐列表</text>
</svg>
