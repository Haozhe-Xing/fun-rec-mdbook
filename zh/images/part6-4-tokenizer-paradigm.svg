<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="s4" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="800" height="360" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">三种 Tokenizer 范式对比</text>

  <!-- sparse ID -->
  <rect x="30" y="70" width="230" height="250" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#s4)"/>
  <text x="145" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">稀疏 ID</text>
  <text x="145" y="120" text-anchor="middle" font-size="11" fill="#64748b">item_10086 / video_9527</text>
  <g font-size="11" fill="#1e293b">
    <text x="145" y="150" text-anchor="middle">✓ 无碰撞、工程成熟</text>
    <text x="145" y="175" text-anchor="middle">✗ 词表爆炸（十亿级）</text>
    <text x="145" y="198" text-anchor="middle">✗ 存储 1TB / 无泛化</text>
    <text x="145" y="221" text-anchor="middle">✗ 协同信号隐式依赖</text>
    <text x="145" y="252" text-anchor="middle">代表：HSTU, GenRec</text>
  </g>

  <!-- text ID -->
  <rect x="285" y="70" width="230" height="250" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#s4)"/>
  <text x="400" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#f59e0b">文本 ID</text>
  <text x="400" y="120" text-anchor="middle" font-size="11" fill="#64748b">"Apple iPhone 15 Pro 256G"</text>
  <g font-size="11" fill="#1e293b">
    <text x="400" y="150" text-anchor="middle">✓ 语义丰富、零样本</text>
    <text x="400" y="175" text-anchor="middle">✓ 可解释强</text>
    <text x="400" y="198" text-anchor="middle">✗ 表示效率低（~30 token）</text>
    <text x="400" y="221" text-anchor="middle">✗ Grounding 困难</text>
    <text x="400" y="252" text-anchor="middle">代表：M6-Rec, P5, TallRec</text>
  </g>

  <!-- semantic ID -->
  <rect x="540" y="70" width="230" height="250" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="3" filter="url(#s4)"/>
  <text x="655" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#10b981">语义 ID ★</text>
  <text x="655" y="120" text-anchor="middle" font-size="11" fill="#64748b">[10, 5, 42] = 体育→篮球→扣篮</text>
  <g font-size="11" fill="#1e293b">
    <text x="655" y="150" text-anchor="middle">✓ 可控固定词表 (K^L)</text>
    <text x="655" y="175" text-anchor="middle">✓ 天然层次化结构</text>
    <text x="655" y="198" text-anchor="middle">✓ 从记忆到推理泛化</text>
    <text x="655" y="221" text-anchor="middle">✓ 精确 grounding</text>
    <text x="655" y="252" text-anchor="middle">代表：TIGER, OneRec, OneSearch</text>
  </g>

  <text x="400" y="345" text-anchor="middle" font-size="12" fill="#64748b">绿色 = 工业级生成式推荐主流选择，平衡效率 · 泛化 · grounding。</text>
</svg>
