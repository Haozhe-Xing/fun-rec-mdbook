<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="480" rx="8" fill="#f8f9fc"/>
  <text x="400" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">有价值的数据来源：行为数据的价值阶梯</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#64748b">其余五类来源：用户标识（身份是 0 前面的 1）· 人口属性 · 地理位置 · 社交关系 · 设备信息</text>

  <!-- Left arrow: value up -->
  <line x1="210" y1="340" x2="210" y2="100" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="192" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#ef4444" transform="rotate(-90 192 225)">价值（对效果广告）</text>

  <!-- Right arrow: volume down -->
  <line x1="590" y1="100" x2="590" y2="340" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="608" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A6CF7" transform="rotate(90 608 225)">数据量</text>

  <!-- Pyramid: top = decision -->
  <g filter="url(#shadow)">
    <polygon points="360,88 440,88 468,146 332,146" fill="#ef4444"/>
    <text x="400" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">决策行为</text>
    <text x="400" y="132" text-anchor="middle" font-size="12" fill="#ffffff">转化 · 预转化（广告主站内）</text>
  </g>
  <g filter="url(#shadow)">
    <polygon points="336,154 464,154 486,212 314,212" fill="#f59e0b"/>
    <text x="400" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">主动行为</text>
    <text x="400" y="198" text-anchor="middle" font-size="12" fill="#ffffff">广告点击 · 搜索 · 搜索点击</text>
  </g>
  <g filter="url(#shadow)">
    <polygon points="318,220 482,220 500,278 300,278" fill="#4A6CF7"/>
    <text x="400" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">半主动行为</text>
    <text x="400" y="264" text-anchor="middle" font-size="12" fill="#ffffff">分享 · 页面浏览</text>
  </g>
  <g filter="url(#shadow)">
    <polygon points="304,286 496,286 510,344 290,344" fill="#64748b"/>
    <text x="400" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">被动行为</text>
    <text x="400" y="330" text-anchor="middle" font-size="12" fill="#ffffff">广告浏览（频次与点击负相关，仍可用于建模）</text>
  </g>

  <!-- Bottom rules box -->
  <rect x="130" y="372" width="540" height="76" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">判断数据价值的两条规律</text>
  <text x="400" y="416" text-anchor="middle" font-size="12" fill="#1e293b">① 用户主动意图越强，行为数据价值越高　② 越接近转化的行为，对效果广告的指导越精准</text>
  <text x="400" y="438" text-anchor="middle" font-size="12" fill="#64748b">提醒：靠近转化的人群已不是「潜在用户」——按广告主的接触目标平衡 ROI 与覆盖率</text>
</svg>
