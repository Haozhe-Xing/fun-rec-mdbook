<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="s5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.15"/>
    </filter>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="380" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">FM：用隐向量内积实现参数共享的二阶交叉</text>

  <!-- features with vectors -->
  <g font-size="13">
    <rect x="40" y="70" width="90" height="44" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#s5)"/>
    <text x="85" y="97" text-anchor="middle" fill="#1e293b" font-weight="600">特征 i</text>
    <rect x="40" y="130" width="90" height="44" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#s5)"/>
    <text x="85" y="157" text-anchor="middle" fill="#1e293b" font-weight="600">特征 j</text>
    <rect x="40" y="190" width="90" height="44" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#s5)"/>
    <text x="85" y="217" text-anchor="middle" fill="#1e293b" font-weight="600">特征 k</text>
  </g>

  <!-- embeddings -->
  <rect x="160" y="74" width="120" height="36" rx="6" fill="#e8ecff"/>
  <text x="220" y="97" text-anchor="middle" font-size="11" fill="#4A6CF7" font-family="Courier New">vᵢ [k]</text>
  <rect x="160" y="134" width="120" height="36" rx="6" fill="#e8ecff"/>
  <text x="220" y="157" text-anchor="middle" font-size="11" fill="#4A6CF7" font-family="Courier New">vⱼ [k]</text>
  <rect x="160" y="194" width="120" height="36" rx="6" fill="#e8ecff"/>
  <text x="220" y="217" text-anchor="middle" font-size="11" fill="#4A6CF7" font-family="Courier New">vₖ [k]</text>

  <line x1="130" y1="92" x2="158" y2="92" stroke="#64748b" stroke-width="2" marker-end="url(#a5)"/>
  <line x1="130" y1="152" x2="158" y2="152" stroke="#64748b" stroke-width="2" marker-end="url(#a5)"/>
  <line x1="130" y1="212" x2="158" y2="212" stroke="#64748b" stroke-width="2" marker-end="url(#a5)"/>

  <!-- inner product box -->
  <rect x="330" y="120" width="170" height="60" rx="8" fill="#10b981" filter="url(#s5)"/>
  <text x="415" y="146" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">内积 &lt;vᵢ, vⱼ&gt;</text>
  <text x="415" y="167" text-anchor="middle" font-size="11" fill="#ffffff">无需独立 wᵢⱼ</text>

  <line x1="280" y1="92" x2="400" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#a5)"/>
  <line x1="280" y1="152" x2="360" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a5)"/>

  <!-- output -->
  <rect x="560" y="125" width="200" height="56" rx="8" fill="#1e293b"/>
  <text x="660" y="148" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">二阶交叉项</text>
  <text x="660" y="168" text-anchor="middle" font-size="11" fill="#cbd5e1">∑ᵢ&lt;ⱼ &lt;vᵢ,vⱼ&gt; xᵢxⱼ</text>
  <line x1="500" y1="150" x2="558" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a5)"/>

  <!-- param note -->
  <rect x="330" y="270" width="430" height="78" rx="8" fill="#e8ecff"/>
  <text x="355" y="298" font-size="12.5" fill="#1e293b">参数共享：每特征仅 1 个 k 维向量 → 总量 O(nk)</text>
  <text x="355" y="322" font-size="12.5" fill="#1e293b">i,j 未共现也能泛化：vᵢ 经其他特征(如 k)间接学好</text>
  <text x="355" y="342" font-size="11.5" fill="#64748b">对比多项式模型独立 wᵢⱼ → O(n²)，稀疏时学不到</text>
</svg>
