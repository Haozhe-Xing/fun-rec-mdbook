<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="340" fill="#f8f9fc" rx="12"/>

  <text x="400" y="34" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">Airbnb：预订房源作为全局上下文</text>

  <!-- session sequence -->
  <text x="180" y="66" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#64748b">浏览会话序列（局部窗口）</text>
  <rect x="30" y="85" width="90" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <text x="75" y="114" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">房源 l₁</text>
  <rect x="135" y="85" width="90" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="114" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">房源 l₂</text>
  <rect x="240" y="85" width="90" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <text x="285" y="114" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">房源 l₃</text>

  <!-- local window edges -->
  <line x1="120" y1="109" x2="133" y2="109" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="225" y1="109" x2="238" y2="109" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- booked listing -->
  <rect x="370" y="180" width="120" height="60" rx="8" fill="#10b981" stroke="#065f46" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="208" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#ffffff">预订房源 l_b</text>
  <text x="430" y="228" text-anchor="middle" font-family="Arial" font-size="11" fill="#d1fae5">全局最强正信号</text>

  <!-- global context edges from l_b to each l -->
  <path d="M375,200 C300,150 250,130 120,118" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <path d="M380,205 C320,160 260,135 225,118" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <path d="M385,210 C340,175 300,140 330,118" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <text x="240" y="160" text-anchor="middle" font-family="Arial" font-size="11" fill="#10b981">全局上下文：每个 l 都与 l_b 成对</text>

  <!-- market negative sampling -->
  <rect x="560" y="85" width="210" height="135" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="665" y="110" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e293b">同市场负采样</text>
  <circle cx="600" cy="140" r="10" fill="#ef4444"/>
  <text x="600" y="162" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">正</text>
  <circle cx="650" cy="140" r="10" fill="#94a3b8"/>
  <text x="650" y="162" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">同市场负</text>
  <circle cx="710" cy="140" r="10" fill="#cbd5e1"/>
  <text x="710" y="162" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">异地负</text>
  <text x="665" y="192" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">迫使学同地区</text>
  <text x="665" y="212" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">房源细微差别</text>

  <line x1="40" y1="315" x2="760" y2="315" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="332" text-anchor="middle" font-family="Courier New" font-size="12" fill="#64748b">+ log(1/(1+e^{-v_{l_b}ᵀ v_l}))   →   预订转化融入训练</text>
</svg>
