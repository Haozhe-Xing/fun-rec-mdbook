<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" font-family="Arial, sans-serif">
  <defs>
    <marker id="ad" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/></marker>
    <filter id="sd" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="800" height="340" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Diffusion：前向加噪 ⇄ 反向去噪</text>

  <!-- forward -->
  <text x="190" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#ef4444">前向扩散（加噪）</text>
  <g text-anchor="middle" font-size="12" fill="#1e293b">
    <rect x="40" y="90" width="76" height="50" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2" filter="url(#sd)"/><text x="78" y="119">数据 x₀</text>
    <rect x="140" y="90" width="76" height="50" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2" filter="url(#sd)"/><text x="178" y="119">+噪声</text>
    <rect x="240" y="90" width="76" height="50" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2" filter="url(#sd)"/><text x="278" y="119">+噪声</text>
    <rect x="340" y="90" width="76" height="50" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2" filter="url(#sd)"/><text x="378" y="119">噪声 x_T</text>
  </g>
  <line x1="116" y1="115" x2="136" y2="115" stroke="#ef4444" stroke-width="2" marker-end="url(#ad)"/>
  <line x1="216" y1="115" x2="236" y2="115" stroke="#ef4444" stroke-width="2" marker-end="url(#ad)"/>
  <line x1="316" y1="115" x2="336" y2="115" stroke="#ef4444" stroke-width="2" marker-end="url(#ad)"/>

  <!-- reverse -->
  <text x="610" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#10b981">反向去噪（生成）</text>
  <g text-anchor="middle" font-size="12" fill="#1e293b">
    <rect x="464" y="90" width="76" height="50" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#sd)"/><text x="502" y="119">纯噪声</text>
    <rect x="564" y="90" width="76" height="50" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#sd)"/><text x="602" y="119">去噪</text>
    <rect x="664" y="90" width="76" height="50" rx="8" fill="#e8ecff" stroke="#10b981" stroke-width="2" filter="url(#sd)"/><text x="702" y="119">x₀</text>
  </g>
  <line x1="540" y1="115" x2="560" y2="115" stroke="#10b981" stroke-width="2" marker-end="url(#ad)"/>
  <line x1="640" y1="115" x2="660" y2="115" stroke="#10b981" stroke-width="2" marker-end="url(#ad)"/>

  <!-- bottom note -->
  <rect x="120" y="210" width="260" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="250" y="235" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">数据空间扩散（DDPM）</text>
  <text x="250" y="258" text-anchor="middle" font-size="11" fill="#64748b">原始空间、计算开销大</text>

  <rect x="420" y="210" width="260" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="550" y="235" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">潜在空间扩散（Stable）</text>
  <text x="550" y="258" text-anchor="middle" font-size="11" fill="#64748b">压缩后去噪、推荐更常用</text>

  <text x="400" y="320" text-anchor="middle" font-size="13" fill="#64748b">Diffusion 与 Transformer 互补：DiT 即以 Transformer 作去噪骨干。</text>
</svg>
