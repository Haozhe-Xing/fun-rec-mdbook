<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="640" rx="8" fill="#f8f9fc"/>
  <text x="400" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">广告作弊手法与对抗矩阵</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#64748b">谁在作弊 → 怎么作弊 → 统计上留下什么破绽 → 用什么手段对抗</text>

  <!-- Top strip: who cheats -->
  <rect x="24" y="66" width="240" height="56" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="144" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A6CF7">媒体作弊</text>
  <text x="144" y="108" text-anchor="middle" font-size="11" fill="#64748b">点击作弊为主，兼有曝光刷量</text>
  <rect x="280" y="66" width="240" height="56" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="400" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A6CF7">广告平台作弊</text>
  <text x="400" y="108" text-anchor="middle" font-size="11" fill="#64748b">虚假点击分成 · DSP 虚假转化</text>
  <rect x="536" y="66" width="240" height="56" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="656" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A6CF7">广告主竞争对手</text>
  <text x="656" y="108" text-anchor="middle" font-size="11" fill="#64748b">恶意消耗对手预算</text>

  <!-- Table header -->
  <rect x="24" y="140" width="196" height="34" rx="8" fill="#1e293b"/>
  <text x="122" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">常见作弊手法</text>
  <rect x="228" y="140" width="110" height="34" rx="8" fill="#1e293b"/>
  <text x="283" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">作弊类型</text>
  <rect x="346" y="140" width="430" height="34" rx="8" fill="#1e293b"/>
  <text x="561" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">统计破绽与对抗手段</text>

  <!-- Row 1 -->
  <rect x="24" y="182" width="196" height="42" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="34" y="207" font-size="12.5" font-weight="bold" fill="#1e293b">服务器刷监测代码</text>
  <rect x="228" y="182" width="110" height="42" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="283" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#ef4444">虚假流量</text>
  <rect x="346" y="182" width="430" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="358" y="207" font-size="12" fill="#1e293b">IDC 机房 IP 集中 → 屏蔽数据中心 IP 段、代理 IP 识别</text>

  <!-- Row 2 -->
  <rect x="24" y="232" width="196" height="42" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="34" y="257" font-size="12.5" font-weight="bold" fill="#1e293b">客户端刷监测代码</text>
  <rect x="228" y="232" width="110" height="42" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="283" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#ef4444">虚假流量</text>
  <rect x="346" y="232" width="430" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="358" y="251" font-size="12" fill="#1e293b">用户频次聚在 8/16/24/32 → 频次分布傅里叶找基频；</text>
  <text x="358" y="268" font-size="12" fill="#64748b">点击热力图：机器点击分布过于均匀或过于集中</text>

  <!-- Row 3 -->
  <rect x="24" y="282" width="196" height="42" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="34" y="307" font-size="12.5" font-weight="bold" fill="#1e293b">频繁更换用户身份</text>
  <rect x="228" y="282" width="110" height="42" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="283" y="307" text-anchor="middle" font-size="12" font-weight="bold" fill="#ef4444">虚假流量</text>
  <rect x="346" y="282" width="430" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="358" y="301" font-size="12" fill="#1e293b">单一 IP / cookie 超上限 → 频次上限 + 黑名单；</text>
  <text x="358" y="318" font-size="12" fill="#64748b">DSP 侧：首次见到的设备号不参与竞价</text>

  <!-- Row 4 -->
  <rect x="24" y="332" width="196" height="42" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="34" y="357" font-size="12.5" font-weight="bold" fill="#1e293b">肉鸡感染与手机 root</text>
  <rect x="228" y="332" width="110" height="42" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="283" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#ef4444">虚假流量</text>
  <rect x="346" y="332" width="430" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="358" y="351" font-size="12" fill="#1e293b">数据与真实用户无异 → 设备指纹、root / 越狱环境检测、</text>
  <text x="358" y="368" font-size="12" fill="#64748b">行为序列异常检测</text>

  <!-- Row 5 -->
  <rect x="24" y="382" width="196" height="42" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="34" y="407" font-size="12.5" font-weight="bold" fill="#1e293b">流量劫持（信道弹窗等）</text>
  <rect x="228" y="382" width="110" height="42" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="283" y="407" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748b">准作弊</text>
  <rect x="346" y="382" width="430" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="358" y="401" font-size="12" fill="#1e293b">多层 iframe 伪装 URL → iframe 穿透取顶层 URL、</text>
  <text x="358" y="418" font-size="12" fill="#64748b">投放前（pre-bid）屏蔽劣质广告位；落地页来源劫持损广告主</text>

  <!-- Row 6 -->
  <rect x="24" y="432" width="196" height="42" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="34" y="457" font-size="12.5" font-weight="bold" fill="#1e293b">Cookie 填充（CPS 联盟）</text>
  <rect x="228" y="432" width="110" height="42" rx="8" fill="#fef9ec" stroke="#f59e0b" stroke-width="2"/>
  <text x="283" y="457" text-anchor="middle" font-size="12" font-weight="bold" fill="#f59e0b">归因作弊</text>
  <rect x="346" y="432" width="430" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="358" y="451" font-size="12" fill="#1e293b">静默打来源 cookie 抢自然转化 → 无点击转化监控、</text>
  <text x="358" y="468" font-size="12" fill="#64748b">点击率与转化率的交叉对账</text>

  <!-- Row 7 -->
  <rect x="24" y="482" width="196" height="42" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="34" y="507" font-size="12.5" font-weight="bold" fill="#1e293b">点击滥用（Click Spam）</text>
  <rect x="228" y="482" width="110" height="42" rx="8" fill="#fef9ec" stroke="#f59e0b" stroke-width="2"/>
  <text x="283" y="507" text-anchor="middle" font-size="12" font-weight="bold" fill="#f59e0b">归因作弊</text>
  <rect x="346" y="482" width="430" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="358" y="501" font-size="12" fill="#1e293b">CVR 比正常渠道低 1–2 个数量级；点击到转化时间</text>
  <text x="358" y="518" font-size="12" fill="#64748b">在归因周期内近似均匀分布 → 与正常渠道快速衰减分布对比</text>

  <!-- Row 8 -->
  <rect x="24" y="532" width="196" height="42" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="34" y="557" font-size="12.5" font-weight="bold" fill="#1e293b">点击注入（Click Injection）</text>
  <rect x="228" y="532" width="110" height="42" rx="8" fill="#fef9ec" stroke="#f59e0b" stroke-width="2"/>
  <text x="283" y="557" text-anchor="middle" font-size="12" font-weight="bold" fill="#f59e0b">归因作弊</text>
  <rect x="346" y="532" width="430" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="358" y="551" font-size="12" fill="#1e293b">安装广播后补发点击 → CVR 异常高、点击到激活间隔极短；</text>
  <text x="358" y="568" font-size="12" fill="#64748b">应用商店与归因监测方协作核验下载时间</text>

  <!-- Row 9 -->
  <rect x="24" y="582" width="196" height="42" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="34" y="607" font-size="12.5" font-weight="bold" fill="#1e293b">设备农场（Device Farm）</text>
  <rect x="228" y="582" width="110" height="42" rx="8" fill="#fef9ec" stroke="#f59e0b" stroke-width="2"/>
  <text x="283" y="607" text-anchor="middle" font-size="12" font-weight="bold" fill="#f59e0b">混合作弊</text>
  <rect x="346" y="582" width="430" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="358" y="601" font-size="12" fill="#1e293b">真人操作伪造转化 → 设备信誉分、IP 与设备聚集度、</text>
  <text x="358" y="618" font-size="12" fill="#64748b">设备-账号-IP 关联图分析</text>
</svg>
