<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="s16" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.15"/>
    </filter>
    <marker id="a16" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="420" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">ESMM：全空间联合建模化解 CVR 的样本偏差与稀疏</text>

  <!-- behavior chain -->
  <text x="60" y="78" font-size="12" fill="#1e293b" font-weight="600">行为链：</text>
  <g font-size="11">
    <rect x="60" y="88" width="90" height="32" rx="6" fill="#e8ecff"/><text x="105" y="108" text-anchor="middle" fill="#4A6CF7">曝光</text>
    <rect x="160" y="88" width="90" height="32" rx="6" fill="#e8ecff"/><text x="205" y="108" text-anchor="middle" fill="#4A6CF7">点击</text>
    <rect x="260" y="88" width="90" height="32" rx="6" fill="#e8ecff"/><text x="305" y="108" text-anchor="middle" fill="#4A6CF7">转化</text>
  </g>
  <text x="60" y="150" font-size="11" fill="#64748b">传统 CVR：只在「点击」空间训 → 偏差+稀疏</text>

  <!-- shared -->
  <rect x="300" y="170" width="200" height="44" rx="8" fill="#4A6CF7" filter="url(#s16)"/>
  <text x="400" y="197" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">共享表征层 h</text>
  <line x1="105" y1="120" x2="360" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#a16)"/>

  <!-- two towers -->
  <rect x="200" y="240" width="160" height="50" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#s16)"/>
  <text x="280" y="270" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="700">CTR 塔</text>
  <text x="280" y="288" text-anchor="middle" font-size="11" fill="#64748b">全量曝光训练</text>
  <rect x="440" y="240" width="160" height="50" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#s16)"/>
  <text x="520" y="270" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="700">CVR 塔</text>
  <text x="520" y="288" text-anchor="middle" font-size="11" fill="#64748b">不直接算 Loss</text>

  <line x1="360" y1="214" x2="280" y2="238" stroke="#64748b" stroke-width="2" marker-end="url(#a16)"/>
  <line x1="440" y1="214" x2="520" y2="238" stroke="#64748b" stroke-width="2" marker-end="url(#a16)"/>

  <!-- product -->
  <rect x="310" y="320" width="180" height="46" rx="8" fill="#1e293b" filter="url(#s16)"/>
  <text x="400" y="345" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">pCTCVR = pCTR × pCVR</text>
  <text x="400" y="362" text-anchor="middle" font-size="11" fill="#cbd5e1">全曝光空间算 Loss</text>

  <line x1="280" y1="290" x2="370" y2="318" stroke="#64748b" stroke-width="2" marker-end="url(#a16)"/>
  <line x1="520" y1="290" x2="430" y2="318" stroke="#64748b" stroke-width="2" marker-end="url(#a16)"/>

  <rect x="560" y="240" width="210" height="126" rx="8" fill="#e8ecff"/>
  <text x="665" y="266" text-anchor="middle" font-size="11.5" fill="#1e293b" font-weight="700">CVR 梯度来源</text>
  <text x="575" y="290" font-size="11" fill="#1e293b">∂L_CTCVR/∂pCTCVR · pCTR</text>
  <text x="575" y="312" font-size="11" fill="#1e293b">→ 来自全量曝光</text>
  <text x="575" y="334" font-size="11" fill="#10b981" font-weight="700">偏差+稀疏 双化解</text>
</svg>
