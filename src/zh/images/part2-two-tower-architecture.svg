<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="340" fill="#f8f9fc" rx="12"/>

  <text x="400" y="34" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">双塔模型：用户塔与物品塔各自编码后内积检索</text>

  <!-- user tower -->
  <rect x="40" y="70" width="200" height="200" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="95" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1e293b">用户塔 (在线)</text>
  <rect x="65" y="115" width="150" height="30" rx="6" fill="#ffffff" stroke="#4A6CF7" stroke-width="1"/>
  <text x="140" y="134" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">用户画像</text>
  <rect x="65" y="155" width="150" height="30" rx="6" fill="#ffffff" stroke="#4A6CF7" stroke-width="1"/>
  <text x="140" y="174" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">行为序列</text>
  <rect x="65" y="195" width="150" height="34" rx="6" fill="#4A6CF7" stroke="#1e293b" stroke-width="1"/>
  <text x="140" y="216" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#ffffff">DNN → u</text>

  <!-- item tower -->
  <rect x="560" y="70" width="200" height="200" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="95" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#065f46">物品塔 (离线)</text>
  <rect x="585" y="115" width="150" height="30" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
  <text x="660" y="134" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">物品ID/类目</text>
  <rect x="585" y="155" width="150" height="30" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
  <text x="660" y="174" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">属性特征</text>
  <rect x="585" y="195" width="150" height="34" rx="6" fill="#10b981" stroke="#065f46" stroke-width="1"/>
  <text x="660" y="216" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#ffffff">DNN → v</text>

  <!-- inner product -->
  <circle cx="400" cy="165" r="40" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="160" text-anchor="middle" font-family="Courier New" font-size="20" font-weight="bold" fill="#1e293b">⟨u,v⟩</text>
  <text x="400" y="182" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">内积</text>
  <line x1="240" y1="165" x2="358" y2="165" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="165" x2="442" y2="165" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ANN index -->
  <rect x="560" y="255" width="200" height="38" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="660" y="279" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">ANN 索引 (离线建)</text>
  <line x1="660" y1="235" x2="660" y2="253" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <line x1="40" y1="312" x2="760" y2="312" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="330" text-anchor="middle" font-family="Courier New" font-size="12" fill="#64748b">score = uᵀv (归一化后 ≡ 欧式距离) → ANN 检索 Top-K</text>
</svg>
