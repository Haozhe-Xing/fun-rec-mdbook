<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>

  <text x="400" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">PRS 两阶段框架：PMatch 生成候选排列 → PRank 评估选最优</text>

  <!-- candidate set -->
  <rect x="40" y="150" width="110" height="70" rx="8" fill="#f8f9fc" stroke="#e2e8f0" stroke-width="2" filter="url(#sh)"/>
  <text x="95" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">候选集 C</text>
  <text x="95" y="198" text-anchor="middle" font-size="11" fill="#64748b">n 个物品</text>
  <line x1="150" y1="185" x2="200" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- PMatch -->
  <rect x="200" y="110" width="280" height="150" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#sh)"/>
  <text x="340" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#ea580c">① PMatch 阶段（FPSA）</text>
  <g font-size="11.5" fill="#1e293b">
    <rect x="220" y="146" width="120" height="28" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/><text x="280" y="164" text-anchor="middle">CTR / Next 双模型</text>
    <rect x="350" y="146" width="115" height="28" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/><text x="407" y="164" text-anchor="middle">Beam Search</text>
    <rect x="220" y="182" width="245" height="28" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/><text x="342" y="200" text-anchor="middle">奖励融合：rPV（浏览深度）+ rIPV（点击）</text>
    <text x="340" y="246" text-anchor="middle" font-size="11" fill="#64748b">从 n! 中快速筛出少量候选排列</text>
  </g>
  <line x1="480" y1="185" x2="530" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- candidate permutations -->
  <rect x="530" y="150" width="110" height="70" rx="8" fill="#fef9ec" stroke="#d97706" stroke-width="2" filter="url(#sh)"/>
  <text x="585" y="178" text-anchor="middle" font-size="11.5" font-weight="700" fill="#d97706">候选排列集</text>
  <text x="585" y="198" text-anchor="middle" font-size="11" fill="#64748b">S (beam)</text>
  <line x1="640" y1="185" x2="690" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- PRank box -->
  <rect x="150" y="290" width="320" height="90" rx="8" fill="#eef2ff" stroke="#4A6CF7" stroke-width="2" filter="url(#sh)"/>
  <text x="310" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#4A6CF7">② PRank 阶段（DPWN）</text>
  <g font-size="11.5" fill="#1e293b">
    <rect x="170" y="322" width="130" height="28" rx="6" fill="#ffffff" stroke="#4A6CF7" stroke-width="1.5"/><text x="235" y="340" text-anchor="middle">Bi-LSTM 编码</text>
    <rect x="310" y="322" width="145" height="28" rx="6" fill="#ffffff" stroke="#4A6CF7" stroke-width="1.5"/><text x="382" y="340" text-anchor="middle">LR = Σ pₜ 评估</text>
    <text x="310" y="368" text-anchor="middle" font-size="11" fill="#64748b">对每个候选排列算 List Reward，选 LR 最高者</text>
  </g>

  <!-- connector from candidate set down to PRank -->
  <path d="M585,220 C585,260 470,260 310,290" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="500" y="270" font-size="11" fill="#64748b">送入评估</text>

  <!-- final output -->
  <rect x="510" y="290" width="160" height="90" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#sh)"/>
  <text x="590" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0c8f6a">最优排列</text>
  <text x="590" y="342" text-anchor="middle" font-size="11" fill="#64748b">LR 最高的顺序</text>
  <text x="590" y="362" text-anchor="middle" font-size="11" fill="#64748b">→ 最终列表</text>
  <line x1="470" y1="335" x2="508" y2="335" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
</svg>
