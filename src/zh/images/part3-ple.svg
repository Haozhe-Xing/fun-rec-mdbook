<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="s15" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.15"/>
    </filter>
    <marker id="a15" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="410" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">PLE / CGC：共享专家与任务专家物理隔离</text>

  <!-- input -->
  <rect x="340" y="56" width="120" height="40" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#s15)"/>
  <text x="400" y="82" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">输入 x</text>

  <!-- experts -->
  <rect x="190" y="120" width="120" height="40" rx="8" fill="#e6f7f1" stroke="#10b981" stroke-width="2" filter="url(#s15)"/>
  <text x="250" y="145" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="700">共享专家 C</text>
  <rect x="350" y="120" width="120" height="40" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#s15)"/>
  <text x="410" y="145" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="700">任务专家 T₁</text>
  <rect x="510" y="120" width="120" height="40" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#s15)"/>
  <text x="570" y="145" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="700">任务专家 T₂</text>

  <line x1="400" y1="96" x2="250" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#a15)"/>
  <line x1="400" y1="96" x2="410" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#a15)"/>
  <line x1="400" y1="96" x2="570" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#a15)"/>

  <!-- gates -->
  <rect x="350" y="190" width="120" height="36" rx="8" fill="#f59e0b" filter="url(#s15)"/>
  <text x="410" y="213" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="700">门控 g₁</text>
  <rect x="510" y="190" width="120" height="36" rx="8" fill="#f59e0b" filter="url(#s15)"/>
  <text x="570" y="213" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="700">门控 g₂</text>

  <!-- gate access constraints -->
  <line x1="410" y1="226" x2="250" y2="270" stroke="#10b981" stroke-width="2" marker-end="url(#a15)"/>
  <line x1="410" y1="226" x2="410" y2="270" stroke="#ef4444" stroke-width="2" marker-end="url(#a15)"/>
  <line x1="570" y1="226" x2="250" y2="270" stroke="#10b981" stroke-width="2" marker-end="url(#a15)"/>
  <line x1="570" y1="226" x2="570" y2="270" stroke="#ef4444" stroke-width="2" marker-end="url(#a15)"/>
  <text x="150" y="285" font-size="10.5" fill="#64748b">g₁ 仅见 C+T₁</text>
  <text x="640" y="285" font-size="10.5" fill="#64748b">g₂ 仅见 C+T₂</text>

  <!-- towers -->
  <rect x="330" y="285" width="120" height="48" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#s15)"/>
  <text x="390" y="314" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="700">塔1 (CTR)</text>
  <rect x="490" y="285" width="120" height="48" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#s15)"/>
  <text x="550" y="314" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="700">塔2 (CVR)</text>

  <rect x="190" y="350" width="420" height="44" rx="8" fill="#e8ecff"/>
  <text x="400" y="372" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="700">硬隔离：T₂ 梯度绝不更新 T₁ 参数（物理切断）</text>
  <text x="400" y="390" text-anchor="middle" font-size="11" fill="#64748b">PLE = 纵向堆叠多个 CGC 单元，逐层分离+融合</text>
</svg>
