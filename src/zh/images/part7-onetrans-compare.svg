<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr14" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <filter id="sh14"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="800" height="380" fill="#f8f9fc"/>
  <text x="400" y="34" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">架构对比：分离式 vs 统一 Transformer</text>

  <!-- Left encode-then-interaction -->
  <rect x="40" y="60" width="350" height="290" rx="12" fill="#ffffff" stroke="#e8ecff" filter="url(#sh14)"/>
  <text x="215" y="86" font-size="14" font-weight="700" fill="#ef4444" text-anchor="middle">encode-then-interaction（分离）</text>
  <rect x="70" y="105" width="120" height="36" rx="8" fill="#e8ecff" stroke="#4A6CF7"/>
  <text x="130" y="128" font-size="11.5" fill="#1e293b" text-anchor="middle">行为序列</text>
  <rect x="210" y="105" width="120" height="36" rx="8" fill="#e8ecff" stroke="#4A6CF7"/>
  <text x="270" y="128" font-size="11.5" fill="#1e293b" text-anchor="middle">静态特征</text>
  <rect x="70" y="155" width="260" height="36" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="200" y="178" font-size="11.5" fill="#1e293b" text-anchor="middle">序列编码 → 定长向量</text>
  <path d="M200" fill="none"/>
  <line x1="200" y1="191" x2="200" y2="210" stroke="#64748b" marker-end="url(#arr14)"/>
  <rect x="70" y="213" width="260" height="36" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="200" y="236" font-size="11.5" fill="#1e293b" text-anchor="middle">拼接 → 特征交互模块</text>
  <text x="215" y="285" font-size="11" fill="#ef4444" text-anchor="middle">✗ 序列压成定长，信息流受限</text>
  <text x="215" y="308" font-size="11" fill="#ef4444" text-anchor="middle">✗ 两模块独立，难享 KV Cache</text>
  <text x="215" y="331" font-size="11" fill="#ef4444" text-anchor="middle">✗ 分别调优，无统一 Scaling Law</text>

  <!-- Right OneTrans -->
  <rect x="430" y="60" width="330" height="290" rx="12" fill="#ffffff" stroke="#e8ecff" filter="url(#sh14)"/>
  <text x="595" y="86" font-size="14" font-weight="700" fill="#10b981" text-anchor="middle">OneTrans（统一）</text>
  <g font-size="10" text-anchor="middle">
    <rect x="450" y="105" width="40" height="28" rx="6" fill="#f0f4ff" stroke="#4A6CF7"/><text x="470" y="123">S₁</text>
    <rect x="496" y="105" width="40" height="28" rx="6" fill="#f0f4ff" stroke="#4A6CF7"/><text x="516" y="123">S₂</text>
    <rect x="542" y="105" width="40" height="28" rx="6" fill="#f0f4ff" stroke="#4A6CF7"/><text x="562" y="123">S₃</text>
    <rect x="620" y="105" width="40" height="28" rx="6" fill="#fef2f2" stroke="#ef4444"/><text x="640" y="123">NS₁</text>
    <rect x="666" y="105" width="40" height="28" rx="6" fill="#fef2f2" stroke="#ef4444"/><text x="686" y="123">NS₂</text>
  </g>
  <rect x="450" y="150" width="290" height="44" rx="8" fill="#f0fdf4" stroke="#10b981"/>
  <text x="595" y="178" font-size="12" fill="#1e293b" text-anchor="middle">单一 Transformer：S 与 NS 同层联合注意力</text>
  <line x1="595" y1="194" x2="595" y2="214" stroke="#64748b" marker-end="url(#arr14)"/>
  <rect x="450" y="217" width="290" height="36" rx="8" fill="#f0fdf4" stroke="#10b981"/>
  <text x="595" y="240" font-size="11.5" fill="#1e293b" text-anchor="middle">输出 logit（排序）</text>
  <text x="595" y="285" font-size="11" fill="#10b981" text-anchor="middle">✓ 保留完整序列 token，同矩阵交互</text>
  <text x="595" y="308" font-size="11" fill="#10b981" text-anchor="middle">✓ 复用 KV Caching / FlashAttention</text>
  <text x="595" y="331" font-size="11" fill="#10b981" text-anchor="middle">✓ 单 backbone，整体可扩展</text>

  <text x="400" y="372" font-size="12" fill="#64748b" text-anchor="middle">从「模块组合」到「统一建模」——打破序列与特征的信息壁垒</text>
</svg>
