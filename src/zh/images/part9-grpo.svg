<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow9g" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="320" fill="#f8f9fc" rx="12"/>
  <text x="400" y="34" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#1e293b">GRPO：相对优势驱动多有效性推理</text>

  <text x="400" y="62" text-anchor="middle" font-family="Arial" font-size="13" fill="#64748b">对同一用户采样 K 条推理路径 rollout，按相对奖励学习「哪些更好」</text>

  <g font-family="Courier New" font-size="13" text-anchor="middle">
    <rect x="40" y="90" width="150" height="60" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5" filter="url(#shadow9g)"/>
    <text x="115" y="115" fill="#1e293b">rollout 1</text><text x="115" y="138" font-family="Arial" font-size="11" fill="#10b981">r=0.8 ↑</text>
    <rect x="215" y="90" width="150" height="60" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5" filter="url(#shadow9g)"/>
    <text x="290" y="115" fill="#1e293b">rollout 2</text><text x="290" y="138" font-family="Arial" font-size="11" fill="#ef4444">r=0.3 ↓</text>
    <rect x="390" y="90" width="150" height="60" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5" filter="url(#shadow9g)"/>
    <text x="465" y="115" fill="#1e293b">rollout 3</text><text x="465" y="138" font-family="Arial" font-size="11" fill="#10b981">r=0.7 ↑</text>
    <rect x="565" y="90" width="150" height="60" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5" filter="url(#shadow9g)"/>
    <text x="640" y="115" fill="#1e293b">rollout 4</text><text x="640" y="138" font-family="Arial" font-size="11" fill="#ef4444">r=0.2 ↓</text>
  </g>

  <!-- mean -->
  <rect x="300" y="180" width="200" height="50" rx="8" fill="#1e293b" filter="url(#shadow9g)"/>
  <text x="400" y="202" text-anchor="middle" font-family="Courier New" font-size="13" fill="#e2e8f0">mean r = 0.5</text>
  <text x="400" y="220" text-anchor="middle" font-family="Arial" font-size="11" fill="#94a3b8">基线（group average）</text>

  <!-- advantage -->
  <g font-family="Arial" font-size="12" text-anchor="middle">
    <rect x="40" y="250" width="150" height="40" rx="8" fill="#e8f5ee" stroke="#10b981" stroke-width="1.5"/>
    <text x="115" y="275" fill="#16a34a">Â=+0.3 增强</text>
    <rect x="565" y="250" width="150" height="40" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="640" y="275" fill="#dc2626">Â=−0.3 抑制</text>
  </g>

  <line x1="115" y1="150" x2="320" y2="190" stroke="#4A6CF7" stroke-width="1.5"/>
  <line x1="465" y1="150" x2="400" y2="190" stroke="#4A6CF7" stroke-width="1.5"/>
  <line x1="400" y1="230" x2="115" y2="248" stroke="#10b981" stroke-width="1.5"/>
  <line x1="400" y1="230" x2="640" y2="248" stroke="#ef4444" stroke-width="1.5"/>
</svg>
