<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#10b981"/>
    </marker>
    <marker id="arR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">预算 Pacing 反馈控制回路：让消耗进度紧跟参照轨迹</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#64748b">上图：PI 控制器根据误差调节出价乘子 α 的闭环；下图：参照轨迹 vs 实际消耗曲线</text>

  <!-- ══ 控制回路 ══ -->
  <!-- 参照轨迹 -->
  <rect x="60" y="200" width="150" height="64" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#sh)"/>
  <text x="135" y="225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">参照轨迹</text>
  <text x="135" y="246" text-anchor="middle" font-size="12.5" fill="#64748b" font-family="Courier New, monospace">r(t) = G · t / T</text>

  <!-- comparator -->
  <circle cx="278" cy="232" r="20" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="278" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Σ</text>
  <text x="255" y="205" font-size="13" font-weight="700" fill="#10b981">+</text>
  <text x="288" y="272" font-size="13" font-weight="700" fill="#ef4444">−</text>

  <line x1="210" y1="232" x2="254" y2="232" stroke="#10b981" stroke-width="2" marker-end="url(#arG)"/>
  <text x="216" y="222" font-size="11" fill="#64748b">目标进度</text>

  <!-- error -->
  <line x1="298" y1="232" x2="352" y2="232" stroke="#4A6CF7" stroke-width="2" marker-end="url(#ar)"/>
  <text x="304" y="222" font-size="11.5" fill="#ef4444" font-family="Courier New, monospace">e(t)</text>

  <!-- PI controller -->
  <rect x="356" y="200" width="160" height="64" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#sh)"/>
  <text x="436" y="225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">PI 控制器</text>
  <text x="436" y="246" text-anchor="middle" font-size="12" fill="#64748b" font-family="Courier New, monospace">u = Kp·e + Ki·∫e</text>

  <line x1="516" y1="232" x2="562" y2="232" stroke="#4A6CF7" stroke-width="2" marker-end="url(#ar)"/>
  <text x="524" y="222" font-size="11.5" fill="#64748b" font-family="Courier New, monospace">u(t)</text>

  <!-- sigmoid -->
  <rect x="566" y="200" width="180" height="64" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#sh)"/>
  <text x="656" y="225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">Sigmoid 压缩</text>
  <text x="656" y="246" text-anchor="middle" font-size="12" fill="#64748b" font-family="Courier New, monospace">α = σ(u) ∈ [0,1]</text>

  <!-- down to bid scaling -->
  <line x1="656" y1="264" x2="656" y2="306" stroke="#4A6CF7" stroke-width="2" marker-end="url(#ar)"/>
  <text x="668" y="292" font-size="11.5" fill="#64748b" font-family="Courier New, monospace">α</text>

  <!-- bid scaling + auction row -->
  <rect x="536" y="310" width="210" height="64" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#sh)"/>
  <text x="641" y="335" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">出价缩放 + 竞价</text>
  <text x="641" y="356" text-anchor="middle" font-size="12" fill="#64748b" font-family="Courier New, monospace">b' = α · b → ADX 拍卖</text>

  <line x1="532" y1="342" x2="424" y2="342" stroke="#4A6CF7" stroke-width="2" marker-end="url(#ar)"/>
  <text x="452" y="332" font-size="11.5" fill="#64748b">参拍 / 计费</text>

  <!-- actual spend -->
  <rect x="260" y="310" width="160" height="64" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#sh)"/>
  <text x="340" y="335" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">实际消耗</text>
  <text x="340" y="356" text-anchor="middle" font-size="12" fill="#64748b" font-family="Courier New, monospace">N(t)（累计）</text>

  <!-- feedback line -->
  <path d="M 258 342 L 200 342 L 200 300 L 278 300 L 278 256" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arR)"/>
  <text x="150" y="298" font-size="11" fill="#ef4444">反馈：实际进度</text>

  <text x="400" y="404" text-anchor="middle" font-size="12" fill="#64748b">误差 e(t) = r(t) − N(t)（或对数比形式 −log(N(t)/r(t))，消除规模依赖）；消耗偏慢 → α 升高，消耗偏快 → α 压低</text>

  <!-- ══ 消耗曲线图 ══ -->
  <rect x="80" y="424" width="640" height="160" fill="#f8f9fc" stroke="#e8ecff" stroke-width="1"/>
  <line x1="80" y1="584" x2="720" y2="584" stroke="#64748b" stroke-width="2"/>
  <line x1="80" y1="424" x2="80" y2="584" stroke="#64748b" stroke-width="2"/>

  <!-- budget ceiling -->
  <line x1="80" y1="452" x2="720" y2="452" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="726" y="456" font-size="11" fill="#64748b">预算 G</text>

  <!-- reference trajectory -->
  <line x1="80" y1="584" x2="720" y2="452" stroke="#10b981" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="560" y="486" font-size="12" fill="#10b981" font-weight="700">参照轨迹 r(t)=G·t/T</text>

  <!-- no-pacing curve (front-loaded, red): budget exhausted at 40% of day -->
  <path d="M 80 584 C 200 500, 300 462, 336 452 L 720 452" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="336" cy="452" r="5" fill="#ef4444"/>
  <text x="300" y="440" font-size="12" fill="#ef4444" font-weight="700">无 pacing：前置耗尽</text>

  <!-- paced curve (blue): tracks reference -->
  <path d="M 80 584 C 180 570, 260 548, 360 520 C 460 494, 560 474, 720 456" fill="none" stroke="#4A6CF7" stroke-width="2.5"/>
  <text x="600" y="530" font-size="12" fill="#4A6CF7" font-weight="700">PI pacing 实际消耗</text>

  <!-- axis labels -->
  <text x="400" y="612" text-anchor="middle" font-size="12" fill="#64748b">投放时间 t（凌晨 → 晚高峰 → T）</text>
  <text x="38" y="504" text-anchor="middle" font-size="12" fill="#64748b" transform="rotate(-90 38 504)">累计消耗</text>
  <g font-size="11" fill="#64748b">
    <circle cx="180" cy="470" r="4" fill="#ef4444"/><text x="190" y="474">凌晨抢量：错过晚高峰优质流量</text>
    <circle cx="640" cy="560" r="4" fill="#10b981"/><text x="650" y="564">平滑消耗：触达更广受众</text>
  </g>

  <!-- footer -->
  <rect x="60" y="620" width="680" height="16" rx="6" fill="#f8f9fc" stroke="#e8ecff" stroke-width="1"/>
  <text x="400" y="632" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">D 项在工程上普遍被砍掉（请求是离散阶跃信号，D 放大噪声）→ 实际部署多为 PI 控制</text>
</svg>
