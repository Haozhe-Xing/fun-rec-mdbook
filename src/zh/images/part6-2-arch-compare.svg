<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" font-family="Arial, sans-serif">
  <defs>
    <marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/></marker>
    <filter id="sc" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="800" height="380" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Encoder-Decoder vs Decoder-Only</text>

  <!-- Encoder-Decoder -->
  <text x="190" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#4A6CF7">Encoder-Decoder（双塔）</text>
  <rect x="50" y="90" width="180" height="56" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#sc)"/>
  <text x="140" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Encoder</text>
  <text x="140" y="131" text-anchor="middle" font-size="11" fill="#64748b">双向自注意力</text>
  <rect x="50" y="170" width="180" height="56" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#sc)"/>
  <text x="140" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Decoder</text>
  <text x="140" y="211" text-anchor="middle" font-size="11" fill="#64748b">因果 + 交叉注意力</text>
  <line x1="140" y1="146" x2="140" y2="168" stroke="#4A6CF7" stroke-width="2" marker-end="url(#ac)"/>
  <text x="140" y="255" text-anchor="middle" font-size="11" fill="#64748b">适合异构输入输出</text>
  <text x="140" y="273" text-anchor="middle" font-size="11" fill="#64748b">MFU 5–10%</text>
  <text x="140" y="305" text-anchor="middle" font-size="11" fill="#64748b">代表：TIGER, OneRec</text>

  <!-- Decoder-Only -->
  <text x="600" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#10b981">Decoder-Only（单塔）</text>
  <rect x="470" y="90" width="260" height="210" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#sc)"/>
  <text x="600" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">统一 Decoder 层 × N</text>
  <text x="600" y="131" text-anchor="middle" font-size="11" fill="#64748b">单一因果自注意力</text>
  <g font-size="10" fill="#64748b" text-anchor="middle">
    <text x="600" y="175">输入+输出拼接为连续序列</text>
    <text x="600" y="200">参数高效 / 工程简化</text>
    <text x="600" y="225">MFU 20%+（OneRec-V2）</text>
    <text x="600" y="255">兼容 LLM 生态（GPT/LLaMA）</text>
    <text x="600" y="285">代表：HSTU, RecGPT, OneRec-V2</text>
  </g>
  <path d="M600,146 C600,170 600,170 600,170" fill="none" stroke="#10b981" stroke-width="2"/>

  <!-- center arrow tradeoff -->
  <line x1="250" y1="190" x2="466" y2="150" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ac)"/>
  <text x="360" y="165" text-anchor="middle" font-size="10" fill="#64748b">更统一 ⇒ 更高效</text>
</svg>
