<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <filter id="s5" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="300" fill="#f8f9fc" rx="12"/>

  <text x="400" y="32" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#1e293b">Capability Evolution of Recommenders × Chapter Map of This Book</text>

  <!-- timeline -->
  <line x1="70" y1="135" x2="740" y2="135" stroke="#cbd5e1" stroke-width="3"/>
  <text x="400" y="175" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">Time → capability moves from "Memorization" to "Reasoning"</text>

  <!-- 4 stages -->
  <g>
    <circle cx="160" cy="135" r="26" fill="#4A6CF7" filter="url(#s5)"/>
    <text x="160" y="131" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#fff">Memorize</text>
    <text x="160" y="147" text-anchor="middle" font-family="Arial" font-size="11" fill="#dbeafe">ID</text>
    <text x="160" y="208" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Ch2 Retrieval</text>
  </g>
  <g>
    <circle cx="350" cy="135" r="26" fill="#10b981" filter="url(#s5)"/>
    <text x="350" y="131" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#fff">Generalize</text>
    <text x="350" y="147" text-anchor="middle" font-family="Arial" font-size="11" fill="#d1fae5">DNN</text>
    <text x="350" y="208" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Ch3 Ranking</text>
  </g>
  <g>
    <circle cx="540" cy="135" r="26" fill="#f59e0b" filter="url(#s5)"/>
    <text x="540" y="131" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#fff">Understand</text>
    <text x="540" y="147" text-anchor="middle" font-family="Arial" font-size="10" fill="#fef3c7">Sem. ID</text>
    <text x="540" y="208" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Ch5 Generative</text>
  </g>
  <g>
    <circle cx="700" cy="135" r="26" fill="#dc2626" filter="url(#s5)"/>
    <text x="700" y="131" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">Reason</text>
    <text x="700" y="147" text-anchor="middle" font-family="Arial" font-size="11" fill="#fecaca">LLM</text>
    <text x="700" y="208" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Ch8 Thinking</text>
  </g>

  <!-- two paradigm bands -->
  <rect x="70" y="238" width="370" height="50" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>
  <text x="255" y="260" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#4A6CF7">Discriminative Track</text>
  <text x="255" y="280" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">Ch2 Retrieval · Ch3 Ranking · Ch4 Re-Ranking · Ch5.1–5.2 Trends</text>

  <rect x="455" y="238" width="285" height="50" rx="8" fill="#fef9ec" stroke="#d97706" stroke-width="1.5"/>
  <text x="597" y="260" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#d97706">Generative Track</text>
  <text x="597" y="280" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">Ch5 Basics · Ch6 Scaling · Ch7 E2E · Ch8 Thinking</text>
</svg>
