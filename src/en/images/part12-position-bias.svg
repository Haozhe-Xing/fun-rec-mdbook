<svg width="800" height="490" viewBox="0 0 800 490" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrPb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <filter id="shdPb" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="490" fill="#f8f9fc" rx="12"/>
  <text x="400" y="32" text-anchor="middle" font-family="Arial" font-size="16.5" font-weight="bold" fill="#1e293b">位置偏差：examination 假设与 PAL 双塔解耦</text>

  <!-- Left panel: examination hypothesis -->
  <rect x="30" y="52" width="352" height="330" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shdPb)"/>
  <text x="206" y="78" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="bold" fill="#4A6CF7">examination 假设：点击 = 被看到 × 值得点击</text>

  <!-- position 1 -->
  <rect x="52" y="98" width="70" height="34" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="87" y="120" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1e293b">位置 1</text>
  <rect x="138" y="105" width="120" height="20" rx="4" fill="#e8ecff"/>
  <rect x="138" y="105" width="108" height="20" rx="4" fill="#4A6CF7"/>
  <text x="272" y="120" font-family="Courier New" font-size="12" fill="#1e293b">0.90</text>

  <!-- position 2 -->
  <rect x="52" y="144" width="70" height="34" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="87" y="166" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1e293b">位置 2</text>
  <rect x="138" y="151" width="120" height="20" rx="4" fill="#e8ecff"/>
  <rect x="138" y="151" width="72" height="20" rx="4" fill="#4A6CF7"/>
  <text x="272" y="166" font-family="Courier New" font-size="12" fill="#1e293b">0.60</text>

  <!-- position 3 -->
  <rect x="52" y="190" width="70" height="34" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="87" y="212" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1e293b">位置 3</text>
  <rect x="138" y="197" width="120" height="20" rx="4" fill="#e8ecff"/>
  <rect x="138" y="197" width="36" height="20" rx="4" fill="#4A6CF7"/>
  <text x="272" y="212" font-family="Courier New" font-size="12" fill="#1e293b">0.30</text>
  <text x="206" y="242" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">P(seen | position)：位置越靠前，被看到的概率越高</text>

  <!-- formula -->
  <rect x="52" y="256" width="308" height="56" rx="8" fill="#f8f9fc" stroke="#4A6CF7" stroke-width="2"/>
  <text x="206" y="279" text-anchor="middle" font-family="Courier New" font-size="13" fill="#1e293b">P(click) = P(seen|position)</text>
  <text x="206" y="299" text-anchor="middle" font-family="Courier New" font-size="13" fill="#1e293b">          × P(relevant|user,ad)</text>

  <text x="206" y="334" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#1e293b">假设一：是否被看到只取决于位置</text>
  <text x="206" y="354" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#1e293b">假设二：被看到后是否点击与位置无关</text>
  <text x="206" y="374" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">位置靠前的广告点击多，未必因为它更相关</text>

  <!-- Right panel: PAL -->
  <rect x="402" y="52" width="368" height="330" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shdPb)"/>
  <text x="586" y="78" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="bold" fill="#10b981">PAL 结构化解耦（华为，RecSys 2019）</text>

  <!-- position input -->
  <rect x="414" y="96" width="62" height="32" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="445" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e293b">位置</text>
  <!-- ProbSeen tower -->
  <rect x="516" y="92" width="118" height="40" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#shdPb)"/>
  <text x="575" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#4A6CF7">ProbSeen(位置)</text>
  <line x1="476" y1="112" x2="512" y2="112" stroke="#64748b" stroke-width="2" marker-end="url(#arrPb)"/>

  <!-- user ad context input -->
  <rect x="414" y="156" width="92" height="32" rx="8" fill="#e8ecff" stroke="#10b981" stroke-width="2"/>
  <text x="460" y="177" text-anchor="middle" font-family="Arial" font-size="10.5" font-weight="bold" fill="#1e293b">user·ad·ctx</text>
  <!-- pCTR tower -->
  <rect x="516" y="152" width="118" height="40" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shdPb)"/>
  <text x="575" y="177" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#10b981">pCTR(u,a,c)</text>
  <line x1="506" y1="172" x2="512" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#arrPb)"/>

  <!-- multiply node -->
  <circle cx="676" cy="142" r="13" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="676" y="147" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1e293b">×</text>
  <line x1="634" y1="112" x2="668" y2="134" stroke="#64748b" stroke-width="2" marker-end="url(#arrPb)"/>
  <line x1="634" y1="172" x2="668" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrPb)"/>

  <!-- bCTR output -->
  <rect x="700" y="120" width="60" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" filter="url(#shdPb)"/>
  <text x="730" y="147" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#d97706">bCTR</text>
  <line x1="689" y1="142" x2="696" y2="142" stroke="#64748b" stroke-width="2" marker-end="url(#arrPb)"/>

  <!-- training note -->
  <rect x="414" y="212" width="346" height="58" rx="8" fill="#f8f9fc" stroke="#64748b" stroke-width="2"/>
  <text x="587" y="235" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#1e293b">训练：bCTR = ProbSeen × pCTR 对齐真实点击标签</text>
  <text x="587" y="255" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#1e293b">两塔乘积联合、端到端优化</text>

  <!-- online note -->
  <rect x="414" y="282" width="346" height="58" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="587" y="305" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="bold" fill="#10b981">线上：只走 pCTR 塔（绿色）</text>
  <text x="587" y="325" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#1e293b">位置由排序结果决定，推理时不可用</text>

  <text x="586" y="364" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">AB 测试：CTR / CVR 相对基线 +3%~35%</text>

  <!-- bottom notes -->
  <rect x="30" y="400" width="740" height="74" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="50" y="427" font-family="Arial" font-size="12" fill="#1e293b">位置作为特征：推理时位置未知只能填默认值，结果次优；IPW：倾向分难估、随机流量伤体验。</text>
  <text x="50" y="454" font-family="Arial" font-size="12" fill="#1e293b">PAL 把「位置效应」与「相关性」拆成两个可乘模块：训练期联合、推理期解耦，兼得无偏与工程可用。</text>
</svg>
