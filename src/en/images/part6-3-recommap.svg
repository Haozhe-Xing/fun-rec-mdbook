<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" font-family="Arial, sans-serif">
  <defs>
    <marker id="am" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/></marker>
    <filter id="sm2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="800" height="340" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Mapping the LLM Three Stages to Generative Recommendation</text>

  <!-- LLM column -->
  <text x="160" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#4A6CF7">LLM Stages</text>
  <g text-anchor="middle" font-size="13" fill="#1e293b">
    <rect x="60" y="90" width="200" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#sm2)"/><text x="160" y="119">Pre-training (CLM)</text>
    <rect x="60" y="158" width="200" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#sm2)"/><text x="160" y="187">Instruction Tuning (SFT)</text>
    <rect x="60" y="226" width="200" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#sm2)"/><text x="160" y="255">Alignment (RLHF/DPO)</text>
  </g>

  <!-- arrows -->
  <line x1="262" y1="114" x2="378" y2="114" stroke="#4A6CF7" stroke-width="2" marker-end="url(#am)"/>
  <line x1="262" y1="182" x2="378" y2="182" stroke="#4A6CF7" stroke-width="2" marker-end="url(#am)"/>
  <line x1="262" y1="250" x2="378" y2="250" stroke="#4A6CF7" stroke-width="2" marker-end="url(#am)"/>

  <!-- REC column -->
  <text x="560" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#10b981">RecSys Adaptation</text>
  <g text-anchor="middle" font-size="12" fill="#1e293b">
    <rect x="400" y="90" width="320" height="48" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#sm2)"/><text x="560" y="112" font-size="11">Behavior-seq pre-training · Multimodal content</text><text x="560" y="130" font-size="11" fill="#64748b">Challenge: balancing language vs rec ability</text>
    <rect x="400" y="158" width="320" height="48" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#sm2)"/><text x="560" y="180">Rec tasks as instructions · Multi-task joint</text><text x="560" y="198" font-size="11" fill="#64748b">Challenge: how to handle ID-based items</text>
    <rect x="400" y="226" width="320" height="48" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#sm2)"/><text x="560" y="248">Implicit-feedback alignment · Biz metrics</text><text x="560" y="266" font-size="11" fill="#64748b">Challenge: how to balance multiple objectives</text>
  </g>
</svg>
