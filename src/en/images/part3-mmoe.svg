<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="s14" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.15"/>
    </filter>
    <marker id="a14" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="420" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Shared-Bottom 与 MMoE 的结构对比</text>

  <!-- LEFT Shared-Bottom -->
  <rect x="40" y="60" width="330" height="310" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#s14)"/>
  <rect x="40" y="60" width="330" height="32" rx="8" fill="#64748b"/>
  <text x="205" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Shared-Bottom</text>
  <rect x="135" y="110" width="140" height="40" rx="8" fill="#4A6CF7"/>
  <text x="205" y="135" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="700">共享底层（硬）</text>
  <line x1="175" y1="150" x2="125" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#a14)"/>
  <line x1="235" y1="150" x2="285" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#a14)"/>
  <rect x="70" y="200" width="110" height="44" rx="8" fill="#e8ecff" stroke="#10b981" stroke-width="2"/>
  <text x="125" y="227" text-anchor="middle" font-size="12" fill="#1e293b">塔1 CTR</text>
  <rect x="230" y="200" width="110" height="44" rx="8" fill="#e8ecff" stroke="#10b981" stroke-width="2"/>
  <text x="285" y="227" text-anchor="middle" font-size="12" fill="#1e293b">塔2 CVR</text>
  <text x="205" y="300" text-anchor="middle" font-size="11.5" fill="#ef4444" font-weight="700">冲突 → 负迁移</text>
  <text x="205" y="322" text-anchor="middle" font-size="11" fill="#64748b">两塔共用同一地基</text>
  <text x="205" y="340" text-anchor="middle" font-size="11" fill="#64748b">梯度互相牵制</text>

  <!-- RIGHT MMoE -->
  <rect x="430" y="60" width="330" height="310" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#s14)"/>
  <rect x="430" y="60" width="330" height="32" rx="8" fill="#4A6CF7"/>
  <text x="595" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">MMoE</text>

  <g font-size="11">
    <rect x="450" y="105" width="80" height="34" rx="6" fill="#e8ecff"/><text x="490" y="126" text-anchor="middle" fill="#4A6CF7">专家 e₁</text>
    <rect x="540" y="105" width="80" height="34" rx="6" fill="#e8ecff"/><text x="580" y="126" text-anchor="middle" fill="#4A6CF7">专家 e₂</text>
    <rect x="630" y="105" width="80" height="34" rx="6" fill="#e8ecff"/><text x="670" y="126" text-anchor="middle" fill="#4A6CF7">专家 e₃</text>
  </g>

  <rect x="450" y="160" width="110" height="36" rx="8" fill="#f59e0b"/>
  <text x="505" y="183" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="700">门控 g₁(CTR)</text>
  <rect x="600" y="160" width="110" height="36" rx="8" fill="#f59e0b"/>
  <text x="655" y="183" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="700">门控 g₂(CVR)</text>

  <line x1="505" y1="196" x2="505" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#a14)"/>
  <line x1="655" y1="196" x2="655" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#a14)"/>
  <line x1="490" y1="139" x2="505" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#a14)"/>
  <line x1="670" y1="139" x2="655" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#a14)"/>

  <rect x="450" y="234" width="110" height="44" rx="8" fill="#e8ecff" stroke="#10b981" stroke-width="2"/>
  <text x="505" y="261" text-anchor="middle" font-size="12" fill="#1e293b">塔1 CTR</text>
  <rect x="600" y="234" width="110" height="44" rx="8" fill="#e8ecff" stroke="#10b981" stroke-width="2"/>
  <text x="655" y="261" text-anchor="middle" font-size="12" fill="#1e293b">塔2 CVR</text>

  <text x="595" y="318" text-anchor="middle" font-size="11.5" fill="#10b981" font-weight="700">冲突 → 软隔离缓解</text>
  <text x="595" y="340" text-anchor="middle" font-size="11" fill="#64748b">各任务选不同专家</text>
  <text x="595" y="358" text-anchor="middle" font-size="11" fill="#64748b">梯度部分隔离</text>
</svg>
