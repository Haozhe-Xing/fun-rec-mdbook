<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="300" fill="#f8f9fc" rx="12"/>
  <text x="400" y="34" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">漏斗架构：亿级物品经召回缩到数百，再经排序缩到数十</text>

  <rect x="250" y="72" width="300" height="50" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#sh)"/>
  <text x="400" y="102" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1e293b">全量物品库 (~千万)</text>

  <line x1="400" y1="122" x2="400" y2="148" stroke="#4A6CF7" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="280" y="150" width="240" height="50" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#sh)"/>
  <text x="400" y="180" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#10b981">召回 (轻模型) Top-100</text>

  <line x1="400" y1="200" x2="400" y2="226" stroke="#4A6CF7" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="310" y="228" width="180" height="50" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#sh)"/>
  <text x="400" y="258" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#4A6CF7">排序 (重模型) Top-20</text>
</svg>
