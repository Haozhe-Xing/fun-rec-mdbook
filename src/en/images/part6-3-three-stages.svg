<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" font-family="Arial, sans-serif">
  <defs>
    <marker id="at" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/></marker>
    <filter id="st" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="800" height="300" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">The Three-Stage LLM Post-Training Pipeline</text>

  <g text-anchor="middle">
    <rect x="40" y="90" width="210" height="130" rx="10" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#st)"/>
    <text x="145" y="125" font-size="15" font-weight="700" fill="#4A6CF7">Step 1 · SFT</text>
    <text x="145" y="150" font-size="12" fill="#64748b">Supervised fine-tuning</text>
    <text x="145" y="172" font-size="12" fill="#64748b">Human demonstrations</text>
    <text x="145" y="194" font-size="12" fill="#64748b">Learns to follow instructions</text>

    <rect x="295" y="90" width="210" height="130" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#st)"/>
    <text x="400" y="125" font-size="15" font-weight="700" fill="#f59e0b">Step 2 · RM</text>
    <text x="400" y="150" font-size="12" fill="#64748b">Reward model</text>
    <text x="400" y="172" font-size="12" fill="#64748b">Human preference ranking</text>
    <text x="400" y="194" font-size="12" fill="#64748b">Scores quality automatically</text>

    <rect x="550" y="90" width="210" height="130" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#st)"/>
    <text x="655" y="125" font-size="15" font-weight="700" fill="#10b981">Step 3 · PPO</text>
    <text x="655" y="150" font-size="12" fill="#64748b">Policy optimization</text>
    <text x="655" y="172" font-size="12" fill="#64748b">RL + KL constraint</text>
    <text x="655" y="194" font-size="12" fill="#64748b">Aligns with human intent</text>
  </g>
  <line x1="250" y1="155" x2="291" y2="155" stroke="#4A6CF7" stroke-width="2" marker-end="url(#at)"/>
  <line x1="505" y1="155" x2="546" y2="155" stroke="#4A6CF7" stroke-width="2" marker-end="url(#at)"/>

  <text x="400" y="265" text-anchor="middle" font-size="11" fill="#64748b">Pre-training (CLM) builds the base → three post-training steps turn a text continuer into a reliable assistant</text>
</svg>
