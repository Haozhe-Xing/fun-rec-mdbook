<svg width="800" height="380" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a85" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <filter id="s85" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="380" fill="#f8f9fc" rx="12"/>
  <text x="400" y="32" text-anchor="middle" font-family="Arial" font-size="16.5" font-weight="bold" fill="#1e293b">KHQE：商品分层语义 ID（3 层 RQ + 2 层 OPQ）</text>

  <!-- input -->
  <rect x="30" y="60" width="180" height="120" rx="10" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#s85)"/>
  <text x="120" y="84" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#4A6CF7">商品表示</text>
  <text x="120" y="108" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#1e293b">文本/OCR/属性</text>
  <text x="120" y="126" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#1e293b">统计特征</text>
  <text x="120" y="148" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#64748b">蒸馏 BGE</text>
  <text x="120" y="166" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#10b981">+ NER 关键词增强</text>

  <line x1="210" y1="120" x2="258" y2="120" stroke="#64748b" stroke-width="2.5" marker-end="url(#a85)"/>

  <!-- 3 RQ layers -->
  <rect x="263" y="56" width="180" height="128" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#s85)"/>
  <text x="353" y="80" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#d97706">3 层 RQ-Kmeans</text>
  <text x="353" y="104" text-anchor="middle" font-family="Courier New" font-size="11.5" fill="#1e293b">L1=4096 服装</text>
  <text x="353" y="124" text-anchor="middle" font-family="Courier New" font-size="11.5" fill="#1e293b">L2=1024 女装</text>
  <text x="353" y="144" text-anchor="middle" font-family="Courier New" font-size="11.5" fill="#1e293b">L3=512 连衣裙</text>
  <text x="353" y="168" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">仅 L3 平衡约束</text>

  <line x1="443" y1="120" x2="491" y2="120" stroke="#64748b" stroke-width="2.5" marker-end="url(#a85)"/>

  <!-- 2 OPQ -->
  <rect x="496" y="56" width="180" height="128" rx="10" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#s85)"/>
  <text x="586" y="80" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#4A6CF7">2 层 OPQ</text>
  <text x="586" y="104" text-anchor="middle" font-family="Courier New" font-size="11.5" fill="#1e293b">残差切 M=2 子向量</text>
  <text x="586" y="124" text-anchor="middle" font-family="Courier New" font-size="11.5" fill="#1e293b">OPQ1=256 品牌</text>
  <text x="586" y="144" text-anchor="middle" font-family="Courier New" font-size="11.5" fill="#1e293b">OPQ2=256 价格</text>
  <text x="586" y="168" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">编码商品独特性</text>

  <line x1="676" y1="120" x2="724" y2="120" stroke="#64748b" stroke-width="2.5" marker-end="url(#a85)"/>

  <!-- output SID -->
  <rect x="729" y="56" width="50" height="128" rx="10" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#s85)"/>
  <text x="754" y="92" text-anchor="middle" font-family="Courier New" font-size="11" fill="#1e293b">[</text>
  <text x="754" y="110" text-anchor="middle" font-family="Courier New" font-size="11" fill="#1e293b">3</text>
  <text x="754" y="128" text-anchor="middle" font-family="Courier New" font-size="11" fill="#1e293b">8</text>
  <text x="754" y="146" text-anchor="middle" font-family="Courier New" font-size="11" fill="#1e293b">5</text>
  <text x="754" y="170" text-anchor="middle" font-family="Courier New" font-size="11" fill="#1e293b">6</text>
  <text x="754" y="186" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">]</text>

  <!-- example + bottom -->
  <rect x="60" y="220" width="680" height="130" rx="10" fill="#fef9ec" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="248" text-anchor="middle" font-family="Arial" font-size="13" fill="#92400e">例：韩版连衣裙 → SID = [2341, 567, 89, 142, 201]</text>
  <text x="400" y="278" text-anchor="middle" font-family="Arial" font-size="12.5" fill="#1e293b">前 3 层（RQ）表达「服装→女装→连衣裙」的语义层次</text>
  <text x="400" y="302" text-anchor="middle" font-family="Arial" font-size="12.5" fill="#1e293b">后 2 层（OPQ）区分「Zara 299 元」与「无牌 99 元」的独特属性</text>
  <text x="400" y="330" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">总词表 ≈ 6000 唯一 Token（远小于数亿原子 ID）→ Softmax 可行 · 搜「红裙」不返「蓝裙」</text>
</svg>
