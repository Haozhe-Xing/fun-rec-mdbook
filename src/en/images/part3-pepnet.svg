<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="s20" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.15"/>
    </filter>
    <marker id="a20" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="420" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">PEPNet: EPNet Modulates Embeddings, PPNet Modulates Task-Tower Params</text>

  <!-- shared embedding -->
  <rect x="320" y="58" width="160" height="40" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#s20)"/>
  <text x="400" y="84" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="600">Shared Embedding E</text>
  <line x1="400" y1="98" x2="400" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a20)"/>

  <!-- EPNet -->
  <rect x="60" y="134" width="330" height="110" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#s20)"/>
  <rect x="60" y="134" width="330" height="32" rx="8" fill="#4A6CF7"/>
  <text x="225" y="156" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">EPNet (scenario-level, modulates Embedding)</text>
  <text x="80" y="196" font-size="11.5" fill="#1e293b">δ_domain = U_ep(E(F_d) ⊕ ∅(E))</text>
  <text x="80" y="220" font-size="11.5" fill="#1e293b">O_ep = δ_domain ⊗ E</text>
  <text x="80" y="242" font-size="10" fill="#64748b">Gate NU builds gates from scenario priors</text>

  <line x1="400" y1="98" x2="300" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#a20)"/>
  <line x1="225" y1="244" x2="225" y2="280" stroke="#64748b" stroke-width="2" marker-end="url(#a20)"/>

  <!-- PPNet -->
  <rect x="410" y="134" width="330" height="110" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#s20)"/>
  <rect x="410" y="134" width="330" height="32" rx="8" fill="#10b981"/>
  <text x="575" y="156" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">PPNet (sample-level, modulates Task Towers)</text>
  <text x="430" y="196" font-size="11.5" fill="#1e293b">δ_task = U_pp(O_prior ⊕ ∅(O_ep))</text>
  <text x="430" y="220" font-size="11.5" fill="#1e293b">O⁽ˡ⁾ = δ⁽ˡ⁾ ⊗ H⁽ˡ⁾</text>
  <text x="430" y="242" font-size="10" fill="#64748b">Layer-wise modulation of each Task Tower DNN</text>

  <!-- task towers -->
  <rect x="410" y="290" width="330" height="100" rx="8" fill="#e6f7f1" stroke="#10b981" stroke-width="2"/>
  <text x="575" y="316" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="700">Task Tower DNN (Shared Bottom + dynamic modulation)</text>
  <rect x="440" y="330" width="120" height="40" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="500" y="355" text-anchor="middle" font-size="12" fill="#1e293b">Tower 1 CTR</text>
  <rect x="590" y="330" width="120" height="40" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="650" y="355" text-anchor="middle" font-size="12" fill="#1e293b">Tower 2 CVR</text>

  <line x1="225" y1="280" x2="500" y2="328" stroke="#64748b" stroke-width="2" marker-end="url(#a20)"/>
  <line x1="575" y1="244" x2="575" y2="288" stroke="#64748b" stroke-width="2" marker-end="url(#a20)"/>

  <text x="400" y="410" text-anchor="middle" font-size="10.5" fill="#64748b">Shared bottom params + Gate NU dynamic modulation: two-level personalization by scenario (EPNet) and sample (PPNet)</text>
</svg>
