<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="sh7"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="800" height="360" fill="#f8f9fc"/>
  <text x="400" y="34" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">Action-Oriented 的 Mask 设计</text>

  <!-- Mask matrix -->
  <rect x="60" y="60" width="280" height="280" rx="10" fill="#ffffff" stroke="#e8ecff" filter="url(#sh7)"/>
  <text x="200" y="80" font-size="12" fill="#64748b" text-anchor="middle">Attention Mask</text>
  <!-- rows/cols labels -->
  <g font-size="10" fill="#64748b" text-anchor="middle">
    <text x="90" y="105">h1</text><text x="120" y="105">h2</text><text x="150" y="105">h3</text><text x="180" y="105">c1</text><text x="210" y="105">c2</text><text x="240" y="105">c3</text><text x="270" y="105">c4</text>
    <text x="78" y="130">h1</text><text x="78" y="160">h2</text><text x="78" y="190">h3</text><text x="78" y="220">c1</text><text x="78" y="250">c2</text><text x="78" y="280">c3</text><text x="78" y="310">c4</text>
  </g>
  <!-- visible (white) lower triangle for history, history visible to candidates, candidate diagonal -->
  <g>
    <!-- history causal lower triangle -->
    <rect x="85" y="115" width="25" height="25" fill="#10b981"/>
    <rect x="115" y="145" width="25" height="25" fill="#10b981"/>
    <rect x="145" y="145" width="25" height="25" fill="#10b981"/>
    <rect x="115" y="175" width="25" height="25" fill="#10b981"/>
    <rect x="145" y="175" width="25" height="25" fill="#10b981"/>
    <rect x="175" y="175" width="25" height="25" fill="#10b981"/>
    <!-- history fully visible to candidates -->
    <rect x="85" y="205" width="25" height="25" fill="#10b981"/>
    <rect x="115" y="205" width="25" height="25" fill="#10b981"/>
    <rect x="145" y="205" width="25" height="25" fill="#10b981"/>
    <rect x="85" y="235" width="25" height="25" fill="#10b981"/>
    <rect x="115" y="235" width="25" height="25" fill="#10b981"/>
    <rect x="145" y="235" width="25" height="25" fill="#10b981"/>
    <rect x="85" y="265" width="25" height="25" fill="#10b981"/>
    <rect x="115" y="265" width="25" height="25" fill="#10b981"/>
    <rect x="145" y="265" width="25" height="25" fill="#10b981"/>
    <rect x="85" y="295" width="25" height="25" fill="#10b981"/>
    <rect x="115" y="295" width="25" height="25" fill="#10b981"/>
    <rect x="145" y="295" width="25" height="25" fill="#10b981"/>
    <!-- candidate diagonal -->
    <rect x="175" y="205" width="25" height="25" fill="#10b981"/>
    <rect x="205" y="235" width="25" height="25" fill="#10b981"/>
    <rect x="235" y="265" width="25" height="25" fill="#10b981"/>
    <rect x="265" y="295" width="25" height="25" fill="#10b981"/>
  </g>

  <!-- Legend / explanation -->
  <rect x="370" y="60" width="370" height="280" rx="12" fill="#ffffff" stroke="#e8ecff" filter="url(#sh7)"/>
  <text x="555" y="92" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">三条规则</text>
  <g font-size="12" fill="#1e293b">
    <rect x="390" y="110" width="14" height="14" rx="3" fill="#10b981"/>
    <text x="414" y="122" font-size="12.5">历史 token 间：causal mask（下三角）</text>
    <rect x="390" y="160" width="14" height="14" rx="3" fill="#10b981"/>
    <text x="414" y="172" font-size="12.5">候选可 attend 全部历史（绿色列）</text>
    <rect x="390" y="210" width="14" height="14" rx="3" fill="#10b981"/>
    <text x="414" y="222" font-size="12.5">候选间相互屏蔽（仅对角线可见）</text>
    <rect x="390" y="260" width="14" height="14" rx="3" fill="#ef4444"/>
    <text x="414" y="272" font-size="12.5">灰色 = 不可见（防候选互相泄露）</text>
  </g>
  <text x="555" y="320" font-size="11.5" fill="#64748b" text-anchor="middle">既保证评分独立，又为 sequential re-ranking 留空间</text>
</svg>
