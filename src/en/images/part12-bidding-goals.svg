<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">出价目标谱系：从浅层到深层，逐级加深</text>
  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#64748b">左半 = 开环也能做的浅层目标；右半 = 只有闭环（平台可见后链路转化）才能做的深层目标</text>

  <!-- 区域标签 -->
  <text x="212" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4A6CF7">浅层目标 · 开环可做</text>
  <text x="580" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#10b981">深层目标 · 闭环才能做</text>

  <!-- 分界线 -->
  <line x1="395" y1="96" x2="395" y2="320" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="408" y="150" font-size="11.5" font-weight="700" fill="#ef4444">闭环才能做的</text>
  <text x="408" y="168" font-size="11.5" font-weight="700" fill="#ef4444">深度目标分界线</text>

  <!-- 台阶：x = 36 + i*90, 顶 y = 280 - i*24, 底 320 -->
  <!-- 浅层（蓝） -->
  <g filter="url(#sh)">
    <rect x="36"  y="280" width="88" height="40"  rx="6" fill="#4A6CF7"/>
    <rect x="126" y="256" width="88" height="64"  rx="6" fill="#4A6CF7"/>
    <rect x="216" y="232" width="88" height="88"  rx="6" fill="#4A6CF7"/>
    <rect x="306" y="208" width="88" height="112" rx="6" fill="#4A6CF7"/>
    <!-- 深层（绿） -->
    <rect x="396" y="184" width="88" height="136" rx="6" fill="#10b981"/>
    <rect x="486" y="160" width="88" height="160" rx="6" fill="#10b981"/>
    <rect x="576" y="136" width="88" height="184" rx="6" fill="#10b981"/>
    <rect x="666" y="112" width="88" height="208" rx="6" fill="#10b981"/>
  </g>

  <!-- 台阶文字 -->
  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="80"  y="300">曝光</text>
    <text x="170" y="276">点击</text>
    <text x="260" y="252">激活</text>
    <text x="350" y="228">表单</text>
    <text x="440" y="204">付费</text>
    <text x="530" y="180">ROI</text>
    <text x="620" y="156">次留</text>
    <text x="710" y="132" font-size="12">7日ROI</text>
  </g>

  <!-- 优化深度箭头 -->
  <line x1="40" y1="344" x2="750" y2="344" stroke="#10b981" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="400" y="362" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="700">优化深度递增：离「钱」越近的目标，越需要平台看得见后链路转化</text>
</svg>
