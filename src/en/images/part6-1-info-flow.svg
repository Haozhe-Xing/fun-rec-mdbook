<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" font-family="Arial, sans-serif">
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/></marker>
    <marker id="a3g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/></marker>
    <filter id="s3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="800" height="340" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Information Flow: Two Paradigms Compared</text>

  <!-- left: discriminative feed-forward -->
  <text x="200" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#4A6CF7">Discriminative · Feed-Forward</text>
  <rect x="60" y="90" width="90" height="48" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#s3)"/>
  <text x="105" y="119" text-anchor="middle" font-size="12" fill="#1e293b">Input</text>
  <rect x="60" y="160" width="90" height="48" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#s3)"/>
  <text x="105" y="189" text-anchor="middle" font-size="12" fill="#1e293b">Hidden</text>
  <rect x="60" y="230" width="90" height="48" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#s3)"/>
  <text x="105" y="259" text-anchor="middle" font-size="12" fill="#1e293b">Output</text>
  <line x1="105" y1="138" x2="105" y2="158" stroke="#4A6CF7" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="105" y1="208" x2="105" y2="228" stroke="#4A6CF7" stroke-width="2" marker-end="url(#a3)"/>
  <!-- independent scores -->
  <g font-size="12" fill="#64748b">
    <text x="200" y="115" text-anchor="middle">Cand. i₁ → 0.7</text>
    <text x="200" y="180" text-anchor="middle">Cand. i₂ → 0.3</text>
    <text x="200" y="245" text-anchor="middle">Cand. i₃ → 0.9</text>
  </g>
  <text x="150" y="300" text-anchor="middle" font-size="11" fill="#64748b">Each candidate scored independently</text>

  <!-- right: generative autoregressive -->
  <text x="600" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#10b981">Generative · Autoregressive</text>
  <g font-size="13" fill="#1e293b" text-anchor="middle">
    <rect x="540" y="95" width="56" height="44" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#s3)"/><text x="568" y="122">i₁</text>
    <rect x="600" y="95" width="56" height="44" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#s3)"/><text x="628" y="122">i₂</text>
    <rect x="660" y="95" width="56" height="44" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#s3)"/><text x="688" y="122">i₃</text>
  </g>
  <path d="M568,139 C568,200 628,180 628,141" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#a3g)"/>
  <path d="M628,139 C628,200 688,180 688,141" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#a3g)"/>
  <text x="600" y="200" text-anchor="middle" font-size="11" fill="#10b981">Information flows back over time</text>
  <text x="600" y="230" text-anchor="middle" font-size="12" fill="#64748b">iₜ depends on i₍ₜ₎</text>
  <text x="600" y="300" text-anchor="middle" font-size="11" fill="#64748b">In-sequence dependency captured naturally</text>
</svg>
