<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a88" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <filter id="s88" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="400" fill="#f8f9fc" rx="12"/>
  <text x="400" y="32" text-anchor="middle" font-family="Arial" font-size="16.5" font-weight="bold" fill="#1e293b">GPR：异构层次化解码器（HHD）「先理解·再推理·后生成」</text>

  <!-- four token input -->
  <rect x="30" y="56" width="200" height="140" rx="10" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#s88)"/>
  <text x="130" y="80" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#4A6CF7">四类 Token 输入</text>
  <text x="50" y="104" font-family="Arial" font-size="11.5" fill="#1e293b">U 用户 / O 有机</text>
  <text x="50" y="122" font-family="Arial" font-size="11.5" fill="#1e293b">E 环境 / I 广告</text>
  <text x="50" y="144" font-family="Arial" font-size="11" fill="#64748b">统一表示破数据孤岛</text>
  <text x="50" y="168" font-family="Arial" font-size="11" fill="#64748b">RQ-Kmeans+ 量化</text>
  <text x="50" y="186" font-family="Arial" font-size="11" fill="#10b981">码本利用率 65%→92%</text>

  <line x1="230" y1="126" x2="278" y2="126" stroke="#64748b" stroke-width="2.5" marker-end="url(#a88)"/>

  <!-- HSD -->
  <rect x="283" y="56" width="240" height="140" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#s88)"/>
  <text x="403" y="80" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#d97706">① HSD 意图理解</text>
  <text x="403" y="104" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">Hybrid Mask：Prompt 双向</text>
  <text x="403" y="122" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">Target 因果 · 看 Prompt</text>
  <text x="403" y="142" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">Token-Aware Norm + MoR</text>
  <text x="403" y="166" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">输出 意图嵌入 S^e</text>
  <text x="403" y="186" text-anchor="middle" font-family="Arial" font-size="11" fill="#10b981">异构分布独立归一化</text>

  <line x1="523" y1="126" x2="571" y2="126" stroke="#64748b" stroke-width="2.5" marker-end="url(#a88)"/>

  <!-- PTD -->
  <rect x="576" y="56" width="194" height="140" rx="10" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#s88)"/>
  <text x="673" y="80" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#4A6CF7">② PTD 推理生成</text>
  <text x="673" y="104" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">Thinking K=4 Token</text>
  <text x="673" y="122" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">Refining 扩散去噪</text>
  <text x="673" y="142" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">Generation 自回归</text>
  <text x="673" y="166" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">三段式抽关键→精→生成</text>
  <text x="673" y="186" text-anchor="middle" font-family="Arial" font-size="11" fill="#10b981">复杂用户 +2~3%</text>

  <!-- HTE -->
  <rect x="283" y="220" width="487" height="120" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2" filter="url(#s88)"/>
  <text x="303" y="246" font-family="Arial" font-size="13.5" font-weight="bold" fill="#ef4444">③ HTE 价值评估（逐层 Token 即输出价值）</text>
  <text x="303" y="272" font-family="Arial" font-size="12" fill="#1e293b">v^l = MLP_value([h^(l); Embed(a^l)])  →  final = w₁pCTR+w₂pCVR+w₃eCPM</text>
  <text x="303" y="298" font-family="Arial" font-size="12" fill="#1e293b">用途一：Beam Search 剪枝（低价值分支早终止）</text>
  <text x="303" y="322" font-family="Arial" font-size="12" fill="#1e293b">用途二：Policy Optimization 的 Critic（估计优势 Advantage）</text>
  <text x="303" y="344" font-family="Arial" font-size="11.5" fill="#64748b">价值引导 Trie Beam Search：约束过滤 + 动态束宽 → 延迟 150→80ms，有效候选 40%→95%</text>
</svg>
