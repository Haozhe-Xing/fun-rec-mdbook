<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="480" rx="8" fill="#f8f9fc"/>
  <text x="400" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">Valuable Data Sources: The Value Ladder of Behavioral Data</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#64748b">The other five source classes: user identifiers (identity is the 1 in front of 0s) · demographics · geo-location · social relationships · device information</text>

  <!-- Left arrow: value up -->
  <line x1="210" y1="340" x2="210" y2="100" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="192" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#ef4444" transform="rotate(-90 192 225)">Value (for performance ads)</text>

  <!-- Right arrow: volume down -->
  <line x1="590" y1="100" x2="590" y2="340" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="608" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A6CF7" transform="rotate(90 608 225)">Data volume</text>

  <!-- Pyramid: top = decision -->
  <g filter="url(#shadow)">
    <polygon points="360,88 440,88 468,146 332,146" fill="#ef4444"/>
    <text x="400" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Decision behaviors</text>
    <text x="400" y="132" text-anchor="middle" font-size="12" fill="#ffffff">Conversion · pre-conversion (on the advertiser's site)</text>
  </g>
  <g filter="url(#shadow)">
    <polygon points="336,154 464,154 486,212 314,212" fill="#f59e0b"/>
    <text x="400" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Active behaviors</text>
    <text x="400" y="198" text-anchor="middle" font-size="12" fill="#ffffff">Ad clicks · searches · search clicks</text>
  </g>
  <g filter="url(#shadow)">
    <polygon points="318,220 482,220 500,278 300,278" fill="#4A6CF7"/>
    <text x="400" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Semi-active behaviors</text>
    <text x="400" y="264" text-anchor="middle" font-size="12" fill="#ffffff">Shares · page views</text>
  </g>
  <g filter="url(#shadow)">
    <polygon points="304,286 496,286 510,344 290,344" fill="#64748b"/>
    <text x="400" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Passive behaviors</text>
    <text x="400" y="330" text-anchor="middle" font-size="12" fill="#ffffff">Ad views (frequency negatively correlated with clicks, still usable for modeling)</text>
  </g>

  <!-- Bottom rules box -->
  <rect x="130" y="372" width="540" height="76" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">The two rules for judging data value</text>
  <text x="400" y="416" text-anchor="middle" font-size="12" fill="#1e293b">(1) The stronger the user's active intent, the higher the behavioral data's value (2) The closer a behavior is to conversion, the more precise its guidance for performance ads</text>
  <text x="400" y="438" text-anchor="middle" font-size="12" fill="#64748b">Reminder: people close to conversion are no longer "potential users" — balance ROI and coverage by the advertiser's reach goal</text>
</svg>
