<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="500" rx="8" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">广告位轮替售卖：随机起始序号如何保证流量均匀</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#64748b">同一广告位的连续访问被标上循环轮播序号 {1, 2, 3, 4}，每个序号当作一个虚拟广告位售卖</text>

  <!-- Visit sequence: fixed start -->
  <text x="60" y="98" font-size="13" font-weight="bold" fill="#1e293b">访问序列（固定从 1 号起始，共 7 次访问）</text>
  <g filter="url(#shadow)">
    <rect x="52" y="112" width="696" height="62" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <circle cx="120" cy="143" r="17" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/><text x="120" y="148" fill="#4A6CF7">1</text>
    <circle cx="220" cy="143" r="17" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="220" y="148" fill="#10b981">2</text>
    <circle cx="320" cy="143" r="17" fill="#fef9ec" stroke="#f59e0b" stroke-width="2"/><text x="320" y="148" fill="#d97706">3</text>
    <circle cx="420" cy="143" r="17" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="420" y="148" fill="#ef4444">4</text>
    <circle cx="520" cy="143" r="17" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/><text x="520" y="148" fill="#4A6CF7">1</text>
    <circle cx="620" cy="143" r="17" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="620" y="148" fill="#10b981">2</text>
    <circle cx="708" cy="143" r="17" fill="#fef9ec" stroke="#f59e0b" stroke-width="2"/><text x="708" y="148" fill="#d97706">3</text>
  </g>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="120" y="192">访问 1</text><text x="220" y="192">访问 2</text><text x="320" y="192">访问 3</text>
    <text x="420" y="192">访问 4</text><text x="520" y="192">访问 5</text><text x="620" y="192">访问 6</text>
    <text x="708" y="192">访问 7</text>
  </g>

  <!-- Fixed start result bars -->
  <text x="60" y="228" font-size="13" font-weight="bold" fill="#ef4444">固定起始的分配结果：流量不均，序号 4 少拿一次展示</text>
  <g>
    <rect x="150" y="268" width="70" height="50" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
    <rect x="310" y="268" width="70" height="50" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
    <rect x="470" y="268" width="70" height="50" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
    <rect x="630" y="288" width="70" height="30" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="185" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">2 次</text>
    <text x="345" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">2 次</text>
    <text x="505" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">2 次</text>
    <text x="665" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#ef4444">1 次</text>
    <line x1="130" y1="318" x2="740" y2="318" stroke="#1e293b" stroke-width="2"/>
    <g font-size="12" fill="#64748b" text-anchor="middle">
      <text x="185" y="336">轮播序号 1</text><text x="345" y="336">轮播序号 2</text>
      <text x="505" y="336">轮播序号 3</text><text x="665" y="336">轮播序号 4</text>
    </g>
  </g>

  <!-- Random start result bars -->
  <text x="60" y="372" font-size="13" font-weight="bold" fill="#10b981">随机起始的分配结果：起始序号按相等概率选取，期望各 7/4 = 1.75 次</text>
  <g>
    <rect x="150" y="410" width="70" height="52" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <rect x="310" y="410" width="70" height="52" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <rect x="470" y="410" width="70" height="52" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <rect x="630" y="410" width="70" height="52" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="185" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#10b981">1.75</text>
    <text x="345" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#10b981">1.75</text>
    <text x="505" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#10b981">1.75</text>
    <text x="665" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#10b981">1.75</text>
    <line x1="130" y1="462" x2="740" y2="462" stroke="#1e293b" stroke-width="2"/>
    <text x="400" y="486" text-anchor="middle" font-size="12" fill="#64748b">第一次展示的序号从所有轮播序号中等概率随机选取，再从此累加循环——这是中国门户品牌广告广泛采用的售卖方式</text>
  </g>
</svg>
