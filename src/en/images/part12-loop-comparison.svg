<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#10b981"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">开环 vs 闭环：转化发生在平台可观测域内还是域外</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#64748b">左 = 闭环（内循环）：曝光→点击→下单→支付全在平台内；右 = 开环（外循环）：转化跳出平台，需回传</text>

  <!-- ═══════════ 左半：闭环 ═══════════ -->
  <rect x="40" y="76" width="340" height="214" rx="8" fill="#f8f9fc" stroke="#4A6CF7" stroke-width="2" filter="url(#sh)"/>
  <text x="210" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#4A6CF7">平台域 · 抖音小店（闭环）</text>

  <!-- 四个节点 -->
  <g font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">
    <rect x="56"  y="130" width="60" height="44" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2"/>
    <text x="86"  y="157">曝光</text>
    <rect x="136" y="130" width="60" height="44" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2"/>
    <text x="166" y="157">点击</text>
    <rect x="216" y="130" width="60" height="44" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2"/>
    <text x="246" y="157">下单</text>
    <rect x="296" y="130" width="60" height="44" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2"/>
    <text x="326" y="157">支付</text>
  </g>
  <line x1="116" y1="152" x2="134" y2="152" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="196" y1="152" x2="214" y2="152" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="276" y1="152" x2="294" y2="152" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- 数据回流 -->
  <line x1="326" y1="174" x2="326" y2="203" stroke="#10b981" stroke-width="2" marker-end="url(#arrG)"/>
  <rect x="120" y="205" width="180" height="56" rx="8" fill="#e8ecff" stroke="#10b981" stroke-width="2"/>
  <text x="210" y="227" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">pCVR 直接训练</text>
  <text x="210" y="247" text-anchor="middle" font-size="11.5" fill="#64748b">深度转化出价可行</text>
  <text x="336" y="188" font-size="11" fill="#10b981" font-weight="700">转化数据即时回流</text>

  <!-- ═══════════ 右半：开环 ═══════════ -->
  <rect x="420" y="76" width="340" height="130" rx="8" fill="#f8f9fc" stroke="#4A6CF7" stroke-width="2" filter="url(#sh)"/>
  <text x="590" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#4A6CF7">平台域 · App 内（开环）</text>

  <rect x="436" y="120" width="70" height="44" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="471" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">曝光</text>
  <rect x="566" y="120" width="70" height="44" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="601" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">点击</text>
  <line x1="506" y1="142" x2="564" y2="142" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- 转化跳出平台 -->
  <line x1="601" y1="164" x2="601" y2="223" stroke="#ef4444" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="611" y="195" font-size="11" fill="#ef4444" font-weight="700">转化跳出平台</text>
  <rect x="480" y="225" width="180" height="54" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="570" y="247" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ef4444">转化（域外）</text>
  <text x="570" y="266" text-anchor="middle" font-size="11" fill="#64748b">App Store / 官网 / 线下门店</text>

  <!-- 回传虚线断裂 -->
  <line x1="480" y1="252" x2="452" y2="252" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="452" y1="252" x2="452" y2="206" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <text x="436" y="238" text-anchor="end" font-size="11" fill="#ef4444" font-weight="700">转化数据需回传</text>
  <text x="436" y="268" text-anchor="end" font-size="10.5" fill="#64748b">（依赖广告主，易断裂）</text>
  <text x="601" y="310" text-anchor="middle" font-size="11" fill="#64748b">只能浅层目标：点击 / 激活 / 表单</text>

  <!-- footer -->
  <rect x="60" y="318" width="680" height="18" rx="8" fill="#f8f9fc" stroke="#e8ecff" stroke-width="1"/>
  <text x="400" y="331" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">关键不是广告形式，而是数据链路是否闭合 —— 左：平台直接看见转化；右：平台靠回传才知道转化</text>
</svg>
