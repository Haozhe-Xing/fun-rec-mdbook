<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <filter id="shG" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="320" fill="#f8f9fc" rx="12"/>

  <text x="400" y="34" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#1e293b">IPS (Inverse Propensity Scoring): Re-weight by 1 / Observation Probability</text>

  <!-- Left: naive -->
  <rect x="40" y="70" width="330" height="200" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2" filter="url(#shG)"/>
  <text x="205" y="98" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#ef4444">Naive Statistics (Biased)</text>
  <text x="205" y="128" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">Horror fan × Romance, P=0.1 → low rating</text>
  <text x="205" y="150" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">Few observed samples, ignored</text>
  <text x="205" y="180" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">Horror fan × Horror, P=0.8 → high rating</text>
  <text x="205" y="202" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">Plenty of samples, dominates the stats</text>
  <text x="205" y="240" text-anchor="middle" font-family="Courier New" font-size="12" font-weight="bold" fill="#ef4444">→ Overstates the taste gap</text>

  <!-- Right: IPS -->
  <rect x="430" y="70" width="330" height="200" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shG)"/>
  <text x="595" y="98" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#10b981">IPS Weighting (Unbiased)</text>
  <text x="595" y="128" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">Rare low rating: weight = 1/0.1 = 10×</text>
  <text x="595" y="150" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">Hard-won signal is amplified</text>
  <text x="595" y="180" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">Common high rating: weight = 1/0.8 = 1.25×</text>
  <text x="595" y="202" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">Easy samples contribute less</text>
  <text x="595" y="240" text-anchor="middle" font-family="Courier New" font-size="12" font-weight="bold" fill="#10b981">→ Recovers true preferences</text>

  <!-- arrow between -->
  <line x1="370" y1="170" x2="428" y2="170" stroke="#1e293b" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="399" y="160" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Inverse</text>
  <text x="399" y="190" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">weight</text>

  <rect x="0" y="280" width="800" height="40" fill="#1e293b" rx="0 0 12 12"/>
  <text x="400" y="304" text-anchor="middle" font-family="Courier New" font-size="13" fill="#94a3b8">w(u,i) = 1 / P(O_u,i=1)   ← low propensity gets high weight</text>
</svg>
