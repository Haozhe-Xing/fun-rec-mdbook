<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="480" rx="8" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">The Ad Retrieval Funnel: From Hundreds of Millions of Candidates to One Impression</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#64748b">Every layer trades between "shrinking candidates" and "raising scoring precision", and all stages must fit within a millisecond-level budget</text>

  <!-- Funnel layers (left) -->
  <!-- L1 full corpus -->
  <polygon points="50,90 510,90 480,142 80,142" fill="#64748b" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Full ad candidates ~10⁸</text>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#e2e8f0">Targeting conditions indexed as DNF boolean expressions</text>

  <!-- L2 recall -->
  <polygon points="80,158 480,158 440,210 120,210" fill="#4A6CF7" stroke="#3b55c4" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Recall: 10⁴ ~ 10⁵</text>
  <text x="280" y="200" text-anchor="middle" font-size="12" fill="#dbe4ff">Boolean inverted index + semantic vector ANN, multi-channel fusion</text>

  <!-- L3 pre-rank -->
  <polygon points="120,226 440,226 400,278 160,278" fill="#10b981" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Pre-rank: 10² ~ 10³</text>
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#d1fae5">Lightweight models score fast; the Top-K pruning idea carries on</text>

  <!-- L4 rank -->
  <polygon points="160,294 400,294 360,346 200,346" fill="#f59e0b" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Fine-rank: 10¹ ~ 10²</text>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#fef3c7">Full CTR model scores each candidate (calibration in 12.5)</text>

  <!-- L5 auction -->
  <polygon points="200,362 360,362 330,414 230,414" fill="#ef4444" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Auction &amp; Pricing</text>
  <text x="280" y="404" text-anchor="middle" font-size="12" fill="#fee2e2">eCPM ranking → GSP pricing → 1~3 impressions</text>

  <!-- Right annotations -->
  <g font-size="12" fill="#1e293b">
    <text x="540" y="112">Hundreds of millions of ads, each carrying boolean targeting conditions.</text>
    <text x="540" y="130" fill="#64748b">Retrieval goal: find the few "eligible for this auction"</text>

    <text x="540" y="180" font-weight="bold" fill="#4A6CF7">Recall layer (this chapter's protagonist)</text>
    <text x="540" y="198">Boolean inverted index: Conjunction index + size-tier pruning</text>
    <text x="540" y="214">Semantic recall: two-tower vectors + ANN (HNSW / IVF-PQ)</text>

    <text x="540" y="248" font-weight="bold" fill="#059669">Pre-rank layer</text>
    <text x="540" y="266">The WAND-style "upper bound + heap threshold" idea continues here</text>

    <text x="540" y="316" font-weight="bold" fill="#d97706">Fine-rank layer</text>
    <text x="540" y="334">pCTR precision is revenue (bias and calibration in 12.5)</text>

    <text x="540" y="384" font-weight="bold" fill="#dc2626">Auction layer</text>
    <text x="540" y="402">eCPM ranking (12.2) · GSP (12.3) · bidding (12.4)</text>
  </g>

  <!-- Bottom note -->
  <rect x="50" y="432" width="700" height="34" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="400" y="454" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Retrieval quality sets the monetization ceiling; retrieval speed sets system feasibility — the two must coexist within the same millisecond budget</text>
</svg>
