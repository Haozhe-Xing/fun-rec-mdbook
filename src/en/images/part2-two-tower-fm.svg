<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="320" fill="#f8f9fc" rx="12"/>

  <text x="400" y="34" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">FM 二阶交互重组为双塔内积</text>

  <!-- raw FM interaction (O(kn^2)) -->
  <rect x="40" y="70" width="230" height="90" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="94" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e293b">原始二阶交互</text>
  <text x="155" y="116" text-anchor="middle" font-family="Courier New" font-size="11" fill="#1e293b">ΣΣ ⟨vᵢ,vⱼ⟩ xᵢxⱼ</text>
  <text x="155" y="138" text-anchor="middle" font-family="Arial" font-size="11" fill="#ef4444">复杂度 O(kn²)</text>

  <line x1="270" y1="115" x2="328" y2="115" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="299" y="108" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">平方项化简</text>

  <!-- simplified (O(kn)) -->
  <rect x="340" y="70" width="270" height="90" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="94" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e293b">化简后</text>
  <text x="475" y="116" text-anchor="middle" font-family="Courier New" font-size="10" fill="#1e293b">½Σ_f[(Σvᵢfxᵢ)² − Σvᵢf²xᵢ²]</text>
  <text x="475" y="138" text-anchor="middle" font-family="Arial" font-size="11" fill="#10b981">复杂度 O(kn)</text>

  <line x1="610" y1="115" x2="668" y2="115" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="639" y="108" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">分用户/物品</text>

  <!-- two towers -->
  <rect x="40" y="190" width="230" height="80" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="216" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1e293b">用户向量 V_user</text>
  <text x="155" y="240" text-anchor="middle" font-family="Courier New" font-size="11" fill="#64748b">[1 ; Σ vᵤxᵤ]</text>

  <rect x="530" y="190" width="230" height="80" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="645" y="216" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#065f46">物品向量 V_item</text>
  <text x="645" y="240" text-anchor="middle" font-family="Courier New" font-size="10" fill="#64748b">[线性 + FM交互 ; Σvₜxₜ]</text>

  <circle cx="400" cy="230" r="36" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="226" text-anchor="middle" font-family="Courier New" font-size="16" font-weight="bold" fill="#1e293b">⟨·⟩</text>
  <text x="400" y="246" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">内积</text>
  <line x1="270" y1="230" x2="362" y2="230" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="230" x2="438" y2="230" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="0" y="280" width="800" height="40" fill="#1e293b" rx="0 0 12 12"/>
  <text x="400" y="304" text-anchor="middle" font-family="Courier New" font-size="13" fill="#94a3b8">score_FM = V_item · V_userᵀ   →   物品可离线预计算</text>
</svg>
