<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" rx="8" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">Audience Targeting Technique Taxonomy</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#64748b">Targeting = extracting features (labels) on ad a, user u, context c · labels enter eCPM = μ(a,u,c) × bid for ranking</text>

  <!-- Column 1: t(c) -->
  <g filter="url(#shadow)">
    <rect x="40" y="90" width="225" height="250" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
    <rect x="40" y="90" width="225" height="46" rx="8" fill="#4A6CF7"/>
    <text x="152" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Contextual Labels t(c)</text>
    <text x="152" y="158" text-anchor="middle" font-size="12" fill="#64748b">Instant interest from the current visit</text>
    <text x="62" y="188" font-size="13" fill="#1e293b">· Geo targeting (request IP / GPS)</text>
    <text x="62" y="214" font-size="13" fill="#1e293b">· Channel / URL / operating system</text>
    <text x="62" y="240" font-size="13" fill="#1e293b">· Keyword targeting (TF-IDF)</text>
    <text x="62" y="266" font-size="13" fill="#1e293b">· Topic targeting (text topic mining)</text>
    <text x="62" y="292" font-size="13" fill="#1e293b">· Context behavior (referral search terms)</text>
    <text x="152" y="324" text-anchor="middle" font-size="12" fill="#4A6CF7" font-weight="bold">Technique: semi-online crawling + cache</text>
  </g>

  <!-- Column 2: t(u) -->
  <g filter="url(#shadow)">
    <rect x="288" y="90" width="225" height="250" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="288" y="90" width="225" height="46" rx="8" fill="#10b981"/>
    <text x="400" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">User Labels t(u)</text>
    <text x="400" y="158" text-anchor="middle" font-size="12" fill="#64748b">Mined from historical behavior data</text>
    <text x="310" y="188" font-size="13" fill="#1e293b">· Behavioral targeting (interest classes)</text>
    <text x="310" y="214" font-size="13" fill="#1e293b">· Demographic prediction (gender/age)</text>
    <text x="310" y="240" font-size="13" fill="#1e293b">· "where on earth" residence location</text>
    <text x="310" y="266" font-size="13" fill="#1e293b">· Behavior sources: browsing / search /</text>
    <text x="322" y="288" font-size="13" fill="#1e293b">ad clicks / purchases, etc.</text>
    <text x="400" y="324" text-anchor="middle" font-size="12" fill="#10b981" font-weight="bold">Technique: GLM modeling + score threshold</text>
  </g>

  <!-- Column 3: t(a,u) -->
  <g filter="url(#shadow)">
    <rect x="536" y="90" width="225" height="250" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <rect x="536" y="90" width="225" height="46" rx="8" fill="#f59e0b"/>
    <text x="648" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Customized Labels t(a, u)</text>
    <text x="648" y="158" text-anchor="middle" font-size="12" fill="#64748b">Produced for a specific advertiser</text>
    <text x="558" y="188" font-size="13" fill="#1e293b">· Retargeting (landing-page visitors)</text>
    <text x="558" y="214" font-size="13" fill="#1e293b">· Look-alike (new-customer acquisition)</text>
    <text x="558" y="240" font-size="13" fill="#1e293b">Label count grows with the number of</text>
    <text x="558" y="262" font-size="13" fill="#1e293b">advertisers; best supplied directly by</text>
    <text x="558" y="284" font-size="13" fill="#1e293b">the demand side in programmatic (DSP, Ch. 16)</text>
    <text x="648" y="324" text-anchor="middle" font-size="12" fill="#f59e0b" font-weight="bold">Data processing: see 12.10 (DMP)</text>
  </g>

  <!-- Bottom: t(a) + dual metrics -->
  <rect x="40" y="368" width="721" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="400" y="391" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">The dual side of matching: ads also need labels t(a) (advertiser/campaign/keywords, or manual categorization)</text>
  <text x="400" y="412" text-anchor="middle" font-size="12" fill="#64748b">Every targeting type must offer both "broad but high-coverage" and "precise but small-volume" labels, so the market competes fully</text>

  <text x="400" y="458" text-anchor="middle" font-size="12" fill="#64748b">t(c) vs t(u): the former is set by the current environment (computed online, instantly), the latter by historical logs (processed offline in batches)</text>
</svg>
