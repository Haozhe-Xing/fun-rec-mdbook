<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="340" fill="#f8f9fc" rx="12"/>

  <text x="400" y="34" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">Matrix Factorization: Modeling Users and Items in a Latent Space</text>

  <!-- rating matrix (sparse) -->
  <rect x="40" y="70" width="240" height="200" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="92" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1e293b">Rating Matrix R (sparse)</text>
  <g font-family="Courier New" font-size="14" text-anchor="middle">
    <text x="100" y="120" fill="#64748b">5</text><text x="140" y="120" fill="#64748b">?</text><text x="180" y="120" fill="#64748b">4</text><text x="220" y="120" fill="#64748b">?</text>
    <text x="100" y="150" fill="#64748b">?</text><text x="140" y="150" fill="#64748b">3</text><text x="180" y="150" fill="#64748b">?</text><text x="220" y="150" fill="#64748b">5</text>
    <text x="100" y="180" fill="#64748b">4</text><text x="140" y="180" fill="#64748b">?</text><text x="180" y="180" fill="#64748b">2</text><text x="220" y="180" fill="#64748b">?</text>
    <text x="100" y="210" fill="#64748b">?</text><text x="140" y="210" fill="#64748b">1</text><text x="180" y="210" fill="#64748b">?</text><text x="220" y="210" fill="#64748b">3</text>
    <text x="100" y="240" fill="#64748b">3</text><text x="140" y="240" fill="#64748b">?</text><text x="180" y="240" fill="#64748b">4</text><text x="220" y="240" fill="#64748b">?</text>
  </g>

  <!-- arrow decompose -->
  <line x1="280" y1="170" x2="338" y2="170" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
  </defs>

  <!-- P matrix (user factors) -->
  <rect x="350" y="70" width="190" height="95" rx="8" fill="#e8ecff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="445" y="92" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1e293b">User Matrix P</text>
  <text x="445" y="112" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">each row = user latent vector pᵤ</text>
  <g font-family="Courier New" font-size="11" fill="#1e293b" text-anchor="center">
    <text x="445" y="135">[0.8, 0.2, -0.3]</text>
  </g>

  <!-- Q matrix (item factors) -->
  <rect x="350" y="175" width="190" height="95" rx="8" fill="#e8ecff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="445" y="197" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1e293b">Item Matrix Q</text>
  <text x="445" y="217" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">each col = item latent vector qᵢ</text>
  <g font-family="Courier New" font-size="11" fill="#1e293b" text-anchor="center">
    <text x="445" y="240">[0.6, 0.4, 0.1]ᵀ</text>
  </g>

  <!-- inner product -->
  <rect x="580" y="120" width="180" height="70" rx="8" fill="#4A6CF7" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="670" y="150" text-anchor="middle" font-family="Courier New" font-size="15" font-weight="bold" fill="#ffffff">pᵤᵀ qᵢ</text>
  <text x="670" y="172" text-anchor="middle" font-family="Arial" font-size="10" fill="#e8ecff">dot product = predicted rating</text>

  <line x1="540" y1="110" x2="578" y2="135" stroke="#10b981" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="540" y1="235" x2="578" y2="175" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- factor axes -->
  <text x="445" y="292" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">Latent factor axes: male-oriented ↔ female-oriented · serious ↔ light</text>

  <line x1="40" y1="312" x2="760" y2="312" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="330" text-anchor="middle" font-family="Courier New" font-size="12" fill="#64748b">R ≈ P · Qᵀ   →   low-rank latent vectors break sparsity</text>
</svg>
