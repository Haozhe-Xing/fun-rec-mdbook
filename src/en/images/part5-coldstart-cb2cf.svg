<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <filter id="shC" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="340" fill="#f8f9fc" rx="12"/>

  <text x="400" y="34" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">CB2CF: Mapping Content Features to CF Representations</text>

  <!-- Content encoder -->
  <rect x="40" y="80" width="200" height="90" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#shC)"/>
  <text x="140" y="108" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#4A6CF7">Content Encoder</text>
  <text x="140" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">Text / Image / Category</text>
  <text x="140" y="150" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">CNN / RNN / Transformer</text>

  <!-- Mapping network -->
  <rect x="300" y="80" width="200" height="90" rx="8" fill="#4A6CF7" stroke="#1e293b" stroke-width="1.5" filter="url(#shC)"/>
  <text x="400" y="108" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#ffffff">Mapping Network</text>
  <text x="400" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#dbeafe">Multi-layer MLP</text>
  <text x="400" y="150" text-anchor="middle" font-family="Arial" font-size="11" fill="#dbeafe">f: C → V</text>

  <!-- Constraint -->
  <rect x="560" y="80" width="200" height="90" rx="8" fill="#e8ecff" stroke="#10b981" stroke-width="2" filter="url(#shC)"/>
  <text x="660" y="108" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#10b981">Constrained Training</text>
  <text x="660" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">Cosine similarity constraint</text>
  <text x="660" y="150" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">Keeps semantics consistent</text>

  <line x1="240" y1="125" x2="298" y2="125" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrC)"/>
  <line x1="500" y1="125" x2="558" y2="125" stroke="#10b981" stroke-width="2" marker-end="url(#arrC)"/>

  <!-- output -->
  <rect x="280" y="220" width="240" height="60" rx="8" fill="#10b981" stroke="#065f46" stroke-width="1.5" filter="url(#shC)"/>
  <text x="400" y="244" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff">New-Item CF Vector v̂_i = f(c_i)</text>
  <text x="400" y="266" text-anchor="middle" font-family="Arial" font-size="9" fill="#d1fae5">CF-quality embedding with zero interactions</text>

  <line x1="400" y1="170" x2="400" y2="218" stroke="#1e293b" stroke-width="2" marker-end="url(#arrC)"/>

  <rect x="0" y="300" width="800" height="40" fill="#1e293b" rx="0 0 12 12"/>
  <text x="400" y="324" text-anchor="middle" font-family="Courier New" font-size="13" fill="#94a3b8">For items with content: c_i → map → align with the true V rows</text>
</svg>
