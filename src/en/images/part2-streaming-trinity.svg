<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="340" fill="#f8f9fc" rx="12"/>

  <text x="400" y="34" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">Trinity：层次化聚类 + 统计直方图召回</text>

  <!-- long behavior seq -->
  <rect x="40" y="70" width="220" height="60" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="94" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e293b">长期行为序列 (≤2500)</text>
  <text x="150" y="114" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">含长尾/多元兴趣</text>

  <line x1="260" y1="100" x2="318" y2="100" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VQ clustering -->
  <rect x="330" y="70" width="180" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="94" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e293b">VQ 聚类</text>
  <text x="420" y="114" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">主128 / 次1024</text>

  <line x1="510" y1="100" x2="568" y2="100" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- histogram -->
  <rect x="580" y="60" width="190" height="80" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="675" y="82" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e293b">统计直方图</text>
  <g>
    <rect x="592" y="92" width="22" height="40" fill="#10b981"/>
    <rect x="620" y="100" width="22" height="32" fill="#4A6CF7"/>
    <rect x="648" y="100" width="22" height="32" fill="#4A6CF7"/>
    <rect x="676" y="120" width="22" height="12" fill="#f59e0b"/>
    <rect x="704" y="128" width="22" height="4" fill="#cbd5e1"/>
    <rect x="732" y="132" width="22" height="0" fill="#cbd5e1"/>
  </g>

  <!-- recallers -->
  <rect x="40" y="180" width="220" height="55" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="202" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e293b">Trinity-M 多元</text>
  <text x="150" y="222" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">唤醒被遗忘主题</text>

  <rect x="290" y="180" width="220" height="55" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="202" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e293b">Trinity-LT 长尾</text>
  <text x="400" y="222" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">间隔估计追踪小众</text>

  <rect x="540" y="180" width="220" height="55" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="202" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#065f46">Trinity-L 长期</text>
  <text x="650" y="222" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">种子 I2I 检索</text>

  <line x1="675" y1="140" x2="150" y2="178" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="675" y1="140" x2="400" y2="178" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="675" y1="140" x2="650" y2="178" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="290" y="260" width="220" height="46" rx="8" fill="#4A6CF7" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="282" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff">合并召回候选</text>
  <text x="400" y="299" text-anchor="middle" font-family="Arial" font-size="11" fill="#e8ecff">三召回器互补</text>

  <line x1="40" y1="318" x2="760" y2="318" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="334" text-anchor="middle" font-family="Courier New" font-size="11" fill="#64748b">行为→聚类直方图→M/LT/L 三召回器 → 永不遗忘</text>
</svg>
