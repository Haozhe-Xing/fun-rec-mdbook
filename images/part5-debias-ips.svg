<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <filter id="shG" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="320" fill="#f8f9fc" rx="12"/>

  <text x="400" y="34" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#1e293b">IPS 逆倾向得分：以观测概率的倒数重新加权</text>

  <!-- Left: naive -->
  <rect x="40" y="70" width="330" height="200" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2" filter="url(#shG)"/>
  <text x="205" y="98" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#ef4444">朴素统计（有偏）</text>
  <text x="205" y="128" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">恐怖片爱好者 × 爱情片 P=0.1 → 低分</text>
  <text x="205" y="150" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">观测到的样本稀少，被忽略</text>
  <text x="205" y="180" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">恐怖片 × 恐怖片 P=0.8 → 高分</text>
  <text x="205" y="202" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">样本充足，主导统计</text>
  <text x="205" y="240" text-anchor="middle" font-family="Courier New" font-size="13" font-weight="bold" fill="#ef4444">→ 高估两类电影偏好差</text>

  <!-- Right: IPS -->
  <rect x="430" y="70" width="330" height="200" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shG)"/>
  <text x="595" y="98" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#10b981">IPS 加权（无偏）</text>
  <text x="595" y="128" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">罕见低分评价 权重 = 1/0.1 = 10×</text>
  <text x="595" y="150" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">来之不易的信号被放大</text>
  <text x="595" y="180" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">常见高分评价 权重 = 1/0.8 = 1.25×</text>
  <text x="595" y="202" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">易得样本贡献被压低</text>
  <text x="595" y="240" text-anchor="middle" font-family="Courier New" font-size="13" font-weight="bold" fill="#10b981">→ 还原真实偏好分布</text>

  <!-- arrow between -->
  <line x1="370" y1="170" x2="428" y2="170" stroke="#1e293b" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="399" y="160" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">逆向</text>
  <text x="399" y="190" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">加权</text>

  <rect x="0" y="280" width="800" height="40" fill="#1e293b" rx="0 0 12 12"/>
  <text x="400" y="304" text-anchor="middle" font-family="Courier New" font-size="13" fill="#94a3b8">w(u,i) = 1 / P(O_u,i=1)   ← 低倾向得分获高权重</text>
</svg>
