<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow10g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <filter id="shadow10g" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="320" fill="#f8f9fc" rx="12"/>
  <text x="400" y="34" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#1e293b">AsymDiffRec：不对称扩散做特征补全</text>

  <!-- forward in raw space -->
  <rect x="30" y="70" width="350" height="90" rx="12" fill="#fef3cd" stroke="#f59e0b" stroke-width="2" filter="url(#shadow10g)"/>
  <text x="205" y="96" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#d97706">前向（原始特征空间）</text>
  <text x="205" y="120" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">离散特征 dropout（非高斯噪声）</text>
  <text x="205" y="144" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">x₀ → 随机丢 T 个特征 → x_T（缺失样本）</text>

  <!-- backward in latent space -->
  <rect x="420" y="70" width="350" height="90" rx="12" fill="#e8f5ee" stroke="#10b981" stroke-width="2" filter="url(#shadow10g)"/>
  <text x="595" y="96" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#16a34a">反向（潜在表示空间）</text>
  <text x="595" y="120" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">z_T = h(x_T) → g([s, z_T]) → z₀'</text>
  <text x="595" y="144" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">步长嵌入 s 标记缺失位置</text>

  <line x1="380" y1="115" x2="416" y2="115" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow10g)"/>
  <text x="398" y="103" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">不对称：不同空间</text>

  <!-- losses -->
  <g font-family="Courier New" font-size="12" text-anchor="middle">
    <rect x="40" y="190" width="230" height="50" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="1.5" filter="url(#shadow10g)"/>
    <text x="155" y="214" fill="#1e293b">L_recon = ‖z₀' − z₀‖²</text>
    <text x="155" y="232" font-family="Arial" font-size="11" fill="#64748b">重建完整表示</text>
    <rect x="285" y="190" width="230" height="50" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="1.5" filter="url(#shadow10g)"/>
    <text x="400" y="214" fill="#1e293b">L_aux = −y log f(z₀')</text>
    <text x="400" y="232" font-family="Arial" font-size="11" fill="#64748b">保留个性化信息</text>
    <rect x="530" y="190" width="230" height="50" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="1.5" filter="url(#shadow10g)"/>
    <text x="645" y="214" fill="#1e293b">L_main (完整样本)</text>
    <text x="645" y="232" font-family="Arial" font-size="11" fill="#64748b">主任务损失</text>
  </g>
  <text x="400" y="280" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">推理时直接把缺失样本 x₀ 当加噪输入，去噪补全 → 延迟影响极小（两层网络）</text>
</svg>
