<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="800" height="340" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">判别式推荐：对候选逐一打分择优</text>

  <!-- input -->
  <rect x="40" y="120" width="150" height="100" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#sh)"/>
  <text x="115" y="155" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">用户 u</text>
  <text x="115" y="178" text-anchor="middle" font-size="13" fill="#64748b">+ 上下文 c</text>
  <text x="115" y="200" text-anchor="middle" font-size="11" fill="#64748b">理解 U / I / C</text>

  <!-- scorer -->
  <rect x="300" y="120" width="170" height="100" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#sh)"/>
  <text x="385" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#4A6CF7">打分函数 fθ</text>
  <text x="385" y="182" text-anchor="middle" font-size="12" fill="#64748b">Score = f(u, i, c)</text>
  <text x="385" y="205" text-anchor="middle" font-size="11" fill="#64748b">逐候选独立评估</text>

  <!-- candidates -->
  <g font-size="12">
    <rect x="560" y="70" width="120" height="46" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2"/>
    <text x="620" y="92" text-anchor="middle" fill="#1e293b">物品 i₁</text>
    <text x="620" y="108" text-anchor="middle" fill="#64748b">0.62</text>
    <rect x="560" y="130" width="120" height="46" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
    <text x="620" y="152" text-anchor="middle" font-weight="700" fill="#10b981">物品 i₂ ✓</text>
    <text x="620" y="168" text-anchor="middle" fill="#64748b">0.91 (Top1)</text>
    <rect x="560" y="190" width="120" height="46" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2"/>
    <text x="620" y="212" text-anchor="middle" fill="#1e293b">物品 i₃</text>
    <text x="620" y="228" text-anchor="middle" fill="#64748b">0.30</text>
  </g>

  <!-- arrows -->
  <line x1="190" y1="170" x2="296" y2="170" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="470" y1="170" x2="556" y2="158" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="470" y1="170" x2="556" y2="153" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="470" y1="170" x2="556" y2="213" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arr)"/>

  <text x="400" y="300" text-anchor="middle" font-size="13" fill="#64748b">评委打分：对每个候选单独算分，按分数高低发通行证——只打分，不创造列表。</text>
</svg>
