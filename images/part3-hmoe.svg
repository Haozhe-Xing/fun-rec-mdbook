<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="s19" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.15"/>
    </filter>
    <marker id="a19" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="400" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">HMoE：多专家 + 多场景塔 + 跨场景 stop-gradient 融合</text>

  <rect x="330" y="58" width="140" height="40" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#s19)"/>
  <text x="400" y="84" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">输入 x</text>
  <line x1="400" y1="98" x2="400" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a19)"/>

  <!-- experts -->
  <g font-size="11">
    <rect x="250" y="134" width="90" height="34" rx="6" fill="#e8ecff"/><text x="295" y="155" text-anchor="middle" fill="#4A6CF7">专家 e₁</text>
    <rect x="355" y="134" width="90" height="34" rx="6" fill="#e8ecff"/><text x="400" y="155" text-anchor="middle" fill="#4A6CF7">专家 e₂</text>
    <rect x="460" y="134" width="90" height="34" rx="6" fill="#e8ecff"/><text x="505" y="155" text-anchor="middle" fill="#4A6CF7">专家 e₃</text>
  </g>
  <text x="295" y="190" font-size="11" fill="#64748b">共享多场景特征</text>

  <!-- gates per scene -->
  <rect x="250" y="200" width="90" height="34" rx="8" fill="#f59e0b"/>
  <text x="295" y="222" text-anchor="middle" font-size="11.5" fill="#1e293b">门控 g₁</text>
  <rect x="355" y="200" width="90" height="34" rx="8" fill="#f59e0b"/>
  <text x="400" y="222" text-anchor="middle" font-size="11.5" fill="#1e293b">门控 g₂</text>
  <rect x="460" y="200" width="90" height="34" rx="8" fill="#f59e0b"/>
  <text x="505" y="222" text-anchor="middle" font-size="11.5" fill="#1e293b">门控 g₃</text>

  <line x1="295" y1="168" x2="295" y2="198" stroke="#64748b" stroke-width="2" marker-end="url(#a19)"/>
  <line x1="400" y1="168" x2="400" y2="198" stroke="#64748b" stroke-width="2" marker-end="url(#a19)"/>
  <line x1="505" y1="168" x2="505" y2="198" stroke="#64748b" stroke-width="2" marker-end="url(#a19)"/>

  <!-- scene towers -->
  <rect x="240" y="258" width="110" height="44" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#s19)"/>
  <text x="295" y="285" text-anchor="middle" font-size="12" fill="#1e293b">场景塔 S₁</text>
  <rect x="350" y="258" width="110" height="44" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#s19)"/>
  <text x="405" y="285" text-anchor="middle" font-size="12" fill="#1e293b">场景塔 S₂</text>
  <rect x="460" y="258" width="110" height="44" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#s19)"/>
  <text x="515" y="285" text-anchor="middle" font-size="12" fill="#1e293b">场景塔 S₃</text>

  <line x1="295" y1="234" x2="295" y2="256" stroke="#64748b" stroke-width="2" marker-end="url(#a19)"/>
  <line x1="400" y1="234" x2="405" y2="256" stroke="#64748b" stroke-width="2" marker-end="url(#a19)"/>
  <line x1="505" y1="234" x2="515" y2="256" stroke="#64748b" stroke-width="2" marker-end="url(#a19)"/>

  <!-- cross fusion -->
  <rect x="300" y="330" width="200" height="46" rx="8" fill="#1e293b" filter="url(#s19)"/>
  <text x="400" y="354" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">outₜ = WₜSₜ + Σⱼ≠ₜ Wⱼ·Sⱼ</text>
  <text x="400" y="372" text-anchor="middle" font-size="10.5" fill="#cbd5e1">其他场景 Sⱼ 加 stop-gradient</text>

  <line x1="295" y1="302" x2="360" y2="328" stroke="#64748b" stroke-width="2" marker-end="url(#a19)"/>
  <line x1="405" y1="302" x2="400" y2="328" stroke="#64748b" stroke-width="2" marker-end="url(#a19)"/>
  <line x1="515" y1="302" x2="440" y2="328" stroke="#64748b" stroke-width="2" marker-end="url(#a19)"/>
</svg>
