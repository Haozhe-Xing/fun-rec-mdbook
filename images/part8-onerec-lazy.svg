<svg width="800" height="380" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a83" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <filter id="s83" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="380" fill="#f8f9fc" rx="12"/>
  <text x="400" y="32" text-anchor="middle" font-family="Arial" font-size="16.5" font-weight="bold" fill="#1e293b">OneRec-V2：Lazy Decoder-Only 把算力集中到目标 Token</text>

  <!-- V1 encoder-decoder -->
  <rect x="30" y="58" width="350" height="150" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2" filter="url(#s83)"/>
  <text x="205" y="82" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#ef4444">V1 Encoder-Decoder（1:1）</text>
  <text x="50" y="108" font-family="Arial" font-size="12" fill="#1e293b">大量算力耗在「编码上下文」</text>
  <text x="50" y="128" font-family="Arial" font-size="12" fill="#1e293b">目标 Token 解码占比极低</text>
  <text x="50" y="150" font-family="Courier New" font-size="12" fill="#64748b">计算量 296.36 GFLOPs</text>
  <text x="50" y="178" font-family="Courier New" font-size="12" fill="#64748b">收敛损失 3.28</text>

  <line x1="380" y1="133" x2="428" y2="133" stroke="#64748b" stroke-width="2.5" marker-end="url(#a83)"/>

  <!-- V2 lazy -->
  <rect x="433" y="58" width="337" height="150" rx="10" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#s83)"/>
  <text x="601" y="82" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#4A6CF7">V2 Lazy Decoder-Only</text>
  <text x="453" y="108" font-family="Arial" font-size="12" fill="#1e293b">Context Processor：上下文→静态键值对</text>
  <text x="453" y="128" font-family="Arial" font-size="12" fill="#1e293b">多层解码器共享，无需重算</text>
  <text x="453" y="150" font-family="Courier New" font-size="12" fill="#64748b">输入仅 [BOS,s¹,s²] = 3 Token</text>
  <text x="453" y="178" font-family="Courier New" font-size="12" fill="#10b981">计算量 18.89 GFLOPs / 损失 3.27</text>

  <!-- efficiency bar -->
  <text x="30" y="248" font-family="Arial" font-size="13" font-weight="bold" fill="#1e293b">计算量对比（越低越好，单位 GFLOPs）</text>
  <rect x="30" y="262" width="360" height="26" rx="6" fill="#ef4444"/>
  <text x="210" y="280" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">V1: 296.36</text>
  <rect x="410" y="262" width="360" height="26" rx="6" fill="#e8ecff"/>
  <rect x="410" y="262" width="23" height="26" rx="6" fill="#4A6CF7"/>
  <text x="590" y="280" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">V2: 18.89</text>

  <rect x="60" y="310" width="680" height="50" rx="8" fill="#fef9ec" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="334" text-anchor="middle" font-family="Arial" font-size="13" fill="#92400e">计算开销 −94% · 训练资源 −90% · 且验证 Scaling Law：0.1B→8B 幂律衰减</text>
</svg>
