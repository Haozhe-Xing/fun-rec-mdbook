  </defs>
  <rect x="0" y="0" width="800" height="360" fill="#f8f9fc" rx="12"/>
  <text x="400" y="32" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">FunRec 电影推荐系统：浏览器中的完整交互闭环</text>
  <rect x="300" y="60" width="200" height="70" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#sh)"/>
  <text x="400" y="91" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#4A6CF7">用户 (浏览器)</text>
  <text x="400" y="109" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">浏览 / 搜索 / 评分</text>
  <line x1="400" y1="130" x2="400" y2="175" stroke="#4A6CF7" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="280" y="180" width="240" height="60" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#sh)"/>
  <text x="400" y="206" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1e293b">推荐系统 (在线)</text>
  <text x="400" y="224" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">召回 → 排序 → 重排</text>
