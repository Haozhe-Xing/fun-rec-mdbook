  <text x="400" y="304" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1e293b">存储层 + 离线训练</text>
  <text x="400" y="322" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">PG / Redis / ES / 模型</text>
  <text x="640" y="215" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">用户行为反馈</text>
  <line x1="520" y1="210" x2="540" y2="210" stroke="#f59e0b" stroke-width="2" marker-end="url(#aw)" stroke-dasharray="4 3"/>
