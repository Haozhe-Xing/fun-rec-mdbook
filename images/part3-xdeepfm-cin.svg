<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="s9" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.15"/>
    </filter>
    <marker id="a9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="430" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">xDeepFM：CIN 在向量级做显式高阶交互</text>

  <!-- X0 -->
  <rect x="340" y="58" width="120" height="44" rx="8" fill="#1e293b" filter="url(#s9)"/>
  <text x="400" y="85" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">X⁰ 原始输入</text>
  <text x="400" y="104" text-anchor="middle" font-size="10.5" fill="#cbd5e1">m×D 特征域矩阵</text>

  <!-- CIN layers -->
  <g font-size="11.5">
    <rect x="150" y="140" width="180" height="56" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#s9)"/>
    <text x="240" y="164" text-anchor="middle" fill="#1e293b" font-weight="700">CIN Layer 1</text>
    <text x="240" y="184" text-anchor="middle" fill="#64748b">向量⊙ → 压缩</text>

    <rect x="330" y="220" width="180" height="56" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#s9)"/>
    <text x="420" y="244" text-anchor="middle" fill="#1e293b" font-weight="700">CIN Layer 2</text>
    <text x="420" y="264" text-anchor="middle" fill="#64748b">含 3 阶交互</text>

    <rect x="510" y="300" width="180" height="56" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#s9)"/>
    <text x="600" y="324" text-anchor="middle" fill="#1e293b" font-weight="700">CIN Layer T</text>
    <text x="600" y="344" text-anchor="middle" fill="#64748b">含 T+1 阶交互</text>
  </g>

  <line x1="400" y1="102" x2="240" y2="138" stroke="#64748b" stroke-width="2" marker-end="url(#a9)"/>
  <line x1="330" y1="196" x2="340" y2="218" stroke="#64748b" stroke-width="2" marker-end="url(#a9)"/>
  <line x1="420" y1="276" x2="510" y2="298" stroke="#64748b" stroke-width="2" marker-end="url(#a9)"/>

  <!-- vector-wise hadamard note -->
  <line x1="240" y1="168" x2="160" y2="248" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a9)"/>
  <text x="90" y="252" text-anchor="middle" font-size="11" fill="#f59e0b">Xᵏ⁻¹ ⊙ X⁰</text>
  <text x="90" y="268" text-anchor="middle" font-size="11" fill="#f59e0b">向量级哈达玛积</text>

  <!-- sum pooling -->
  <rect x="150" y="300" width="180" height="56" rx="8" fill="#e6f7f1" stroke="#10b981" stroke-width="2"/>
  <text x="240" y="324" text-anchor="middle" fill="#1e293b" font-weight="700">Sum Pooling</text>
  <text x="240" y="344" text-anchor="middle" fill="#64748b">每层压缩成 pₖ</text>
  <line x1="240" y1="196" x2="240" y2="298" stroke="#64748b" stroke-width="2" marker-end="url(#a9)"/>

  <!-- concat + output -->
  <rect x="330" y="375" width="440" height="40" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="550" y="400" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="700">p⁺=[p₁,p₂,…,p_T] + 线性 + DNN → σ</text>
  <line x1="240" y1="356" x2="380" y2="373" stroke="#64748b" stroke-width="2" marker-end="url(#a9)"/>
  <line x1="600" y1="356" x2="600" y2="373" stroke="#64748b" stroke-width="2" marker-end="url(#a9)"/>
</svg>
