<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" font-family="Arial, sans-serif">
  <defs>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/></marker>
    <filter id="so" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="800" height="360" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">RQ-OPQ 混合编码：层次语义 + 独特属性</text>

  <!-- input item -->
  <rect x="40" y="150" width="140" height="60" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#so)"/>
  <text x="110" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">iPhone 15</text>
  <text x="110" y="197" text-anchor="middle" font-size="11" fill="#64748b">粉 / 256G</text>

  <!-- RQ branch -->
  <rect x="220" y="60" width="240" height="80" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#so)"/>
  <text x="340" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#10b981">RQ-Kmeans（层次）</text>
  <text x="340" y="108" text-anchor="middle" font-size="12" fill="#1e293b">[102, 8, 1]</text>
  <text x="340" y="128" text-anchor="middle" font-size="11" fill="#64748b">电子产品→手机→Apple</text>

  <!-- OPQ branch -->
  <rect x="220" y="210" width="240" height="80" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#so)"/>
  <text x="340" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#f59e0b">OPQ（独特属性）</text>
  <text x="340" y="258" text-anchor="middle" font-size="12" fill="#1e293b">[56, 99]</text>
  <text x="340" y="278" text-anchor="middle" font-size="11" fill="#64748b">粉色 / 256G 残差编码</text>

  <line x1="180" y1="165" x2="216" y2="120" stroke="#4A6CF7" stroke-width="2" marker-end="url(#ao)"/>
  <line x1="180" y1="175" x2="216" y2="240" stroke="#4A6CF7" stroke-width="2" marker-end="url(#ao)"/>

  <!-- final ID -->
  <rect x="540" y="120" width="220" height="110" rx="10" fill="#ffffff" stroke="#4A6CF7" stroke-width="3" filter="url(#so)"/>
  <text x="650" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#4A6CF7">最终 Semantic ID</text>
  <text x="650" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">[102, 8, 1, 56, 99]</text>
  <text x="650" y="208" text-anchor="middle" font-size="11" fill="#64748b">5 令牌：3 层 RQ + 2 层 OPQ</text>

  <line x1="460" y1="100" x2="536" y2="150" stroke="#10b981" stroke-width="2" marker-end="url(#ao)"/>
  <line x1="460" y1="250" x2="536" y2="190" stroke="#f59e0b" stroke-width="2" marker-end="url(#ao)"/>

  <text x="400" y="335" text-anchor="middle" font-size="12" fill="#64748b">RQ 管共性语义（层级召回），OPQ 管个性特征（长尾精确区分）。</text>
</svg>
