<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr15" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <filter id="sh15"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="800" height="400" fill="#f8f9fc"/>
  <text x="400" y="34" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">OneTrans Block：Mixed Parameterization</text>

  <!-- S-tokens (shared) -->
  <rect x="40" y="60" width="350" height="130" rx="12" fill="#ffffff" stroke="#e8ecff" filter="url(#sh15)"/>
  <text x="215" y="84" font-size="13" font-weight="700" fill="#4A6CF7" text-anchor="middle">S-tokens（行为序列）—— 共享参数</text>
  <g font-size="11" text-anchor="middle">
    <rect x="60" y="100" width="50" height="30" rx="6" fill="#f0f4ff" stroke="#4A6CF7"/><text x="85" y="120">S₁</text>
    <rect x="120" y="100" width="50" height="30" rx="6" fill="#f0f4ff" stroke="#4A6CF7"/><text x="145" y="120">S₂</text>
    <rect x="180" y="100" width="50" height="30" rx="6" fill="#f0f4ff" stroke="#4A6CF7"/><text x="205" y="120">S₃</text>
    <rect x="240" y="100" width="50" height="30" rx="6" fill="#f0f4ff" stroke="#4A6CF7"/><text x="265" y="120">S₄</text>
    <rect x="300" y="100" width="50" height="30" rx="6" fill="#f0f4ff" stroke="#4A6CF7"/><text x="325" y="120">S₅</text>
  </g>
  <text x="215" y="160" font-size="11" fill="#64748b" text-anchor="middle">共用 W_S^Q,K,V + 共享 FFN ｜ 因果依赖（只看之前）</text>

  <!-- NS-tokens (independent) -->
  <rect x="40" y="210" width="350" height="130" rx="12" fill="#ffffff" stroke="#e8ecff" filter="url(#sh15)"/>
  <text x="215" y="234" font-size="13" font-weight="700" fill="#ef4444" text-anchor="middle">NS-tokens（非序列）—— 独立参数</text>
  <g font-size="11" text-anchor="middle">
    <rect x="60" y="250" width="70" height="30" rx="6" fill="#fef2f2" stroke="#ef4444"/><text x="95" y="270">NS₁(W¹)</text>
    <rect x="145" y="250" width="70" height="30" rx="6" fill="#fef2f2" stroke="#ef4444"/><text x="180" y="270">NS₂(W²)</text>
    <rect x="230" y="250" width="70" height="30" rx="6" fill="#fef2f2" stroke="#ef4444"/><text x="265" y="270">NS₃(W³)</text>
  </g>
  <text x="215" y="310" font-size="11" fill="#64748b" text-anchor="middle">各 token 独立 W^Q,K,V,FFN ｜ 全局 attend 所有 S + 之前 NS</text>

  <!-- center: unified attention -->
  <rect x="430" y="120" width="320" height="160" rx="12" fill="#ffffff" stroke="#e8ecff" filter="url(#sh15)"/>
  <text x="590" y="148" font-size="13" font-weight="700" fill="#10b981" text-anchor="middle">统一 Attention 矩阵</text>
  <text x="590" y="180" font-size="11.5" fill="#1e293b" text-anchor="middle">S-side 因果：Sᵢ 只看 S&lt;i</text>
  <text x="590" y="205" font-size="11.5" fill="#1e293b" text-anchor="middle">NS-side 全局：NSᵢ attend 全部 S</text>
  <text x="590" y="230" font="11" fill="#1e293b" text-anchor="middle">两类特征在同矩阵交互</text>
  <text x="590" y="258" font-size="11" fill="#64748b" text-anchor="middle">Pre-norm + RMSNorm 稳训练</text>

  <line x1="390" y1="125" x2="430" y2="185" stroke="#64748b" marker-end="url(#arr15)"/>
  <line x1="390" y1="275" x2="430" y2="240" stroke="#64748b" marker-end="url(#arr15)"/>

  <text x="400" y="385" font-size="12" fill="#64748b" text-anchor="middle">参数共享是设计（S 同质），非妥协；NS 独立捕捉异构空间 — 比每 token 独立更省（L_NS ≪ L_S）</text>
</svg>
