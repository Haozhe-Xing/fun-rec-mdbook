<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="800" height="340" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">生成式推荐：自回归序列生成</text>

  <!-- history -->
  <rect x="40" y="120" width="180" height="100" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2" filter="url(#sh2)"/>
  <text x="130" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">历史交互 i₁:T</text>
  <text x="130" y="172" text-anchor="middle" font-size="12" fill="#64748b">+ 用户 u + 上下文 c</text>
  <text x="130" y="196" text-anchor="middle" font-size="11" fill="#64748b">学习 pθ(i₁:T | u,c)</text>

  <!-- generative model -->
  <rect x="300" y="115" width="190" height="110" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#sh2)"/>
  <text x="395" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#10b981">生成模型 gθ</text>
  <text x="395" y="176" text-anchor="middle" font-size="12" fill="#64748b">∏ pθ(iₜ | i₍ₜ₎, u, c)</text>
  <text x="395" y="200" text-anchor="middle" font-size="11" fill="#64748b">自回归逐 token 解码</text>

  <!-- produced sequence -->
  <g font-size="13">
    <rect x="560" y="70" width="60" height="44" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="590" y="97" text-anchor="middle" fill="#1e293b">i′₁</text>
    <rect x="560" y="124" width="60" height="44" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="590" y="151" text-anchor="middle" fill="#1e293b">i′₂</text>
    <rect x="560" y="178" width="60" height="44" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="590" y="205" text-anchor="middle" fill="#1e293b">i′₃</text>
    <text x="640" y="225" font-size="22" fill="#10b981">…</text>
  </g>

  <!-- self-loop arrow on model -->
  <path d="M470,170 C510,210 450,250 410,210" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="500" y="245" font-size="11" fill="#10b981">自回归回流</text>

  <line x1="220" y1="170" x2="296" y2="170" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="490" y1="170" x2="556" y2="135" stroke="#10b981" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="490" y1="170" x2="556" y2="146" stroke="#10b981" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="490" y1="170" x2="556" y2="200" stroke="#10b981" stroke-width="2" marker-end="url(#arr2)"/>

  <text x="400" y="300" text-anchor="middle" font-size="13" fill="#64748b">朋友推荐：理解喜好脉络后直接「创造」序列，无需逐一评估候选——信息沿时间回流。</text>
</svg>
