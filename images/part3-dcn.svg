<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" font-family="Arial, sans-serif">
  <defs>
    <filter id="s8" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.15"/>
    </filter>
    <marker id="a8" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="430" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">DCN：Cross Network 通过残差与 x₀ 持续交叉实现高阶</text>

  <!-- x0 -->
  <rect x="350" y="60" width="100" height="46" rx="8" fill="#1e293b" filter="url(#s8)"/>
  <text x="400" y="88" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">x₀ 输入</text>

  <!-- layers -->
  <g font-size="12">
    <rect x="300" y="140" width="200" height="50" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#s8)"/>
    <text x="400" y="162" text-anchor="middle" fill="#1e293b" font-weight="700">Cross Layer 1</text>
    <text x="400" y="182" text-anchor="middle" fill="#64748b">x₁ = x₀(x₀ᵀw₀)+b₀+x₀</text>

    <rect x="300" y="220" width="200" height="50" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#s8)"/>
    <text x="400" y="242" text-anchor="middle" fill="#1e293b" font-weight="700">Cross Layer 2</text>
    <text x="400" y="262" text-anchor="middle" fill="#64748b">x₂ = x₀(x₁ᵀw₁)+b₁+x₁</text>

    <rect x="300" y="300" width="200" height="50" rx="8" fill="#ffffff" stroke="#4A6CF7" stroke-width="2" filter="url(#s8)"/>
    <text x="400" y="322" text-anchor="middle" fill="#1e293b" font-weight="700">Cross Layer L</text>
    <text x="400" y="342" text-anchor="middle" fill="#64748b">含 L+1 阶交叉</text>
  </g>

  <line x1="400" y1="106" x2="400" y2="138" stroke="#64748b" stroke-width="2" marker-end="url(#a8)"/>
  <line x1="400" y1="190" x2="400" y2="218" stroke="#64748b" stroke-width="2" marker-end="url(#a8)"/>
  <line x1="400" y1="270" x2="400" y2="298" stroke="#64748b" stroke-width="2" marker-end="url(#a8)"/>

  <!-- cross term from x0 -->
  <line x1="350" y1="165" x2="295" y2="245" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a8)"/>
  <line x1="350" y1="165" x2="295" y2="325" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a8)"/>
  <text x="150" y="250" text-anchor="middle" font-size="11" fill="#f59e0b">x₀ 持续交叉</text>
  <text x="150" y="266" text-anchor="middle" font-size="11" fill="#f59e0b">（残差连接）</text>

  <!-- parallel DNN -->
  <rect x="560" y="220" width="170" height="130" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#s8)"/>
  <rect x="560" y="220" width="170" height="32" rx="8" fill="#10b981"/>
  <text x="645" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Deep Network</text>
  <text x="645" y="282" text-anchor="middle" font-size="12" fill="#1e293b">隐式高阶</text>
  <text x="645" y="304" text-anchor="middle" font-size="12" fill="#1e293b">非线性</text>
  <line x1="400" y1="86" x2="560" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#a8)"/>

  <!-- merge -->
  <rect x="330" y="375" width="260" height="40" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="460" y="400" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="700">拼接 → 逻辑回归 → σ</text>
  <line x1="400" y1="350" x2="420" y2="373" stroke="#64748b" stroke-width="2" marker-end="url(#a8)"/>
  <line x1="645" y1="332" x2="540" y2="378" stroke="#64748b" stroke-width="2" marker-end="url(#a8)"/>
</svg>
