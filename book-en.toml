[book]
title = "Deep Recommender Systems in Practice (Fun-Rec Book)"
description = "From cascading architectures to generative paradigms — a systematic guide to recommender systems"
authors = ["Datawhale", "WorkBuddy Rewrite Edition"]
language = "en"
src = "src/en"

[build]
build-dir = "book/en"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["styles/website.css"]
additional-js = ["scripts/viz-expand.js", "scripts/in-page-toc.js", "scripts/callouts.js"]

[output.html.search]
enable = true

[output.html.print]
enable = true

[preprocessor.katex]
after = ["links"]
